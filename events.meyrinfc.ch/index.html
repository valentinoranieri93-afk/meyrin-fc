<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Meyrin FC · Hub Événements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --jaune:#ffdd00;
  --jaune-fonce:#c5a900;
  --jaune-soft:#FFF3C4;
  --noir:#15140F;
  --noir-2:#211F18;
  --noir-3:#2C2A21;
  --encre:#1A1915;
  --gris:#6E6C61;
  --gris-2:#9A988C;
  --ligne:#E9E6DC;
  --ligne-2:#F0EDE4;
  --bg:#F6F4ED;
  --carte:#FFFFFF;
  --vert:#1F9D5B;
  --vert-bg:#E4F4EA;
  --rouge:#D8463A;
  --rouge-bg:#FBE7E4;
  --orange:#E8902A;
  --orange-bg:#FCEEDB;
  --bleu:#3B6FE0;
  --bleu-bg:#E6EDFB;
  --violet:#7B59D8;
  --violet-bg:#EEE8FB;
  --ombre-s:0 1px 2px rgba(20,18,10,.05);
  --ombre:0 1px 2px rgba(20,18,10,.04), 0 6px 20px rgba(20,18,10,.06);
  --ombre-l:0 10px 40px rgba(20,18,10,.14);
  --r:14px;
  --r-s:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter",-apple-system,system-ui,sans-serif;
  background:var(--bg);
  color:var(--encre);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,h4,.dsp{font-family:"Sora","Inter",sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d9d6cb;border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#c5c2b6}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:256px 1fr;height:100vh;overflow:hidden}

/* ---- Sidebar ---- */
.sidebar{
  background:var(--noir);color:#E8E6DD;display:flex;flex-direction:column;
  padding:0;overflow:hidden;position:relative;
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px}
.brand-logo{width:40px;height:40px;object-fit:contain;flex-shrink:0}
.brand-name{font-family:"Sora";font-weight:700;font-size:15px;letter-spacing:-.2px;line-height:1.1}
.brand-sub{font-size:11px;color:#8C897C;margin-top:2px;font-weight:500}
.nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
.nav::-webkit-scrollbar-thumb{background:#3a382e;border-color:var(--noir)}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#75736A;
  font-weight:700;padding:14px 12px 7px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border-radius:9px;color:#C9C7BD;font-size:13.5px;font-weight:500;
  transition:.13s;position:relative;margin-bottom:1px
}
.nav-item:hover{background:#211F18;color:#fff}
.nav-item.active{background:var(--jaune);color:var(--noir);font-weight:600}
.nav-item.active .nav-ic{color:var(--noir)}
.nav-ic{width:18px;height:18px;flex-shrink:0;color:#8E8C82}
.nav-item:hover .nav-ic{color:#fff}
.nav-badge{margin-left:auto;background:#34322a;color:#D7D4C8;font-size:11px;font-weight:700;
  padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:rgba(0,0,0,.13);color:var(--noir)}
.nav-badge.alert{background:var(--rouge);color:#fff}
.sidebar-foot{padding:12px;border-top:1px solid #28261E;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#ffdd00,#c5a900);
  color:var(--noir);display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:13px;flex-shrink:0}
.foot-name{font-size:13px;font-weight:600;color:#fff;line-height:1.2}
.foot-role{font-size:11px;color:#85837A}
.foot-gear{margin-left:auto;color:#85837A;padding:6px}
.foot-gear:hover{color:#fff}

/* ---- Main ---- */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{
  height:62px;display:flex;align-items:center;gap:16px;padding:0 26px;flex-shrink:0;
  border-bottom:1px solid var(--ligne);background:rgba(246,244,237,.85);backdrop-filter:blur(8px);
  position:relative;z-index:5
}
.page-title{font-family:"Sora";font-size:20px;font-weight:700;letter-spacing:-.4px}
.page-sub{font-size:12.5px;color:var(--gris);margin-top:1px;font-weight:450}
.topbar-spacer{flex:1}
.search{display:flex;align-items:center;gap:9px;background:var(--carte);border:1px solid var(--ligne);
  border-radius:10px;padding:8px 13px;width:300px;transition:.15s}
.search:focus-within{border-color:var(--jaune-fonce);box-shadow:0 0 0 3px var(--jaune-soft)}
.search input{border:none;background:none;flex:1;font-size:13px}
.search svg{color:var(--gris-2);width:16px;height:16px}
.search kbd{font-size:10.5px;color:var(--gris-2);background:var(--bg);border:1px solid var(--ligne);
  border-radius:5px;padding:1px 5px;font-family:inherit}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--ligne);background:var(--carte);
  display:flex;align-items:center;justify-content:center;color:var(--gris);position:relative;transition:.13s}
.icon-btn:hover{border-color:var(--gris-2);color:var(--encre)}
.icon-btn svg{width:18px;height:18px}
.dot-alert{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;
  background:var(--rouge);border:2px solid var(--carte)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
  font-weight:600;font-size:13px;transition:.13s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--jaune);color:var(--noir);box-shadow:0 2px 10px rgba(255,221,0,.35)}
.btn-primary:hover{background:var(--jaune-fonce);transform:translateY(-1px)}
.btn-ghost{background:var(--carte);border:1px solid var(--ligne);color:var(--encre)}
.btn-ghost:hover{border-color:var(--gris-2)}
.btn-dark{background:var(--noir);color:#fff}
.btn-dark:hover{background:var(--noir-3)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}

.content{flex:1;overflow-y:auto;padding:26px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ KPI ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:16px 17px;
  box-shadow:var(--ombre-s);position:relative;overflow:hidden;transition:.15s}
.kpi:hover{box-shadow:var(--ombre);transform:translateY(-2px)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.kpi-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.kpi-ico svg{width:18px;height:18px}
.kpi-trend{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:20px;display:flex;align-items:center;gap:3px}
.kpi-trend svg{width:11px;height:11px}
.trend-up{background:var(--vert-bg);color:var(--vert)}
.trend-down{background:var(--rouge-bg);color:var(--rouge)}
.trend-flat{background:var(--ligne-2);color:var(--gris)}
.kpi-val{font-family:"Sora";font-size:25px;font-weight:700;letter-spacing:-.8px;line-height:1}
.kpi-lbl{font-size:12.5px;color:var(--gris);margin-top:5px;font-weight:500}

/* mini kpi row */
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.mini{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:13px 15px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--ombre-s)}
.mini-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-ico svg{width:18px;height:18px}
.mini-val{font-family:"Sora";font-size:19px;font-weight:700;letter-spacing:-.5px;line-height:1}
.mini-lbl{font-size:11.5px;color:var(--gris);margin-top:2px}

/* ============ CARDS / PANELS ============ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);box-shadow:var(--ombre-s);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--ligne-2)}
.panel-title{font-family:"Sora";font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.panel-act{font-size:12.5px;color:var(--gris);font-weight:600;display:flex;align-items:center;gap:5px}
.panel-act:hover{color:var(--encre)}
.panel-body{padding:18px}

.chart-legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:12px}
.lg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gris);font-weight:500}
.lg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* lists in dashboard */
.row-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ligne-2)}
.row-item:last-child{border-bottom:none}
.row-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.row-main{flex:1;min-width:0}
.row-t{font-size:13.5px;font-weight:600;line-height:1.25}
.row-s{font-size:12px;color:var(--gris);margin-top:1px}
.row-meta{font-size:12px;color:var(--gris-2);font-weight:600;text-align:right;flex-shrink:0}

/* alert items */
.alert-item{display:flex;gap:11px;padding:11px 13px;border-radius:10px;margin-bottom:8px;align-items:flex-start}
.alert-item:last-child{margin-bottom:0}
.alert-r{background:var(--rouge-bg)}
.alert-o{background:var(--orange-bg)}
.alert-b{background:var(--bleu-bg)}
.alert-ico{flex-shrink:0;margin-top:1px}
.alert-ico svg{width:17px;height:17px}
.alert-t{font-size:13px;font-weight:600;line-height:1.3}
.alert-s{font-size:12px;color:var(--gris);margin-top:1px}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge .bd{width:6px;height:6px;border-radius:50%}
.st-idee{background:var(--ligne-2);color:var(--gris)}
.st-validation{background:var(--violet-bg);color:var(--violet)}
.st-preparation{background:var(--bleu-bg);color:var(--bleu)}
.st-communication{background:var(--orange-bg);color:var(--orange)}
.st-cours{background:var(--jaune-soft);color:#A07800}
.st-termine{background:var(--vert-bg);color:var(--vert)}
.st-annule{background:var(--rouge-bg);color:var(--rouge)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:7px;background:var(--bg);color:var(--gris);border:1px solid var(--ligne)}

/* ============ TABLE ============ */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2);
  font-weight:700;text-align:left;padding:11px 16px;border-bottom:1px solid var(--ligne);white-space:nowrap}
tbody td{padding:13px 16px;border-bottom:1px solid var(--ligne-2);font-size:13.5px;vertical-align:middle}
tbody tr{transition:.1s}
tbody tr:hover{background:var(--bg)}
tbody tr:last-child td{border-bottom:none}
.cell-strong{font-weight:600}
.mini-bar{height:7px;border-radius:5px;background:var(--ligne-2);overflow:hidden;min-width:80px}
.mini-bar span{display:block;height:100%;border-radius:5px}

/* ============ KANBAN ============ */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.seg{display:flex;background:var(--carte);border:1px solid var(--ligne);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--gris);display:flex;align-items:center;gap:6px}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--noir);color:#fff}
.filter-sel{background:var(--carte);border:1px solid var(--ligne);border-radius:10px;padding:8px 12px;
  font-size:13px;font-weight:500;color:var(--encre);cursor:pointer}
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{background:#EFEDE4;border-radius:13px;width:280px;flex-shrink:0;padding:6px}
.kcol-head{display:flex;align-items:center;gap:8px;padding:10px 11px 9px}
.kcol-dot{width:9px;height:9px;border-radius:50%}
.kcol-name{font-weight:700;font-size:13px;font-family:"Sora"}
.kcol-count{font-size:11.5px;color:var(--gris);background:rgba(0,0,0,.06);padding:1px 8px;border-radius:20px;font-weight:700}
.kcol-add{margin-left:auto;color:var(--gris);padding:3px}
.kcol-add:hover{color:var(--encre)}
.kcards{display:flex;flex-direction:column;gap:8px;min-height:30px;padding:0 3px 6px}
.kcard{background:var(--carte);border:1px solid var(--ligne);border-radius:11px;padding:12px;
  box-shadow:var(--ombre-s);cursor:pointer;transition:.13s}
.kcard:hover{box-shadow:var(--ombre);transform:translateY(-2px);border-color:#d9d6cb}
.kcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kcard-type{font-size:11px;font-weight:700;color:var(--gris)}
.kcard-title{font-size:13.5px;font-weight:600;line-height:1.3;margin-bottom:9px}
.kcard-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--gris);flex-wrap:wrap}
.kcard-meta span{display:flex;align-items:center;gap:4px}
.kcard-meta svg{width:13px;height:13px}
.kprog{height:5px;background:var(--ligne-2);border-radius:5px;margin-top:10px;overflow:hidden}
.kprog span{display:block;height:100%;background:var(--jaune);border-radius:5px}
.kcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.avstack{display:flex}
.avstack .av{width:24px;height:24px;border-radius:50%;border:2px solid var(--carte);margin-left:-7px;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.avstack .av:first-child{margin-left:0}

/* ============ DRAWER ============ */
.overlay{position:fixed;inset:0;background:rgba(20,18,10,.5);backdrop-filter:blur(2px);z-index:40;
  opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:620px;max-width:94vw;background:var(--bg);
  z-index:50;box-shadow:var(--ombre-l);transform:translateX(100%);transition:.32s cubic-bezier(.4,0,.1,1);
  display:flex;flex-direction:column;overflow:hidden}
.drawer.show{transform:none}
.drawer-head{padding:20px 24px 0;background:var(--carte);border-bottom:1px solid var(--ligne)}
.drawer-close{position:absolute;top:18px;right:20px;width:34px;height:34px;border-radius:9px;
  background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--gris)}
.drawer-close:hover{background:var(--ligne)}
.drawer-tabs{display:flex;gap:3px;margin-top:18px}
.drawer-tab{padding:10px 14px;font-size:13px;font-weight:600;color:var(--gris);border-bottom:2px solid transparent;margin-bottom:-1px}
.drawer-tab:hover{color:var(--encre)}
.drawer-tab.on{color:var(--encre);border-color:var(--jaune)}
.drawer-body{flex:1;overflow-y:auto;padding:22px 24px}
.dpane{display:none}.dpane.on{display:block}

.field{margin-bottom:15px}
.field-l{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2);margin-bottom:6px}
.field-v{font-size:14px;font-weight:500}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:15px}

/* checklist */
.chk-prog-wrap{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.chk-prog{flex:1;height:9px;background:var(--ligne-2);border-radius:6px;overflow:hidden}
.chk-prog span{display:block;height:100%;background:linear-gradient(90deg,#ffdd00,#c5a900);border-radius:6px;transition:.3s}
.chk-pct{font-family:"Sora";font-weight:700;font-size:15px}
.chk-item{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--carte);
  border:1px solid var(--ligne);border-radius:10px;margin-bottom:7px;transition:.13s}
.chk-item:hover{border-color:#d9d6cb}
.chk-box{width:21px;height:21px;border-radius:6px;border:2px solid var(--gris-2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:.13s}
.chk-box svg{width:13px;height:13px;color:#fff;opacity:0}
.chk-item.done .chk-box{background:var(--vert);border-color:var(--vert)}
.chk-item.done .chk-box svg{opacity:1}
.chk-txt{flex:1;font-size:13.5px;font-weight:500}
.chk-item.done .chk-txt{color:var(--gris-2);text-decoration:line-through}
.chk-who{font-size:11.5px;color:var(--gris);background:var(--bg);padding:3px 9px;border-radius:7px;font-weight:600}
.auto-pill{font-size:10px;font-weight:700;color:var(--bleu);background:var(--bleu-bg);padding:2px 7px;border-radius:6px}

/* budget mini */
.bud-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ligne-2);font-size:13.5px}
.bud-row:last-child{border:none}
.bud-tot{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-radius:10px;margin-top:8px;font-weight:700}

/* ============ VOLUNTEERS ============ */
.vol-board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.vol-col{background:var(--carte);border:1px solid var(--ligne);border-radius:13px;padding:14px;box-shadow:var(--ombre-s)}
.vol-col h4{font-size:13px;font-family:"Sora";display:flex;align-items:center;gap:7px;margin-bottom:12px}
.vol-chip{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;background:var(--bg);margin-bottom:7px;cursor:grab}
.vol-chip:active{cursor:grabbing}
.vol-av{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.vol-n{font-size:13px;font-weight:600;line-height:1.15}
.vol-m{font-size:11px;color:var(--gris)}
.load-bar{height:6px;border-radius:4px;background:var(--ligne-2);width:54px;overflow:hidden}
.load-bar span{display:block;height:100%}

/* ============ CALENDAR ============ */
.cal{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);overflow:hidden;box-shadow:var(--ombre-s)}
.cal-head{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--ligne-2)}
.cal-month{font-family:"Sora";font-size:17px;font-weight:700;min-width:150px}
.cal-nav{width:32px;height:32px;border-radius:8px;border:1px solid var(--ligne);display:flex;align-items:center;justify-content:center;color:var(--gris)}
.cal-nav:hover{border-color:var(--gris-2);color:var(--encre)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2);
  padding:10px;text-align:center;border-bottom:1px solid var(--ligne-2)}
.cal-cell{min-height:104px;border-right:1px solid var(--ligne-2);border-bottom:1px solid var(--ligne-2);padding:7px;position:relative}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.off{background:#FAF9F4}
.cal-num{font-size:12.5px;font-weight:600;color:var(--gris);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:7px}
.cal-cell.today .cal-num{background:var(--jaune);color:var(--noir)}
.cal-ev{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid}
.conflict-flag{position:absolute;top:6px;right:6px;color:var(--rouge)}
.conflict-flag svg{width:15px;height:15px}

/* ============ COMM / templates ============ */
.tmpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.tmpl{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:16px;box-shadow:var(--ombre-s);transition:.13s;cursor:pointer}
.tmpl:hover{box-shadow:var(--ombre);transform:translateY(-2px);border-color:#d9d6cb}
.tmpl-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.tmpl-ico svg{width:19px;height:19px}
.tmpl-t{font-family:"Sora";font-weight:700;font-size:14px}
.tmpl-d{font-size:12.5px;color:var(--gris);margin-top:3px;line-height:1.4}
.aud-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.aud-chip{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--carte);border:1.5px solid var(--ligne);
  border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.13s}
.aud-chip:hover{border-color:var(--gris-2)}
.aud-chip.on{border-color:var(--jaune-fonce);background:var(--jaune-soft)}
.aud-chip .cnt{color:var(--gris);font-weight:500}

/* ============ IA ============ */
.ia-wrap{display:grid;grid-template-columns:1fr 280px;gap:16px;height:calc(100vh - 62px - 52px)}
.ia-chat{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--ombre-s)}
.ia-stream{flex:1;overflow-y:auto;padding:22px}
.ia-msg{display:flex;gap:11px;margin-bottom:20px;max-width:90%}
.ia-msg.me{margin-left:auto;flex-direction:row-reverse}
.ia-ava{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.ia-ava.bot{background:var(--noir);color:var(--jaune)}
.ia-ava.me{background:var(--jaune);color:var(--noir)}
.ia-bubble{background:var(--bg);border-radius:13px;padding:13px 15px;font-size:13.5px;line-height:1.55}
.ia-msg.me .ia-bubble{background:var(--noir);color:#F2F0E6}
.ia-bubble h5{font-family:"Sora";font-size:13.5px;margin:0 0 6px;font-weight:700}
.ia-bubble ul{margin:6px 0 0;padding-left:18px}
.ia-bubble li{margin-bottom:3px}
.ia-bubble .mini-tag{display:inline-block;background:var(--jaune-soft);color:#A07800;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0}
.ia-input{border-top:1px solid var(--ligne-2);padding:14px;display:flex;gap:10px;align-items:flex-end}
.ia-input textarea{flex:1;border:1px solid var(--ligne);border-radius:11px;padding:11px 13px;resize:none;
  height:44px;max-height:120px;font-size:13.5px}
.ia-input textarea:focus{border-color:var(--jaune-fonce);box-shadow:0 0 0 3px var(--jaune-soft)}
.ia-send{width:44px;height:44px;border-radius:11px;background:var(--jaune);color:var(--noir);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ia-send:hover{background:var(--jaune-fonce)}
.ia-side{display:flex;flex-direction:column;gap:12px}
.ia-quick{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:16px;box-shadow:var(--ombre-s)}
.ia-quick h4{font-family:"Sora";font-size:13px;margin-bottom:12px}
.ia-act{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:10px;
  background:var(--bg);font-size:13px;font-weight:600;margin-bottom:8px;transition:.13s}
.ia-act:hover{background:var(--jaune-soft);transform:translateX(2px)}
.ia-act svg{width:16px;height:16px;color:var(--gris);flex-shrink:0}
.ia-act:last-child{margin-bottom:0}

/* ============ INSCRIPTIONS / MATERIEL / DOCS shared ============ */
.list-card{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:15px 17px;
  box-shadow:var(--ombre-s);display:flex;align-items:center;gap:14px;margin-bottom:11px;transition:.13s}
.list-card:hover{box-shadow:var(--ombre)}
.cap-bar{height:9px;border-radius:6px;background:var(--ligne-2);overflow:hidden;margin-top:7px}
.cap-bar span{display:block;height:100%;border-radius:6px}
.doc-ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:11px;color:#fff}

.empty-soft{text-align:center;padding:40px 20px;color:var(--gris)}

/* progress ring */
.ring-wrap{display:flex;align-items:center;gap:16px}
.section-h{font-family:"Sora";font-size:15px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px}

@media(max-width:1150px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .mini-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .vol-board{grid-template-columns:1fr}
  .ia-wrap{grid-template-columns:1fr;height:auto}
}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:256px;z-index:60;transform:translateX(-100%);transition:.3s}
  .sidebar.open{transform:none}
  .search{display:none}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .tmpl-grid{grid-template-columns:1fr}
  .burger{display:flex!important}
}
.burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--ligne);background:var(--carte);align-items:center;justify-content:center}
/* ============ AJOUTS MISE EN LIGNE : modales, formulaires, comptes ============ */
.mdl-overlay{position:fixed;inset:0;background:rgba(20,18,10,.55);backdrop-filter:blur(3px);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto;opacity:0;transition:.18s}
.mdl-overlay.show{opacity:1}
.mdl{background:var(--bg);border-radius:18px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.4);
  transform:translateY(12px);transition:.2s;overflow:hidden;margin:auto 0}
.mdl-overlay.show .mdl{transform:none}
.mdl-head{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--ligne);background:var(--carte)}
.mdl-title{font-family:"Sora",sans-serif;font-weight:700;font-size:17px;color:var(--encre)}
.mdl-x{background:#f0eee4;border:none;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--encre)}
.mdl-x:hover{background:#e6e4d8}
.mdl-body{padding:20px 22px;max-height:64vh;overflow-y:auto}
.mdl-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 22px;border-top:1px solid var(--ligne);background:var(--carte);flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.col2{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:600;color:var(--gris)}
.fld input,.fld select,.fld textarea{padding:10px 12px;border:1.5px solid var(--ligne);border-radius:10px;
  font-size:14px;font-family:inherit;background:var(--carte);color:var(--encre);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--jaune);box-shadow:0 0 0 3px var(--jaune-soft)}
.form-sec{font-family:"Sora",sans-serif;font-weight:600;font-size:12px;color:var(--gris);margin:18px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.info-card{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:14px 18px;font-size:13px;color:var(--gris);line-height:1.7;margin-top:14px;box-shadow:var(--ombre-s)}
.empty{padding:44px 20px;text-align:center;color:var(--gris-2);font-size:14px}
.logout-btn{background:transparent;border:none;color:#85837A;cursor:pointer;padding:6px;border-radius:8px;display:flex}
.logout-btn:hover{color:#fff;background:rgba(255,255,255,.08)}
@media(max-width:600px){.form-grid,.form-grid.g3{grid-template-columns:1fr}}

/* ============ ÉCRAN D'ACCÈS INTÉGRÉ (création de compte / connexion) ============ */
.preauth .app, .preauth .topbar, .preauth #drawer, .preauth #overlay{display:none!important}
.gate{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:24px;
  background:#15140F;background-image:radial-gradient(circle at 20% 20%,rgba(255,221,0,.12),transparent 45%),radial-gradient(circle at 80% 80%,rgba(255,221,0,.08),transparent 45%)}
.gate-card{background:#fff;border-radius:22px;max-width:410px;width:100%;padding:38px 34px;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.gate-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.gate-logo{width:50px;height:50px;object-fit:contain}
.gate-name{font-family:"Sora",sans-serif;font-weight:800;font-size:18px;color:#15140F;line-height:1.1}
.gate-sub{font-size:12.5px;color:#9b9a90;font-weight:600;margin-top:2px}
.gate-card h1{font-family:"Sora",sans-serif;font-size:21px;font-weight:700;margin-bottom:4px;color:#15140F}
.gate-lead{color:#6b6a62;font-size:13.5px;margin-bottom:20px}
.gate-card label{display:block;font-size:13px;font-weight:600;margin:13px 0 6px;color:#15140F}
.gate-card input{width:100%;padding:12px 14px;border:1.5px solid #e4e2d8;border-radius:11px;font-size:14.5px;font-family:inherit;background:#fafaf6;color:#15140F}
.gate-card input:focus{outline:none;border-color:#ffdd00;background:#fff;box-shadow:0 0 0 3px rgba(255,221,0,.18)}
.gate-card button{width:100%;margin-top:22px;padding:14px;background:#15140F;color:#ffdd00;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.gate-card button:hover{background:#000}.gate-card button:disabled{opacity:.6;cursor:default}
.gate-err{background:#fdecea;color:#b5231a;padding:11px 14px;border-radius:10px;font-size:13.5px;margin-top:14px;display:none}

/* ============ SÉLECTEUR DE SAISON ============ */
.season-pick{padding:10px 14px 4px}
.season-pick label{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#85837A;margin-bottom:5px}
.season-pick select{width:100%;background:#211F18;color:#fff;border:1px solid #2C2A21;border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer}
.season-pick select:focus{outline:none;border-color:var(--jaune)}
.season-bar{display:flex;align-items:center;gap:14px;background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:11px 16px;margin-bottom:16px;box-shadow:var(--ombre-s)}
.season-bar-icon{width:38px;height:38px;border-radius:10px;background:var(--jaune-soft);color:#A07800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.season-bar-icon svg{width:20px;height:20px}
.season-bar-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.season-bar-lbl{font-size:10.5px;font-weight:700;color:var(--gris-2);text-transform:uppercase;letter-spacing:.5px}
.season-bar-sel{border:none;background:transparent;font-family:"Sora",sans-serif;font-weight:700;font-size:17px;color:var(--encre);cursor:pointer;padding:1px 0;max-width:100%}
.season-bar-sel:focus{outline:none}
.season-bar-meta{margin-left:auto;font-size:12.5px;color:var(--gris);text-align:right;line-height:1.4}
@media(max-width:640px){.season-bar-meta{display:none}}

/* ============ BUDGET (caisse enregistreuse) ============ */
.bud-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.bud-head .section-h{margin:0}
.bud-line{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--ligne);border-radius:10px;margin-bottom:7px;background:var(--carte)}
.bud-line-main{flex:1;min-width:0}
.bud-cat{font-size:10.5px;font-weight:700;color:var(--gris-2);text-transform:uppercase;letter-spacing:.3px}
.bud-lab{font-size:13.5px;font-weight:500;color:var(--encre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud-amt{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.bud-amt b{font-family:"Sora",sans-serif;font-size:13.5px}
.bud-pct{font-size:11px;color:var(--gris)}
.bud-act{display:flex;gap:2px}
.bud-act .icon-btn{width:30px;height:30px}

/* ============ CHECKLIST (tâches) ============ */
.tk-item{display:flex;align-items:flex-start;gap:11px;padding:10px 4px;border-bottom:1px solid var(--ligne-2)}
.tk-item .chk-box{cursor:pointer;flex-shrink:0;margin-top:1px}
.tk-item.done .chk-box{background:var(--vert);border-color:var(--vert);color:#fff}
.tk-main{flex:1;min-width:0}
.tk-lab{font-size:14px;font-weight:500}
.tk-item.done .tk-lab{text-decoration:line-through;color:var(--gris-2)}
.tk-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--gris);align-items:center}
.tk-resp{display:inline-flex;align-items:center;gap:5px}
.tk-late{color:var(--rouge);font-weight:600}

/* ============ MULTI-AFFECTATION BÉNÉVOLE ============ */
.ev-check-list{display:flex;flex-direction:column;gap:3px;max-height:230px;overflow-y:auto;border:1px solid var(--ligne);border-radius:10px;padding:8px;margin-top:6px}
.ev-check{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
.ev-check:hover{background:var(--ligne-2)}
.ev-check input{width:16px;height:16px;accent-color:var(--jaune);flex-shrink:0}
.ev-check i{color:var(--gris);font-style:normal;font-size:12px}

/* ============ CALENDRIER (bascule + vue annuelle) ============ */
.cal-seg{display:inline-flex;background:var(--ligne-2);border-radius:9px;padding:3px}
.cal-seg button{border:none;background:none;padding:6px 14px;border-radius:7px;font-family:inherit;font-size:13px;font-weight:600;color:var(--gris);cursor:pointer}
.cal-seg button.on{background:var(--carte);color:var(--encre);box-shadow:var(--ombre-s)}
.cal-year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mini-cal{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:11px}
.mc-head{font-family:"Sora",sans-serif;font-weight:700;font-size:13px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.mc-head:hover{color:#A07800}
.mc-cnt{background:var(--jaune-soft);color:#A07800;font-size:10px;font-weight:700;border-radius:20px;padding:1px 7px;font-family:Inter}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mc-dow{font-size:9px;color:var(--gris-2);text-align:center;font-weight:600;padding-bottom:2px}
.mc-cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--gris);border-radius:5px}
.mc-cell.off{visibility:hidden}
.mc-cell.has{background:var(--ligne-2);color:var(--encre);font-weight:700;cursor:pointer}
.mc-cell.has:hover{background:var(--jaune-soft)}
.mc-cell.today{outline:2px solid var(--jaune)}
.mc-dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%}
@media(max-width:900px){.cal-year-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.cal-year-grid{grid-template-columns:1fr}}

/* ============ RÔLES PAR ÉVÉNEMENT ============ */
.role-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--ligne);border-radius:10px;margin-bottom:8px;background:var(--carte)}
.role-main{flex:1;min-width:0}
.role-name{font-weight:600;font-size:13.5px}
.role-vol{font-size:12px;color:var(--gris);margin-top:2px;display:flex;align-items:center;gap:5px}
.role-vol.empty{color:var(--gris-2);font-style:italic}
.role-acts{display:flex;gap:2px}
.role-acts .icon-btn{width:30px;height:30px}

/* ============ INFO-CARD (si absent) ============ */
.info-card{background:var(--ligne-2);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--gris);margin-top:10px;line-height:1.5}
</style>

/* ===== Charts (SVG) ===== */
function barChart(el,data,opt={}){
  const w=el.clientWidth||520,h=opt.h||190,pad=opt.pad||{t:14,r:8,b:28,l:38};
  const max=opt.max||Math.max(...data.map(d=>Math.abs(d.v)))*1.15;
  const min=opt.min!==undefined?opt.min:0;
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const bw=iw/data.length*0.58, gap=iw/data.length;
  const y0= min<0 ? pad.t+ih*(max/(max-min)) : pad.t+ih;
  let svg=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">`;
  // gridlines
  for(let i=0;i<=4;i++){const gy=pad.t+ih*i/4;svg+=`<line x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}" stroke="#F0EDE4" stroke-width="1"/>`;}
  data.forEach((d,i)=>{
    const x=pad.l+gap*i+(gap-bw)/2;
    const hh=Math.abs(d.v)/(max-min)*ih;
    const y=d.v>=0?y0-hh:y0;
    const col=d.c||(d.v<0?'#D8463A':'var(--jaune)');
    svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(hh,1)}" rx="4" fill="${col}"><title>${d.l}: ${d.v}</title></rect>`;
    svg+=`<text x="${x+bw/2}" y="${h-9}" text-anchor="middle" font-size="10.5" fill="#9A988C" font-weight="600">${d.l}</text>`;
  });
  svg+=`</svg>`;el.innerHTML=svg;
}
function donutChart(el,data,opt={}){
  const size=opt.size||170,cx=size/2,cy=size/2,r=size/2-6,ir=opt.ir||r*0.6;
  const tot=data.reduce((a,d)=>a+d.v,0);let a0=-Math.PI/2;
  let svg=`<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex-shrink:0">`;
  data.forEach(d=>{
    const a1=a0+(d.v/tot)*Math.PI*2;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const xi0=cx+ir*Math.cos(a0),yi0=cy+ir*Math.sin(a0),xi1=cx+ir*Math.cos(a1),yi1=cy+ir*Math.sin(a1);
    const large=(a1-a0)>Math.PI?1:0;
    svg+=`<path d="M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} L${xi1} ${yi1} A${ir} ${ir} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${d.c}"><title>${d.l}: ${Math.round(d.v/tot*100)}%</title></path>`;
    a0=a1;
  });
  if(opt.center)svg+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="18" font-weight="700" font-family="Sora" fill="#15140F">${opt.center}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="#9A988C" font-weight="600">${opt.centerSub||''}</text>`;
  svg+=`</svg><div class="chart-legend" style="flex-direction:column;gap:8px;margin:0">`;
  data.forEach(d=>{svg+=`<div class="lg-item"><span class="lg-dot" style="background:${d.c}"></span>${d.l} <b style="color:var(--encre);margin-left:auto">${opt.fmtVal?opt.fmtVal(d.v):Math.round(d.v/tot*100)+'%'}</b></div>`;});
  svg+=`</div></div>`;el.innerHTML=svg;
}
function drawDashboardCharts(){
  const evol=document.getElementById('ch-evol');
  if(evol)barChart(evol,[{l:'Juil',v:2},{l:'Août',v:3},{l:'Sept',v:4},{l:'Oct',v:2},{l:'Nov',v:1},{l:'Déc',v:1},{l:'Janv',v:2},{l:'Févr',v:1},{l:'Mars',v:2},{l:'Avr',v:3},{l:'Mai',v:4},{l:'Juin',v:5,c:'#15140F'}],{h:190,max:6});

let drawerEv=null,drawerTab='infos';
function openEvent(id){drawerEv=EVENTS.find(e=>e.id===id);drawerTab='infos';renderDrawer();
  document.getElementById('overlay').classList.add('show');document.getElementById('drawer').classList.add('show');}
function closeDrawer(){document.getElementById('overlay').classList.remove('show');document.getElementById('drawer').classList.remove('show');}

function renderDrawer(){
  const e=drawerEv;if(!e)return;const s=stat(e.statut);const r=av(e.resp);const pct=evChkPct(e);
  const allTabs=[['infos','Informations'],['checklist','Checklist'],['budget','Budget'],['equipe','Équipe'],['docs','Documents']];

  document.getElementById('drawer').innerHTML=`
    <div class="drawer-head">
      <button class="drawer-close" onclick="closeDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg></button>

        <span>📅 ${evDates(e)} · ${e.heure}</span><span>📍 ${e.lieu}</span>
      </div>
      <div class="editor-only" style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-dark btn-sm" onclick="eventForm(${e.id})">Modifier</button><button class="btn btn-ghost btn-sm" style="color:var(--rouge);border-color:#f0d0cc" onclick="deleteEvent(${e.id})">Supprimer</button></div>
      <div class="drawer-tabs">${tabs.map(t=>`<button class="drawer-tab ${drawerTab===t[0]?'on':''}" onclick="setDTab('${t[0]}')">${t[1]}</button>`).join('')}</div>

  if(drawerTab==='infos'){
    return `

    <div class="kv">
      <div class="field"><div class="field-l">Responsable principal</div><div class="field-v" style="display:flex;align-items:center;gap:8px"><span class="av" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:${r.c}">${r.i}</span>${r.n}</div></div>
      <div class="field"><div class="field-l">Type</div><div class="field-v">${TYPES[e.type].e} ${TYPES[e.type].n}</div></div>

      <b style="font-family:Sora">${e.part}/${e.cap}</b></div></div>`:''}

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${e.team.map(id=>{const m=av(id);return `<span class="tag"><span class="av" style="width:20px;height:20px;border-radius:5px;font-size:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:${m.c}">${m.i}</span>${m.n}</span>`;}).join('')}</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px">
      <div style="background:var(--vert-bg);border-radius:10px;padding:12px"><div style="font-size:11px;color:var(--vert);font-weight:700">RECETTES</div><div style="font-family:Sora;font-weight:700;font-size:16px;margin-top:3px">${chf(evRec(e))}</div></div>
      <div style="background:var(--rouge-bg);border-radius:10px;padding:12px"><div style="font-size:11px;color:var(--rouge);font-weight:700">DÉPENSES</div><div style="font-family:Sora;font-weight:700;font-size:16px;margin-top:3px">${chf(evDep(e))}</div></div>
      <div style="background:var(--bleu-bg);border-radius:10px;padding:12px"><div style="font-size:11px;color:var(--bleu);font-weight:700">BÉNÉFICE</div><div style="font-family:Sora;font-weight:700;font-size:16px;margin-top:3px">${chf(evBen(e))}</div></div>
    </div>`;
  }
  if(drawerTab==='checklist'){
    const ts=evTaches(e); const done=ts.filter(t=>t.done).length; const pct=evChkPct(e);
    const today=new Date().toISOString().slice(0,10);
    const row=(t)=>{const r=t.resp?av(t.resp):null; const late=t.due&&!t.done&&t.due<today;
      return `<div class="tk-item ${t.done?'done':''}">
        <div class="chk-box" onclick="toggleChk(${e.id},${t.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg></div>
        <div class="tk-main" ${canEdit()?`onclick="taskForm(${e.id},${t.id})"`:''}>
          <div class="tk-lab">${esc(t.label)}</div>
          <div class="tk-meta">${t.due?`<span class="${late?'tk-late':''}">📅 ${dateFr(t.due)}</span>`:''}${r?`<span class="tk-resp"><span class="av" style="width:18px;height:18px;border-radius:5px;font-size:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:${r.c}">${r.i}</span>${r.n}</span>`:''}</div>
        </div>
      </div>`;};
    return `<div class="chk-prog-wrap"><div class="chk-prog"><span style="width:${pct}%"></span></div><div class="chk-pct">${pct}%</div></div>
    <div style="font-size:12px;color:var(--gris);margin-bottom:14px">${done} / ${ts.length} tâche${ts.length>1?'s':''} terminée${done>1?'s':''}</div>

    ${canEdit()?`<button class="btn btn-ghost btn-sm" style="margin-top:12px;width:100%;justify-content:center" onclick="taskForm(${e.id},0)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Ajouter une tâche</button>`:''}`;
  }
  if(drawerTab==='budget'){

    <div class="bud-tot" style="background:var(--vert-bg);color:var(--vert)"><span>Total recettes</span><span>${chf(R)}</span></div>
    <div class="bud-head" style="margin-top:16px"><div class="section-h" style="margin:0;color:var(--rouge)">Dépenses</div>${canEdit()?`<button class="btn btn-ghost btn-sm" onclick="budgetItemForm(${e.id},'depense',0)">+ Dépense</button>`:''}</div>

    <div class="bud-tot" style="background:var(--rouge-bg);color:var(--rouge)"><span>Total dépenses</span><span>${chf(D)}</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
      <div class="bud-tot" style="background:var(--noir);color:#fff;margin:0"><span>Solde</span><span>${B>=0?'+':''}${chf(B)}</span></div>
      <div class="bud-tot" style="background:var(--jaune-soft);color:#A07800;margin:0"><span>Dépenses / Recettes</span><span>${R>0?Math.round(D/R*100):0}%</span></div>
    </div>`;
  }
  if(drawerTab==='equipe'){
    const roles=Array.isArray(e.roles)?e.roles:[];
    const volById=id=>VOLUNTEERS.find(v=>v.id===id);
    const roleRow=r=>{const v=r.volId?volById(r.volId):null;
      return `<div class="role-row">
        <div class="role-main">
          <div class="role-name">${esc(r.label)}</div>
          ${v?`<div class="role-vol"><span class="vol-av" style="width:20px;height:20px;font-size:9px;background:${TEAM[v.id%TEAM.length].c}">${v.p[0]}${v.n[0]}</span>${v.p} ${v.n}</div>`:'<div class="role-vol empty">Non assigné</div>'}
        </div>
        ${canEdit()?`<div class="role-acts">
          <button class="icon-btn" onclick="roleForm(${e.id},${r.id})" title="Modifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="icon-btn" style="color:var(--rouge)" onclick="deleteRole(${e.id},${r.id})" title="Supprimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
        </div>`:''}
      </div>`;};
    return `
    <div class="bud-head"><div class="section-h" style="margin:0">Rôles de l'événement</div>${canEdit()?`<button class="btn btn-ghost btn-sm" onclick="roleForm(${e.id},0)">+ Ajouter un rôle</button>`:''}</div>

    <div class="section-h" style="margin-top:18px">Bénévoles affectés à cet événement</div>
    ${(()=>{const av=VOLUNTEERS.filter(v=>volEvents(v).includes(e.id));return av.length?av.map(v=>'<div class="chk-item"><span class="vol-av" style="background:'+TEAM[v.id%TEAM.length].c+'">'+v.p[0]+v.n[0]+'</span><div style="flex:1"><div class="vol-n">'+v.p+' '+v.n+'</div><div class="vol-m">'+(v.comp||[]).slice(0,2).join(' · ')+(v.h?' · '+v.h+'h':'')+'</div></div></div>').join(''):'<div class="empty-soft" style="margin-top:4px">Aucun b\u00e9n\u00e9vole affect\u00e9 depuis l\'onglet B\u00e9n\u00e9voles.</div>';})()}

    </div>`).join('')||'<div class="empty-soft">Aucun document classé pour cet événement.</div>';

}
async function toggleChk(eid,tid){
  if(!canEdit())return;
  const e=EVENTS_ALL.find(x=>x.id===eid)||EVENTS.find(x=>x.id===eid); if(!e)return;
  const t=evTaches(e).find(x=>x.id===tid); if(!t)return;
  t.done=t.done?0:1; renderDrawer();
  try{ await persistEvent(e); }catch(err){ toast('\u26a0 '+err.message); }
}

    <div class="kpi"><div class="kpi-top"><div class="kpi-ico" style="background:var(--rouge-bg);color:var(--rouge)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 3v18h18"/><path d="M19 9l-5 5-3-3-4 4"/></svg></div></div><div class="kpi-val">${chf(D)}</div><div class="kpi-lbl">Dépenses totales</div></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-ico" style="background:var(--bleu-bg);color:var(--bleu)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1L12 16.5 5.7 21l2.3-7.1-6-4.5h7.6z"/></svg></div></div><div class="kpi-val">${chf(B)}</div><div class="kpi-lbl">Bénéfice net cumulé</div></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-ico" style="background:var(--jaune-soft);color:#A07800"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 3v18h18"/><circle cx="9" cy="9" r="2"/><circle cx="15" cy="15" r="2"/><path d="M9 15l6-6"/></svg></div></div><div class="kpi-val">${Math.round(B/D*100)}%</div><div class="kpi-lbl">ROI moyen</div></div>
  </div>

  <div class="grid-3">
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Rentabilité par événement</div></div>
      <div class="tablewrap"><table>

        <tbody>${active.sort((a,b)=>evBen(b)-evBen(a)).map(e=>{const r=evRec(e),d=evDep(e),b=r-d,marge=r>0?Math.round(b/r*100):0;

          <td><div style="display:flex;align-items:center;gap:8px"><div class="mini-bar" style="min-width:60px"><span style="width:${Math.max(marge,0)}%;background:${b>=0?'var(--vert)':'var(--rouge)'}"></span></div>${marge}%</div></td></tr>`;}).join('')}</tbody>
      </table></div>
    </div>

function drawBudgetChart(){
  const el=document.getElementById('ch-budget');if(!el)return;
  const recCat={},depCat={};
  Object.assign(recCat,budByCat(EVENTS.filter(e=>e.statut!=='annule'),'recette'));Object.assign(depCat,budByCat(EVENTS.filter(e=>e.statut!=='annule'),'depense'));
  const cols=['#1F9D5B','#ffdd00','#3B6FE0','#7B59D8','#E8902A','#D8463A'];
  donutChart(el,Object.entries(recCat).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map((x,i)=>({l:x[0],v:x[1],c:cols[i%cols.length]})),{size:160,center:'',fmtVal:v=>fmt(v)});
}

let calMonth=5,calYear=2026; // juin 2026
RENDER.calendrier=function(){
  return `<div id="cal-wrap">${renderCal()}</div>`;
};
let calMode='annee';
function renderCal(){ return calMode==='annee'?renderCalYear():renderCalMonth(); }
function calSeg(){ return `<div class="cal-seg"><button class="${calMode==='annee'?'on':''}" onclick="calSetMode('annee')">Ann\u00e9e</button><button class="${calMode==='mois'?'on':''}" onclick="calSetMode('mois')">Mois</button></div>`; }
function calRerender(){ const w=document.getElementById('cal-wrap'); if(w)w.innerHTML=renderCal(); }
function calSetMode(m){ calMode=m; if(m==='annee'){calMonth=6;calYear=SEASON;} calRerender(); }
function calGoMonth(y,m){ calMode='mois'; calYear=y; calMonth=m; calRerender(); }
function calStep(d){ calMonth+=d; if(calMonth>11){calMonth=0;calYear++;} if(calMonth<0){calMonth=11;calYear--;} calRerender(); }
function evDaysIn(year,month){ const map={}; EVENTS.forEach(e=>{const[y,m,d]=e.date.split('-').map(Number); if(y===year&&m-1===month)(map[d]=map[d]||[]).push(e);}); return map; }
function renderCalMonth(){
  const moisN=["Janvier","F\u00e9vrier","Mars","Avril","Mai","Juin","Juillet","Ao\u00fbt","Septembre","Octobre","Novembre","D\u00e9cembre"];
  const first=new Date(calYear,calMonth,1); let startDow=(first.getDay()+6)%7;
  const days=new Date(calYear,calMonth+1,0).getDate(); const evByDay=evDaysIn(calYear,calMonth);
  const todayStr=new Date().toISOString().slice(0,10);
  let cells='';
  for(let i=0;i<startDow;i++)cells+=`<div class="cal-cell off"></div>`;
  for(let d=1;d<=days;d++){
    const evs=evByDay[d]||[]; const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const today=ds===todayStr; const conflict=evs.length>1;
    cells+=`<div class="cal-cell ${today?'today':''}"><div class="cal-num">${d}</div>
      ${conflict?`<span class="conflict-flag" title="Plusieurs \u00e9v\u00e9nements ce jour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></span>`:''}
      ${evs.map(e=>{const s=stat(e.statut);return `<div class="cal-ev" style="background:${s.c}1a;color:${s.c};border-color:${s.c}" onclick="openEvent(${e.id})">${TYPES[e.type].e} ${e.nom.split(' ').slice(0,2).join(' ')}</div>`;}).join('')}
    </div>`;
  }
  const total=startDow+days;for(let i=total;i<Math.ceil(total/7)*7;i++)cells+=`<div class="cal-cell off"></div>`;
  return `<div class="toolbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="cal-nav" onclick="calStep(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="cal-month">${moisN[calMonth]} ${calYear}</div>
      <button class="cal-nav" onclick="calStep(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div style="flex:1"></div>${calSeg()}
  </div>
  <div class="cal">
    <div class="cal-grid">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}
function renderCalYear(){
  const moisN=["Janv.","F\u00e9vr.","Mars","Avr.","Mai","Juin","Juil.","Ao\u00fbt","Sept.","Oct.","Nov.","D\u00e9c."];
  const todayStr=new Date().toISOString().slice(0,10);
  const months=[]; for(let k=0;k<12;k++){ const m=(6+k)%12; const y=SEASON+(6+k>=12?1:0); months.push([y,m]); }
  const mini=([y,m])=>{
    const first=new Date(y,m,1); let startDow=(first.getDay()+6)%7;
    const days=new Date(y,m+1,0).getDate(); const evByDay=evDaysIn(y,m);
    let cells='';
    for(let i=0;i<startDow;i++)cells+=`<div class="mc-cell off"></div>`;
    for(let d=1;d<=days;d++){
      const evs=evByDay[d]||[]; const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const today=ds===todayStr;
      const dot=evs.length?`<span class="mc-dot" style="background:${stat(evs[0].statut).c}"></span>`:'';
      cells+=`<div class="mc-cell ${evs.length?'has':''} ${today?'today':''}" ${evs.length?`onclick="openEvent(${evs[0].id})" title="${esc(evs.map(e=>e.nom).join(' \u00b7 '))}"`:''}>${d}${dot}</div>`;
    }
    const cnt=Object.values(evByDay).reduce((a,b)=>a+b.length,0);
    return `<div class="mini-cal"><div class="mc-head" onclick="calGoMonth(${y},${m})">${moisN[m]} ${y}${cnt?` <span class="mc-cnt">${cnt}</span>`:''}</div>
      <div class="mc-grid">${['L','M','M','J','V','S','D'].map(x=>`<div class="mc-dow">${x}</div>`).join('')}${cells}</div></div>`;
  };
  const tot=EVENTS.length;
  return `<div class="toolbar">
    <div class="cal-month">Saison ${seasonLabel(SEASON)} <span style="color:var(--gris);font-weight:600;font-size:14px">\u00b7 ${tot} \u00e9v\u00e9nement${tot>1?'s':''}</span></div>
    <div style="flex:1"></div>${calSeg()}
  </div>
  <div class="cal-year-grid">${months.map(mini).join('')}</div>`;
}

const IA_RESPONSES={
  checklist:`<h5>Checklist générée — Tournoi extérieur</h5>D'après le type « tournoi » et ~200 participants, voici les tâches prioritaires :<ul><li>Réservation du site + autorisation communale</li><li>Assurance RC événement</li><li>Plan buvette, caisse & ravitaillement</li><li>Sécurité, parking et plan d'évacuation</li><li>Communication (affiches, réseaux, emails J-7)</li><li>Recrutement de 18 à 22 bénévoles</li><li>Nettoyage et démontage</li></ul><span class="mini-tag">14 tâches injectées dans l'événement</span>`,

  risques:`<h5>Risques identifiés</h5><ul><li>🌧️ <b>Météo</b> — prévoir un plan B couvert ou report</li><li>👥 <b>Bénévoles</b> — 8 postes encore vacants sur le tournoi</li><li>📋 <b>Autorisation</b> — délai communal de 30 jours, à anticiper</li><li>💰 <b>Trésorerie</b> — avances buvette avant les recettes</li></ul>Niveau de risque global : <span class="mini-tag">Modéré</span>`,
  benevoles:`<h5>Bénévoles nécessaires</h5>Pour un tournoi de 2 jours avec buvette et ~200 participants, je recommande :<ul><li>Buvette / grillades : <b>6 personnes</b></li><li>Caisse & billetterie : <b>3 personnes</b></li><li>Sécurité & parking : <b>4 personnes</b></li><li>Accueil & arbitrage : <b>5 personnes</b></li><li>Montage / démontage : <b>4 personnes</b></li></ul>Total : <b>~22 bénévoles</b>. Actuellement 14 disponibles → <span class="mini-tag">8 à recruter</span>`,

};
function iaAction(k){const labels={checklist:'Génère-moi la checklist pour un tournoi',budget:'Estime le budget d\'un tournoi',risques:'Quels sont les risques de cet événement ?',benevoles:'Combien de bénévoles pour un tournoi ?',email:'Rédige l\'email de convocation'};

function iaSend(){const t=document.getElementById('ia-text');const v=t.value.trim();if(!v)return;t.value='';iaPush('me',v);iaTyping();
  const low=v.toLowerCase();let key='generic';
  if(low.includes('checklist')||low.includes('tâche'))key='checklist';
  else if(low.includes('budget')||low.includes('coût')||low.includes('cout')||low.includes('prix'))key='budget';
  else if(low.includes('risque')||low.includes('danger'))key='risques';
  else if(low.includes('bénévole')||low.includes('benevole'))key='benevoles';
  else if(low.includes('email')||low.includes('mail')||low.includes('convocation'))key='email';
  setTimeout(()=>{iaStopTyping();
    iaPush('bot',IA_RESPONSES[key]||`<h5>Bien noté</h5>Je peux t'aider à structurer cet événement. Précise le type (tournoi, loto, repas…), la date approximative et le nombre de participants attendus, et je génère une checklist + une estimation de budget adaptées au Meyrin FC.`);
  },750);
}

/* ===== Saisons (1er juillet → 30 juin) ===== */
function seasonStartOf(dateStr){
  if(!dateStr) return null;
  const p=String(dateStr).split('-'); if(p.length<2) return null;
  const y=parseInt(p[0],10), m=parseInt(p[1],10);
  if(isNaN(y)||isNaN(m)) return null;
  return m>=7 ? y : y-1;
}
function seasonLabel(y){ return y+'\u2013'+(y+1); }
function currentSeasonStart(){ const t=new Date(); return (t.getMonth()+1)>=7 ? t.getFullYear() : t.getFullYear()-1; }
function evName(id){ const e=EVENTS_ALL.find(x=>x.id===id); return e?e.nom:''; }
function recomputeSeasons(){
  const set=new Set();
  EVENTS_ALL.forEach(e=>{ const s=seasonStartOf(e.date); if(s!=null) set.add(s); });
  const cur=currentSeasonStart(); set.add(cur); set.add(cur+1);
  SEASONS=[...set].sort((a,b)=>b-a);
  if(SEASON===null || !SEASONS.includes(SEASON)){
    const counts={}; EVENTS_ALL.forEach(e=>{const s=seasonStartOf(e.date); if(s!=null)counts[s]=(counts[s]||0)+1;});
    SEASON = counts[cur] ? cur : SEASONS.reduce((b,s)=>((counts[s]||0)>(counts[b]||0)?s:b), SEASONS[0]);
  }
}
function filterSeason(){ EVENTS = EVENTS_ALL.filter(e=>seasonStartOf(e.date)===SEASON); }
function buildSeasonOptions(){ return SEASONS.map(y=>`<option value="${y}" ${y===SEASON?'selected':''}>Saison ${seasonLabel(y)}</option>`).join(''); }
function setSeason(y){ SEASON=parseInt(y,10); filterSeason(); syncSeasonUI(); refresh(); }
function syncSeasonUI(){
  const side=document.getElementById('seasonSelSide');
  if(side){ side.innerHTML=buildSeasonOptions(); side.value=String(SEASON); }
  const dash=document.getElementById('seasonSelDash');
  if(dash){ dash.value=String(SEASON); }
}
function seasonBarHTML(){

  return `<div class="season-bar">
    <div class="season-bar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></div>

    <div class="season-bar-meta">Du 1er juillet ${SEASON} au 30 juin ${SEASON+1} \u00b7 <b>${inS}</b> \u00e9v\u00e9nement${inS>1?'s':''}</div>
  </div>`;
}

async function api(route, opt){
  opt = opt||{};
  const method = opt.method||'GET';
  let url='api.php?action='+encodeURIComponent(route);
  if(opt.c) url+='&collection='+encodeURIComponent(opt.c);
  if(opt.id!=null) url+='&id='+encodeURIComponent(opt.id);
  const o={method, headers:{}};
  if(opt.form){ o.body=opt.form; }
  else if(opt.body!=null){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(opt.body); }
  const res=await fetch(url,o);
  let data; try{ data=await res.json(); }catch(_){ data={ok:false,error:'Réponse serveur invalide ('+res.status+')'}; }
  if(res.status===401){ showGate('login'); throw new Error('Session expirée'); }
  if(!res.ok || (data&&data.error)) throw new Error((data&&data.error)||('Erreur '+res.status));
  return data;
}

async function saveEvent(id){
  const nom=val('f_nom'); if(!nom){toast('\u26a0 Le nom est obligatoire');return;}
  const base=id?(EVENTS_ALL.find(x=>x.id===id)||EVENTS.find(x=>x.id===id)):null;
  const resp=val('f_resp')||'t1';
  const deb=val('f_date')||'2026-01-01';
  let fin=val('f_dateFin')||deb; if(fin<deb) fin=deb;
  const obj=Object.assign({}, base||{}, {
    nom, type:val('f_type'), statut:val('f_statut'),
    date:deb, dateFin:fin, heure:val('f_heure')||'18:00', heureFin:val('f_heureFin')||'', lieu:val('f_lieu'),
    resp, part:Math.round(numv('f_part')), cap:Math.round(numv('f_cap')),
    desc:val('f_desc'),
    budget: base&&Array.isArray(base.budget)?base.budget:[],
    taches: base&&Array.isArray(base.taches)?base.taches:defaultTaches(),
    team: base&&base.team?base.team:[],  // resp seul dans resp, team géré séparément
    sponsors: base&&base.sponsors?base.sponsors:[]
  });
  if(id) obj.id=id;
  try{
    await api('save',{method:'POST',c:'events',body:obj});
    await reloadData(); closeModal(); toast(id?'\u00c9v\u00e9nement modifi\u00e9':'\u00c9v\u00e9nement cr\u00e9\u00e9');
    if(drawerEv&&id&&drawerEv.id===id){ drawerEv=EVENTS_ALL.find(x=>x.id===id)||EVENTS.find(x=>x.id===id); renderDrawer(); }
    refresh();
  }catch(err){ toast('\u26a0 '+err.message); }
}

async function deleteEvent(id){
  if(!confirm('Supprimer d\u00e9finitivement cet \u00e9v\u00e9nement ?'))return;
  try{ await api('delete',{method:'POST',c:'events',id}); await reloadData(); closeModal(); closeDrawer(); toast('\u00c9v\u00e9nement supprim\u00e9'); refresh(); }
  catch(err){ toast('\u26a0 '+err.message); }
}

/* ---- Normalisation : accepte l'ancien ET le nouveau modèle ---- */
function defaultTaches(){ return CHECK_BASE.map((l,i)=>({id:i+1,label:l,done:0,due:null,resp:null})); }
function normalizeEvent(e){
  e = Object.assign({}, e);
  if(!Array.isArray(e.budget)){
    const b=[]; let id=1;
    Object.entries(e.rec||{}).forEach(([k,v])=>{ if(v) b.push({id:id++,type:'recette',cat:k,label:k,montant:v}); });
    Object.entries(e.dep||{}).forEach(([k,v])=>{ if(v) b.push({id:id++,type:'depense',cat:k,label:k,montant:v}); });
    e.budget=b;
  }
  if(!Array.isArray(e.taches)){
    if(Array.isArray(e.chk)) e.taches=CHECK_BASE.map((l,i)=>({id:i+1,label:l,done:e.chk[i]?1:0,due:null,resp:null}));
    else e.taches=[];
  }
  if(!e.dateFin) e.dateFin = e.date;
  delete e.rec; delete e.dep; delete e.chk;
  return e;
}
function normalizeVol(v){ v=Object.assign({},v); if(!Array.isArray(v.evs)) v.evs = v.ev?[v.ev]:[]; delete v.ev; if(!v.type) v.type='benevole'; return v; }

/* ---- Helpers d'affichage / agrégation ---- */
function evDates(e){
  if(e.dateFin && e.dateFin!==e.date){
    const a=e.date.split('-'), b=e.dateFin.split('-');
    if(a[0]===b[0] && a[1]===b[1]) return (+a[2])+'–'+dateFr(e.dateFin);
    return dateFr(e.date)+' → '+dateFr(e.dateFin);
  }
  return dateFr(e.date);
}
function budByCat(list,type){
  const c={};
  list.forEach(e=>budItems(e).filter(b=>b.type===type).forEach(b=>{ const k=b.cat||'Autre'; c[k]=(c[k]||0)+(+b.montant||0); }));
  return c;
}

/* ---- Rapports téléchargeables (CSV, ouvrable dans Excel) ---- */
function csvEsc(v){ v=(v==null?'':String(v)); return '"'+v.replace(/"/g,'""')+'"'; }
function downloadCSV(filename, rows){
  const body=rows.map(r=>r.map(csvEsc).join(';')).join('\r\n');
  const blob=new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },120);
}
function repFinancier(){
  const rows=[['Événement','Type','Statut','Date début','Date fin','Recettes (CHF)','Dépenses (CHF)','Bénéfice (CHF)']];
  let R=0,D=0;
  EVENTS.forEach(e=>{ const r=evRec(e),d=evDep(e); R+=r; D+=d; rows.push([e.nom,TYPES[e.type].n,stat(e.statut).n,e.date,e.dateFin||e.date,r,d,r-d]); });
  rows.push(['TOTAL','','','','',R,D,R-D]);
  return rows;
}
function repParticipation(){
  const rows=[['Événement','Type','Date','Participants','Capacité','Taux (%)']];
  EVENTS.forEach(e=>{ rows.push([e.nom,TYPES[e.type].n,e.date,e.part,e.cap,e.cap>0?Math.round(e.part/e.cap*100):'']); });
  return rows;
}
function repBenevoles(){
  const rows=[['Bénévole','Téléphone','Email','Heures','Nb événements','Événements affectés']];
  VOLUNTEERS.forEach(v=>{ const evs=volEvents(v).map(id=>evName(id)).filter(Boolean); rows.push([v.p+' '+v.n,v.tel,v.mail,v.h,evs.length,evs.join(' | ')]); });
  return rows;
}
function downloadRapport(kind){
  const lbl=seasonLabel(SEASON).replace('–','-');
  if(kind==='financier') downloadCSV('rapport-financier-'+lbl+'.csv', repFinancier());
  else if(kind==='participation') downloadCSV('rapport-participation-'+lbl+'.csv', repParticipation());
  else if(kind==='benevoles') downloadCSV('rapport-benevoles-'+lbl+'.csv', repBenevoles());
  toast('Rapport téléchargé');
}
function downloadBilan(){
  const lbl=seasonLabel(SEASON).replace('–','-');
  const rows=[['BILAN DE SAISON '+seasonLabel(SEASON)],[],
    ['— FINANCIER —'],...repFinancier(),[],
    ['— PARTICIPATION —'],...repParticipation(),[],
    ['— BÉNÉVOLES —'],...repBenevoles()];
  downloadCSV('bilan-saison-'+lbl+'.csv', rows);
  toast('Bilan téléchargé');
}
/* =====================================================================
   RÔLES PAR ÉVÉNEMENT (équipe pane)
   ===================================================================== */
function roleForm(eid, rid){
  if(!canEdit())return;
  const e=EVENTS_ALL.find(x=>x.id===eid)||EVENTS.find(x=>x.id===eid); if(!e)return;
  const roles=Array.isArray(e.roles)?e.roles:[];
  const role=rid?roles.find(r=>r.id===rid):null;
  const volOpt='<option value="">— Non assigné —</option>'+
    VOLUNTEERS.map(v=>`<option value="${v.id}" ${role&&role.volId===v.id?'selected':''}>${v.p} ${v.n} (${v.type==='responsable'?'Resp.':'Bén.'})</option>`).join('');
  modal(role?'Modifier le rôle':'Ajouter un rôle',
   `<div class="form-grid">
      <div class="fld col2"><label>Intitulé du rôle *</label><input id="r_label" value="${role?esc(role.label):''}" placeholder="ex. Buvette, Accueil, Sécurité…"></div>
      <div class="fld"><label>Nombre de places</label><input id="r_places" type="number" min="1" value="${role?role.places:1}"></div>
      <div class="fld"><label>Bénévole assigné</label><select id="r_vol">${volOpt}</select></div>
    </div>`,
   `${role?`<button class="btn btn-ghost" style="color:var(--rouge);margin-right:auto" onclick="deleteRole(${eid},${role.id})">Supprimer</button>`:''}
    <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" onclick="saveRole(${eid},${rid||0})">Enregistrer</button>`);
}
async function saveRole(eid,rid){
  const e=EVENTS_ALL.find(x=>x.id===eid)||EVENTS.find(x=>x.id===eid); if(!e)return;
  const label=val('r_label'); if(!label){toast('⚠ Intitulé requis');return;}
  const places=Math.max(1,parseInt(val('r_places'))||1);
  const volId=val('r_vol')?parseInt(val('r_vol')):null;
  if(!Array.isArray(e.roles)) e.roles=[];
  if(rid){ const r=e.roles.find(x=>x.id===rid); if(r){r.label=label;r.places=places;r.volId=volId;} }
  else { const nid=e.roles.reduce((m,r)=>Math.max(m,r.id),0)+1; e.roles.push({id:nid,label,places,volId}); }
  closeModal();
  try{ await persistEvent(e); toast('Rôle enregistré'); }catch(err){ toast('⚠ '+err.message); }
}
async function deleteRole(eid,rid){
  if(!confirm('Supprimer ce rôle ?'))return;
  const e=EVENTS_ALL.find(x=>x.id===eid)||EVENTS.find(x=>x.id===eid); if(!e)return;
  e.roles=(e.roles||[]).filter(r=>r.id!==rid);
  closeModal();
  try{ await persistEvent(e); toast('Rôle supprimé'); }catch(err){ toast('⚠ '+err.message); }
}

/* =====================================================================
   DISPONIBILITÉS BÉNÉVOLE (rôle benevole — dans "Mon compte")
   ===================================================================== */
let dispoCal={};   // { 'YYYY-MM-DD': [{start:'08:00',end:'18:00'}] }

function renderDispoCal(){
  const el=document.getElementById('dispo-wrap'); if(!el) return;
  const today=new Date(); const y=today.getFullYear(); const m=today.getMonth();
  const moisN=["Janv.","Févr.","Mars","Avr.","Mai","Juin","Juil.","Août","Sept.","Oct.","Nov.","Déc."];
  const first=new Date(y,m,1); let startDow=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<startDow;i++)cells+=`<div class="mc-cell off"></div>`;
  for(let d=1;d<=days;d++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const slots=dispoCal[key]||[]; const has=slots.length>0;
    cells+=`<div class="mc-cell ${has?'has':''}" onclick="dispoSlotForm('${key}')" title="${has?slots.map(s=>s.start+'-'+s.end).join(', '):'Ajouter une disponibilité'}">${d}${has?`<span class="mc-dot" style="background:var(--vert)"></span>`:''}
    </div>`;
  }
  el.innerHTML=`
  <div class="mc-head" style="font-size:14px;margin-bottom:12px">${moisN[m]} ${y} — cliquez un jour pour ajouter vos disponibilités</div>
  <div class="mc-grid">
    ${['L','M','M','J','V','S','D'].map(x=>`<div class="mc-dow">${x}</div>`).join('')}${cells}
  </div>
  <div style="margin-top:14px;font-size:12.5px;color:var(--gris)">Créneaux saisis : ${Object.values(dispoCal).flat().length}</div>`;
}

function dispoSlotForm(key){
  const slots=dispoCal[key]||[];
  const slotRows=slots.map((s,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <input class="ds_start" type="time" value="${s.start}" style="flex:1;padding:6px;border:1px solid var(--ligne);border-radius:8px;font-family:inherit">
    <span>→</span>
    <input class="ds_end" type="time" value="${s.end}" style="flex:1;padding:6px;border:1px solid var(--ligne);border-radius:8px;font-family:inherit">
    <button class="icon-btn" style="color:var(--rouge)" onclick="this.closest('div').remove()" title="Supprimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>`).join('');
  modal('Disponibilités — '+key,
   `<div id="slot-rows">${slotRows}</div>
    <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="document.getElementById('slot-rows').insertAdjacentHTML('beforeend','<div style=\\'display:flex;align-items:center;gap:8px;margin-bottom:6px\\'><input class=\\"ds_start\\" type=\\"time\\" value=\\"08:00\\" style=\\"flex:1;padding:6px;border:1px solid var(--ligne);border-radius:8px;font-family:inherit\\"><span>→</span><input class=\\"ds_end\\" type=\\"time\\" value=\\"18:00\\" style=\\"flex:1;padding:6px;border:1px solid var(--ligne);border-radius:8px;font-family:inherit\\"><button class=\\"icon-btn\\" style=\\"color:var(--rouge)\\" onclick=\\"this.closest(&quot;div&quot;).remove()\\" title=\\"Supprimer\\"><svg viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" width=\\"14\\" height=\\"14\\"><path d=\\"M18 6L6 18M6 6l12 12\\"/></svg></button></div>')">+ Ajouter un créneau</button>`,
   `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" onclick="saveDispoSlot('${key}')">Enregistrer</button>`);
}

async function saveDispoSlot(key){
  const starts=[...document.querySelectorAll('.ds_start')].map(i=>i.value);
  const ends=[...document.querySelectorAll('.ds_end')].map(i=>i.value);
  const slots=starts.map((s,i)=>({start:s,end:ends[i]})).filter(s=>s.start&&s.end&&s.end>s.start);
  if(slots.length) dispoCal[key]=slots; else delete dispoCal[key];
  closeModal();
  // Sauvegarder dans le profil bénévole lié à ce compte
  const myVol=VOLUNTEERS.find(v=>v.userId===ME.id || (v.mail&&v.mail.toLowerCase()===ME.email.toLowerCase()));
  if(myVol){ myVol.dispo=JSON.stringify(dispoCal);
    try{ await api('save',{method:'POST',c:'volunteers',body:myVol}); toast('Disponibilités enregistrées'); }
    catch(err){ toast('⚠ '+err.message); }
  } else { toast('Disponibilités mises à jour (profil bénévole non lié)'); }
  renderDispoCal();
}

// Override RENDER.compte pour les bénévoles
const _origCompte=RENDER.compte;
RENDER.compte=function(){
  if(ME.role!=='benevole') return _origCompte();
  // Charger les dispos existantes
  const myVol=VOLUNTEERS.find(v=>v.userId===ME.id||(v.mail&&v.mail.toLowerCase()===ME.email.toLowerCase()));
  if(myVol&&myVol.dispo){ try{ dispoCal=JSON.parse(myVol.dispo)||{}; }catch(_){ dispoCal={}; } }
  return `
  <div class="panel" style="max-width:640px">
    <div class="panel-head"><div class="panel-title">Mon profil bénévole</div></div>
    <div style="display:flex;align-items:center;gap:14px;padding:8px 2px">
      <div class="avatar" style="width:52px;height:52px;font-size:18px">${initials(ME.name)}</div>
      <div><div style="font-weight:700;font-size:16px">${esc(ME.name)}</div>
      <div style="color:var(--gris);font-size:13px">${esc(ME.email)}</div></div>
    </div>
  </div>
  <div class="panel" style="max-width:640px">
    <div class="panel-head"><div class="panel-title">Mes disponibilités</div></div>
    <div class="panel-body"><div id="dispo-wrap"></div></div>
  </div>
  <div class="panel" style="max-width:540px">
    <div class="panel-head"><div class="panel-title">Changer mon mot de passe</div></div>
    <div class="form-grid" style="padding:4px 2px">
      <div class="fld col2"><label>Mot de passe actuel</label><input id="pw_cur" type="password" autocomplete="current-password"></div>
      <div class="fld col2"><label>Nouveau mot de passe (8 car. min.)</label><input id="pw_new" type="password" autocomplete="new-password"></div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-primary" onclick="changePw()">Mettre à jour</button></div>
  </div>`;
};
