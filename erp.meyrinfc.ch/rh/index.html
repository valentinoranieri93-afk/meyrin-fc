<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Meyrin FC · RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --jaune:#ffdd00;--jaune-fonce:#c5a900;--jaune-soft:#FFF3C4;
  --noir:#15140F;--noir-2:#211F18;--noir-3:#2C2A21;--encre:#1A1915;
  --gris:#6E6C61;--gris-2:#9A988C;--ligne:#E9E6DC;--ligne-2:#F0EDE4;--ligne-dark:#28261E;
  --bg:#F6F4ED;--carte:#FFFFFF;
  --vert:#1F9D5B;--vert-bg:#E4F4EA;
  --rouge:#D8463A;--rouge-bg:#FBE7E4;
  --orange:#E8902A;--orange-bg:#FCEEDB;
  --bleu:#3B6FE0;--bleu-bg:#E6EDFB;
  --violet:#7B59D8;--violet-bg:#EEE8FB;
  --ombre-s:0 1px 2px rgba(20,18,10,.05);
  --ombre:0 1px 2px rgba(20,18,10,.04),0 6px 20px rgba(20,18,10,.06);
  --ombre-l:0 10px 40px rgba(20,18,10,.14);
  --r:14px;--r-s:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Inter",-apple-system,sans-serif;background:var(--bg);color:var(--encre);font-size:14px;line-height:1.5}
h1,h2,h3,.sora{font-family:"Sora","Inter",sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
table{border-collapse:collapse;width:100%}

.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:var(--noir);color:#C9C7BD;display:flex;flex-direction:column;border-right:1px solid var(--ligne-dark);position:sticky;top:0;height:100vh}
.sb-head{padding:22px 20px 18px;border-bottom:1px solid var(--ligne-dark)}
.sb-back{display:flex;align-items:center;gap:6px;font-size:12px;color:#8C897C;margin-bottom:12px;font-weight:600}
.sb-back:hover{color:#fff}
.sb-name{font-family:"Sora";font-weight:800;font-size:15px;color:#fff}
.sb-sub{font-size:10.5px;color:#8C897C;margin-top:2px}
.season-picker{padding:14px 20px 4px}
.season-picker-label{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:#8C897C;font-weight:700;margin-bottom:6px}
.season-sel{width:100%;background:#211F18;border:1.5px solid #34322a;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:#E8E6DD;cursor:pointer}
.season-sel:focus{border-color:var(--jaune-fonce)}
.sb-nav{flex:1;padding:16px 12px;overflow-y:auto}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:#C9C7BD;margin-bottom:2px;transition:background .15s,color .15s}
.sb-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75}
.sb-item:hover{background:#211F18;color:#fff}
.sb-item.active{background:var(--jaune);color:var(--noir)}
.sb-item.active svg{opacity:1}
.sb-foot{padding:14px 16px;border-top:1px solid var(--ligne-dark)}
.sb-user{font-size:12.5px;color:#C9C7BD;font-weight:600;margin-bottom:8px}
.sb-logout{display:block;text-align:center;padding:8px;background:rgba(255,255,255,.06);border-radius:8px;font-size:12px;color:#9A988C;font-weight:600}
.sb-logout:hover{background:rgba(255,255,255,.12);color:#fff}

.main{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--ligne);min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;position:sticky;top:0;z-index:10;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:800;color:var(--noir)}
.content{padding:26px 28px 60px;max-width:1220px}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:18px 20px;box-shadow:var(--ombre-s)}
.stat-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gris-2);margin-bottom:8px}
.stat-value{font-family:"Sora";font-size:24px;font-weight:800;color:var(--noir)}
.stat-sub{font-size:12px;color:var(--gris);margin-top:4px}

.budget-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--ligne-2)}
.budget-row:last-child{border-bottom:none}
.budget-row-label{font-size:12.5px;color:var(--gris);white-space:nowrap}
.budget-row-value{font-family:"Sora";font-size:15px;font-weight:800;color:var(--noir);white-space:nowrap;text-align:right}

.card{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);box-shadow:var(--ombre-s);margin-bottom:20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--ligne-2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:14.5px;font-weight:700;color:var(--noir)}
.card-body{padding:18px 20px}
.card-body.pad0{padding:0}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor}

.alert-list{list-style:none}
.alert-list li{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--ligne-2);font-size:13px;color:var(--noir-3)}
.alert-list li:last-child{border-bottom:none}
.alert-list li::before{content:'⚠';color:var(--orange)}

th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gris-2);background:#FAFAF7;border-bottom:1px solid var(--ligne)}
td{padding:10px 14px;border-bottom:1px solid var(--ligne-2);font-size:13.5px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF7}
.tbl-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--gris)}
.icon-btn:hover{background:var(--ligne-2);color:var(--noir)}
.icon-btn svg{width:14px;height:14px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;font-family:"Sora";transition:background .15s;white-space:nowrap}
.btn-primary{background:var(--jaune);color:var(--noir)}
.btn-primary:hover{background:var(--jaune-fonce)}
.btn-dark{background:var(--noir);color:#fff}
.btn-dark:hover{background:var(--noir-3)}
.btn-ghost{background:var(--bg);color:var(--noir-3);border:1px solid var(--ligne)}
.btn-ghost:hover{background:var(--ligne-2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn svg{width:14px;height:14px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--noir-3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--ligne);border-radius:10px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--jaune);box-shadow:0 0 0 4px rgba(255,221,0,.2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--noir-3)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ligne);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 16px;font-size:13px;font-weight:700;color:var(--gris);border-bottom:2px solid transparent}
.tab.active{color:var(--noir);border-bottom-color:var(--jaune)}
.tab:hover{color:var(--noir)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,18,10,.5);align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:460px;box-shadow:var(--ombre-l);max-height:88vh;overflow-y:auto}
.modal.wide{max-width:760px}
.modal h3{font-size:16px;font-weight:800;margin-bottom:18px;color:var(--noir)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.modal-error{background:var(--rouge-bg);color:var(--rouge);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;display:none}

.empty{text-align:center;padding:40px 20px;color:var(--gris-2);font-size:13.5px}
.month-picker{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--ligne);border-radius:10px;padding:5px 8px}
.month-picker input{border:none;background:none;padding:4px;width:130px}
.search-bar{display:flex;gap:8px;align-items:center;flex:1;min-width:220px}
.search-bar input{padding:9px 12px;border:1.5px solid var(--ligne);border-radius:10px;background:#fff;flex:1}
.search-bar select{padding:9px 12px;border:1.5px solid var(--ligne);border-radius:10px;background:#fff;min-width:160px}
.pill{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--noir);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--gris);margin-top:4px}
.dropzone{border:2px dashed var(--ligne);border-radius:12px;padding:24px;text-align:center;color:var(--gris);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover{border-color:var(--jaune-fonce);background:var(--jaune-soft)}
.review-match{border:1px solid var(--ligne);border-radius:12px;padding:14px;margin-bottom:12px}
.review-match-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.review-player-row{display:grid;grid-template-columns:1fr 140px 100px;gap:8px;align-items:center;padding:6px 0}
.score-low{color:var(--rouge)}

.matrix-wrap{overflow-x:auto}
.matrix-table th, .matrix-table td{white-space:nowrap}
.matrix-table input.cell-amount{width:90px;padding:6px 8px;border:1.5px solid var(--ligne);border-radius:8px;text-align:right}
.matrix-total{font-weight:800;color:var(--noir)}
.matrix-col-head{display:flex;flex-direction:column;gap:2px}
.matrix-col-head .d{font-weight:700;font-size:12.5px}
.matrix-col-head .a{font-size:11px;color:var(--gris);font-weight:500;text-transform:none;letter-spacing:0}
.import-inline{border:1px solid var(--ligne);border-radius:10px;padding:14px;margin-top:10px;background:var(--bg)}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div class="modal-overlay" id="modal"></div>

<script>
const API = 'api.php';
let STATE = { user: null, page: 'dashboard', month: new Date().toISOString().slice(0,7),
  seasonId: null, seasons: [],
  teams: [], categories: [], postes: [], employees: [], players: [], bareme: [] };

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function chf(n){ return (Number(n)||0).toLocaleString('fr-CH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/** Comme chf(), mais sans décimales quand le montant est rond (finit par ,00). */
function chfSmart(n){
  const v = Math.round((Number(n)||0) * 100) / 100;
  const isWhole = Math.abs(v - Math.round(v)) < 0.001;
  return v.toLocaleString('fr-CH', { minimumFractionDigits: isWhole ? 0 : 2, maximumFractionDigits: 2 });
}

async function api(action, opts = {}) {
  const method = opts.method || 'GET';
  const params = opts.params ? '&' + new URLSearchParams(opts.params).toString() : '';
  const fetchOpts = { method, headers: {} };
  if (opts.form) { fetchOpts.body = opts.form; }
  else if (opts.body) { fetchOpts.headers['Content-Type'] = 'application/json'; fetchOpts.body = JSON.stringify(opts.body); }
  const res = await fetch(`${API}?action=${action}${params}`, fetchOpts);
  if (action === 'export_compta') return res.blob();
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'Erreur serveur');
    err.status = res.status;   // exploité par apiSoft() pour distinguer refus et panne
    if (res.status === 401) location.href = 'https://erp.meyrinfc.ch/?redirect=' + encodeURIComponent(location.href);
    throw err;
  }
  return data;
}

const ICONS = {
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  teams: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>',
  employees: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/>',
  players: '<path d="M12 2l2.4 4.8 5.3.8-3.8 3.7.9 5.3-4.8-2.5-4.8 2.5.9-5.3-3.8-3.7 5.3-.8z"/>',
  primes: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
  payments: '<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.23.5.5.8 1.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>',
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  upload: '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
};
function ic(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

/* Permissions injectées par index.php.
   Leur absence signifie que la page n'a PAS été servie par index.php : soit le
   serveur a livré index.html directement, soit le navigateur affiche une
   version en cache. On ne devine pas des droits dans ce cas, on repasse par
   index.php une seule fois, puis on le dit clairement. */
if (!window.MFC) {
  if (!/[?&]wrapped=1/.test(location.search)) {
    location.replace('index.php?wrapped=1&_=' + Date.now());
  } else {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML =
        '<div style="font-family:system-ui;max-width:520px;margin:80px auto;padding:28px;'
      + 'background:#fff;border-radius:14px;line-height:1.6">'
      + '<h2 style="margin:0 0 10px">Configuration incomplète</h2>'
      + "<p>Cette page n'a pas reçu vos droits d'accès. Signalez-le à l'administrateur.</p></div>";
    });
  }
}
const MFC = window.MFC || {};

const NAV_ALL = [
  { id: 'dashboard', label: 'Dashboard',             icon: 'dashboard', need: 'teamsView' },
  { id: 'teams',     label: 'Équipes',               icon: 'teams',     need: 'teamsView' },
  { id: 'employees', label: 'Employés',              icon: 'employees', need: 'employeesView' },
  { id: 'players',   label: 'Joueurs (1ère équipe)', icon: 'players',   need: 'employeesView' },
  { id: 'primes',    label: 'Primes de match',       icon: 'primes',    need: 'employeesView' },
  { id: 'payments',  label: 'Paiements',             icon: 'payments',  need: 'payrollView' },
  /* Les paramètres regroupent barème d'indemnités et règles de paie : on ne
     les propose qu'à qui peut agir sur au moins l'un des deux. */
  { id: 'settings',  label: 'Paramètres',            icon: 'settings',
    need: ['teamsEdit', 'indemnites', 'payrollView'] },
];

/* Un onglet n'est affiché que si la personne a le droit correspondant. Le
   serveur revérifie chaque appel : ceci évite d'ouvrir un écran qui ne
   renverrait que des erreurs. */
const NAV = NAV_ALL.filter(n =>
  Array.isArray(n.need) ? n.need.some(k => MFC[k]) : MFC[n.need]
);

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="sidebar">
      <div class="sb-head">
        <a href="https://erp.meyrinfc.ch" class="sb-back">${ic('back')} Retour à l'ERP</a>
        <div class="sb-name">Ressources Humaines</div>
        <div class="sb-sub">Meyrin FC</div>
      </div>
      <div class="season-picker">
        <div class="season-picker-label">Saison</div>
        <select id="season-selector" class="season-sel">
          ${STATE.seasons.map(sn => `<option value="${sn.id}" ${sn.id===STATE.seasonId?'selected':''}>${esc(sn.label)}${sn.is_current?' (en cours)':''}</option>`).join('')}
        </select>
      </div>
      <div class="sb-nav">
        ${NAV.map(n => `<div class="sb-item ${STATE.page===n.id?'active':''}" onclick="goTo('${n.id}')">${ic(n.icon)}<span>${n.label}</span></div>`).join('')}
      </div>
      <div class="sb-foot">
        <div class="sb-user">${esc(STATE.user?.name || '')}</div>
        <a class="sb-logout" href="https://erp.meyrinfc.ch/logout.php">Déconnexion</a>
      </div>
    </div>
    <div class="main">
      <div class="topbar"><h1 id="page-title"></h1><div id="topbar-actions" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"></div></div>
      <div class="content" id="content"></div>
    </div>
  `;
  document.getElementById('season-selector').onchange = e => {
    STATE.seasonId = Number(e.target.value);
    localStorage.setItem('rh_season_id', String(STATE.seasonId));
    renderPage();
  };
  renderPage();
}
function goTo(page){ location.hash = page; }
window.addEventListener('hashchange', () => {
  const p = (location.hash || '').replace('#', '');
  if (NAV.some(n => n.id === p) && p !== STATE.page) { STATE.page = p; render(); }
});
async function renderPage() {
  const y = window.scrollY;
  document.getElementById('page-title').textContent = NAV.find(n => n.id === STATE.page)?.label || '';
  const c = document.getElementById('content');
  const pages = { dashboard: renderDashboard, teams: renderTeams, employees: renderEmployees, players: renderPlayers, primes: renderPrimes, payments: renderPayments, settings: renderSettings };
  await (pages[STATE.page] || renderDashboard)(c);
  window.scrollTo(0, y);
}

/* ============================================================ MODAL HELPERS */

function openModal(html, wide=false){
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="modal ${wide?'wide':''}">${html}</div>`;
  m.classList.add('open');
  m.onclick = e => { if (e.target === m) closeModal(); };
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function modalErr(msg){ const e = document.querySelector('.modal-error'); if(e){ e.textContent = msg; e.style.display = 'block'; } }

/* Appel dont un refus de droit n'est pas une erreur fatale : on renvoie une
   valeur de repli et la page se dessine sans ce bloc. Une vraie panne (500,
   réseau) continue de remonter, pour ne pas masquer un incident derrière un
   écran vide. */
async function apiSoft(action, fallback, allowed = true){
  if (!allowed) return fallback;
  try { return await api(action); }
  catch (e) {
    if (e.status === 403) { console.warn('Bloc ignoré, droit manquant :', action); return fallback; }
    throw e;
  }
}

async function loadRefData(){
  /* Ces quatre jeux de données étaient chargés d'un bloc : un seul refus de
     droit (payroll_rules exige l'accès aux salaires) faisait échouer le lot
     entier et laissait les pages Équipes, Employés et Paramètres vides. */
  [STATE.teams, STATE.categories, STATE.postes, STATE.payrollRules] = await Promise.all([
    apiSoft('teams', []),
    apiSoft('team_categories', []),
    apiSoft('postes', []),
    apiSoft('payroll_rules', [], !!MFC.payrollView),
  ]);
}

/* ============================================================ DASHBOARD */

async function renderDashboard(c) {
  document.getElementById('topbar-actions').innerHTML = `
    <div class="month-picker"><input type="month" id="dash-month" value="${STATE.month}"></div>
    <button class="btn btn-dark btn-sm" onclick="exportCompta()">Export compta (CSV)</button>`;
  document.getElementById('dash-month').onchange = e => { STATE.month = e.target.value; renderPage(); };

/* ============================================================ ÉQUIPES */

let EXPANDED_CATS = new Set();
let EXPANDED_TEAMS = new Set();
let TEAM_SLOTS_CACHE = {};
let TEAM_TOTALS = {};
let CATEGORY_SLOTS_CACHE = {};
let CATEGORY_TOTALS = {};
let PAYMENT_TOTALS = { mensuel: 0, semestriel: 0 };

async function renderTeams(c){
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary" onclick="teamModal()">+ Nouvelle équipe</button>`;
  c.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  await loadRefData();
  STATE.employees = await api('employees', { params: { season_id: STATE.seasonId } });
  TEAM_SLOTS_CACHE = {};
  CATEGORY_SLOTS_CACHE = {};
  const totalsRows = await api('team_totals', { params: { season_id: STATE.seasonId } });
  TEAM_TOTALS = {};
  totalsRows.forEach(r => { TEAM_TOTALS[r.team_id] = r.total; });
  const catTotalsRows = await api('category_totals', { params: { season_id: STATE.seasonId } });
  CATEGORY_TOTALS = {};
  catTotalsRows.forEach(r => { CATEGORY_TOTALS[r.category_id] = r.total; });
  PAYMENT_TOTALS = await api('payment_totals', { params: { season_id: STATE.seasonId } });

  if (!STATE.categories.length) {
    c.innerHTML = `<div class="empty">Crée d'abord une catégorie dans Paramètres avant de pouvoir ajouter des équipes.</div>`;
    return;
  }
  renderTeamsTree(c);
}

/** Total mensuel d'une équipe : priorité au cache local (à jour après une édition), sinon valeur chargée en bloc. */
function teamTotal(teamId){
  if (TEAM_SLOTS_CACHE[teamId]) {
    return TEAM_SLOTS_CACHE[teamId].reduce((s, sl) => s + Number(sl.montant) / 12, 0);
  }
  return TEAM_TOTALS[teamId] || 0;
}
/** Total mensuel des postes rattachés directement à une catégorie (ex: Directeur Technique), hors équipes. */
function categoryDirectTotal(categoryId){
  if (CATEGORY_SLOTS_CACHE[categoryId]) {
    return CATEGORY_SLOTS_CACHE[categoryId].reduce((s, sl) => s + Number(sl.montant) / 12, 0);
  }
  return CATEGORY_TOTALS[categoryId] || 0;
}
function categoryTotal(teams, categoryId){
  return teams.reduce((s, t) => s + teamTotal(t.id), 0) + categoryDirectTotal(categoryId);
}
/** Cotisations potentielles d'une équipe : prix de la cotisation × effectif max. */
function teamCotisationTotal(t){
  return (Number(t.cotisation_montant) || 0) * (Number(t.effectif_max) || 0);
}
function categoryCotisationTotal(teams){
  return teams.reduce((s, t) => s + teamCotisationTotal(t), 0);
}

function renderTeamsTree(c){
  const el = c || document.getElementById('content');
  const y = window.scrollY;
  const byCategory = {};
  STATE.teams.forEach(t => { (byCategory[t.category_id] = byCategory[t.category_id] || []).push(t); });
  const grandTotal = STATE.teams.reduce((s, t) => s + teamTotal(t.id), 0) + STATE.categories.reduce((s, c2) => s + categoryDirectTotal(c2.id), 0);
  const grandCotisations = STATE.teams.reduce((s, t) => s + teamCotisationTotal(t), 0);

  el.innerHTML = `
    <div style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gris-2);margin-bottom:8px">Indemnités annuelles Meyrin FC</div>
    <div class="stats-row" style="margin-bottom:18px">
      <div class="stat-card">
        <div class="stat-label">Budget</div>
        <div class="budget-row"><span class="budget-row-label">Mensuel</span><span class="budget-row-value">${chfSmart(grandTotal)} CHF</span></div>
        <div class="budget-row"><span class="budget-row-label">Annuel</span><span class="budget-row-value">${chfSmart(grandTotal*12)} CHF</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Paiements</div>
        <div class="budget-row"><span class="budget-row-label">Mensuels</span><span class="budget-row-value">${chfSmart(PAYMENT_TOTALS.mensuel/12)} CHF/mois</span></div>
        <div class="budget-row"><span class="budget-row-label">Semestriels</span><span class="budget-row-value">${chfSmart(PAYMENT_TOTALS.semestriel/2)} CHF/sem.</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cotisations potentielles</div>
        <div class="budget-row"><span class="budget-row-label">Maximum</span><span class="budget-row-value">${chfSmart(grandCotisations)} CHF</span></div>
      </div>
    </div>
    <datalist id="employee-options">
      ${STATE.employees.map(e=>`<option value="${esc(e.first_name + ' ' + e.last_name)}"></option>`).join('')}
    </datalist>
    <div class="card"><div class="card-body pad0">
      ${STATE.categories.map(cat => catNode(cat, byCategory[cat.id]||[])).join('')}
    </div></div>
  `;
  window.scrollTo(0, y);
}

function catNode(cat, teams){
  const open = EXPANDED_CATS.has(cat.id);
  return `<div style="border-bottom:1px solid var(--ligne-2)">
    <div onclick="toggleCat(${cat.id})" style="display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;font-weight:700;font-size:14px;background:#FAFAF7;color:var(--noir)">
      <span style="display:inline-block;width:12px;transition:transform .15s;transform:rotate(${open?90:0}deg)">▸</span>
      ${esc(cat.name)}
      <span class="pill" style="background:var(--jaune-soft);color:#7A6000">${chf(categoryTotal(teams, cat.id))} CHF/mois</span>
      <span class="pill" style="background:var(--ligne-2);color:var(--noir-3)">${chf(categoryTotal(teams, cat.id)*12)} CHF/an</span>
      ${categoryCotisationTotal(teams) > 0 ? `<span class="pill" style="background:var(--vert-bg);color:var(--vert)">${chf(categoryCotisationTotal(teams))} CHF cotis.</span>` : ''}
      <span style="margin-left:auto;font-weight:500;font-size:12px;color:var(--gris)">${teams.length} équipe${teams.length>1?'s':''}</span>
    </div>
    ${open ? `<div>
      ${teams.length ? teams.map(t => teamNode(t)).join('') : `<div class="empty" style="padding:14px 18px">Aucune équipe dans cette catégorie.</div>`}
      ${categorySlotsBlock(cat)}
    </div>` : ''}
  </div>`;
}

function teamNode(t){
  const open = EXPANDED_TEAMS.has(t.id);
  return `<div style="border-bottom:1px solid var(--ligne-2);background:#fff">
    <div style="display:flex;align-items:center;gap:8px;padding:11px 18px 11px 36px">
      <span onclick="toggleTeam(${t.id})" style="cursor:pointer;display:flex;align-items:center;gap:8px;flex:1;min-width:0">
        <span style="display:inline-block;width:11px;font-size:12px;transition:transform .15s;transform:rotate(${open?90:0}deg)">▸</span>
        <span style="font-size:13.5px;font-weight:600">${esc(t.name)}</span>
        <span class="pill" style="background:var(--bleu-bg);color:var(--bleu)">${chf(teamTotal(t.id))} CHF/mois</span>
        <span class="pill" style="background:var(--ligne-2);color:var(--noir-3)">${chf(teamTotal(t.id)*12)} CHF/an</span>
        ${teamCotisationTotal(t) > 0 ? `<span class="pill" style="background:var(--vert-bg);color:var(--vert)">${esc(t.effectif_max)} × ${chf(t.cotisation_montant)} = ${chf(teamCotisationTotal(t))} CHF</span>` : ''}
      </span>
      <select onchange="quickChangeCategory(${t.id}, this.value)" style="font-size:11px;padding:4px 6px;border:1px solid var(--ligne);border-radius:6px">
        ${STATE.categories.map(c=>`<option value="${c.id}" ${c.id===t.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}
      </select>
      <button class="icon-btn" data-obj="${esc(JSON.stringify(t))}" onclick="teamModal(JSON.parse(this.dataset.obj))" title="Modifier">✎</button>
      <button class="icon-btn" onclick="deleteTeam(${t.id})" title="Supprimer">✕</button>
    </div>
    ${open ? `<div style="padding:4px 18px 16px 60px">${teamSlotsBlock(t)}</div>` : ''}
  </div>`;
}

function teamSlotsBlock(t){
  const slots = TEAM_SLOTS_CACHE[t.id] || [];
  return `
    ${slots.length ? slots.map(sl => slotRow(sl)).join('') : `<div class="empty" style="padding:10px 0">Aucun poste pour cette équipe.</div>`}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:10px">
      <select id="ns-poste-${t.id}" style="flex:1;min-width:140px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px">
        ${STATE.postes.map(p=>`<option value="${p.id}">${esc(p.label)}</option>`).join('')}
      </select>
      <input id="ns-montant-${t.id}" type="number" step="0.05" placeholder="Montant annuel CHF" style="width:130px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px">
      <button class="btn btn-primary btn-sm" onclick="addSlot(${t.id})">+ Ajouter un poste</button>
    </div>
  `;
}

async function toggleCat(id){
  if (EXPANDED_CATS.has(id)) { EXPANDED_CATS.delete(id); renderTeamsTree(); return; }
  EXPANDED_CATS.add(id);
  if (!CATEGORY_SLOTS_CACHE[id]) CATEGORY_SLOTS_CACHE[id] = await api('employee_assignments', { params: { category_id: id, season_id: STATE.seasonId } });
  renderTeamsTree();
}
async function toggleTeam(id){
  if (EXPANDED_TEAMS.has(id)) { EXPANDED_TEAMS.delete(id); renderTeamsTree(); return; }
  EXPANDED_TEAMS.add(id);
  if (!TEAM_SLOTS_CACHE[id]) TEAM_SLOTS_CACHE[id] = await api('employee_assignments', { params: { team_id: id, season_id: STATE.seasonId } });
  renderTeamsTree();
}
async function refreshTeamSlots(teamId){
  TEAM_SLOTS_CACHE[teamId] = await api('employee_assignments', { params: { team_id: teamId, season_id: STATE.seasonId } });
  renderTeamsTree();
}
async function quickChangeCategory(teamId, categoryId){
  const t = STATE.teams.find(x => x.id === teamId);
  await api('teams', { method: 'PUT', body: { id: teamId, name: t.name, category_id: Number(categoryId), active: t.active == 1 } });
  renderPage();
}

function teamModal(t){
  if (!STATE.categories.length) { alert("Crée d'abord une catégorie dans Paramètres."); return; }
  openModal(`
    <h3>${t ? 'Modifier' : 'Nouvelle'} équipe</h3>
    <div class="modal-error"></div>
    <div class="field"><label>Nom</label><input id="tm-name" value="${t?esc(t.name):''}" placeholder="Ex: Première équipe"></div>
    <div class="field"><label>Catégorie</label><select id="tm-category">
      ${STATE.categories.map(c=>`<option value="${c.id}" ${t?(t.category_id==c.id?'selected':''):''}>${esc(c.name)}</option>`).join('')}
    </select></div>
    <div class="field-row">
      <div class="field"><label>Prix cotisation (CHF)</label><input id="tm-cotisation" type="number" step="0.05" value="${t&&t.cotisation_montant?t.cotisation_montant:''}"></div>
      <div class="field"><label>Effectif max (joueurs)</label><input id="tm-effectif" type="number" step="1" value="${t&&t.effectif_max?t.effectif_max:''}"></div>
    </div>
    ${t ? `<div class="field check-row"><input type="checkbox" id="tm-active" ${t.active==1?'checked':''}><label style="margin:0" for="tm-active">Équipe active</label></div>` : ''}
    <div class="modal-actions">
      ${t ? `<button class="btn btn-ghost" onclick="deleteTeam(${t.id})" style="color:var(--rouge);margin-right:auto">Supprimer</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveTeam(${t?t.id:'null'})">Enregistrer</button>
    </div>
  `);
}
async function saveTeam(id){
  const name = document.getElementById('tm-name').value.trim();
  const category_id = Number(document.getElementById('tm-category').value);
  const cotisation_montant = Number(document.getElementById('tm-cotisation').value) || 0;
  const effectif_max = Number(document.getElementById('tm-effectif').value) || 0;
  if (!name) return modalErr('Le nom est requis.');
  try {
    if (id) { const active = document.getElementById('tm-active').checked; await api('teams', { method: 'PUT', body: { id, name, category_id, active, cotisation_montant, effectif_max } }); }
    else { await api('teams', { method: 'POST', body: { name, category_id, cotisation_montant, effectif_max } }); }
    closeModal(); renderPage();
  } catch (e) { modalErr(e.message); }
}
async function deleteTeam(id){
  if (!confirm('Supprimer cette équipe ? Tous ses postes seront aussi supprimés.')) return;
  try { await api('teams', { method: 'DELETE', params: { id } }); closeModal(); renderPage(); }
  catch (e) { alert(e.message); }
}

/* ---- Postes d'une équipe : rôle, employé (recherche), montant, périodicité ---- */

function findSlot(teamId, slotId){ return (TEAM_SLOTS_CACHE[teamId]||[]).find(s => s.id === slotId); }

function slotRow(sl){
  const currentName = sl.employee_id ? `${sl.first_name} ${sl.last_name}` : '';
  return `<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ligne-2);flex-wrap:wrap">
    <span style="flex:1;min-width:110px;font-size:13px;font-weight:600">${esc(sl.poste_label)}</span>
    <input list="employee-options" value="${esc(currentName)}" placeholder="Employé (facultatif)…" style="width:170px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px" onchange="updateSlotEmployee(${sl.id},${sl.team_id},this.value)">
    <input type="number" step="0.05" value="${sl.montant}" title="Montant annuel CHF" style="width:105px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px" onchange="updateSlotAmount(${sl.id},${sl.team_id},this.value)">
    <button class="icon-btn" onclick="deleteSlot(${sl.id},${sl.team_id})" title="Retirer ce poste">✕</button>
  </div>`;
}
async function updateSlotEmployee(slotId, teamId, name){
  const sl = findSlot(teamId, slotId);
  const match = STATE.employees.find(e => normalizeFr(`${e.first_name} ${e.last_name}`) === normalizeFr(name));
  await api('employee_assignments', { method: 'PUT', body: { id: slotId, poste_id: sl.poste_id, employee_id: match ? match.id : null, montant: sl.montant } });
  refreshTeamSlots(teamId);
}
async function updateSlotAmount(slotId, teamId, value){
  const sl = findSlot(teamId, slotId);
  await api('employee_assignments', { method: 'PUT', body: { id: slotId, poste_id: sl.poste_id, employee_id: sl.employee_id, montant: Number(value)||0 } });
  refreshTeamSlots(teamId);
}
async function deleteSlot(slotId, teamId){
  if (!confirm('Retirer ce poste de cette équipe ?')) return;
  await api('employee_assignments', { method: 'DELETE', params: { id: slotId } });
  refreshTeamSlots(teamId);
}
async function addSlot(teamId){
  const poste_id = Number(document.getElementById(`ns-poste-${teamId}`).value);
  const montant = Number(document.getElementById(`ns-montant-${teamId}`).value) || 0;
  try {
    await api('employee_assignments', { method: 'POST', body: { team_id: teamId, poste_id, montant, season_id: STATE.seasonId } });
    refreshTeamSlots(teamId);
  } catch (e) { alert(e.message); }
}

/* ---- Postes rattachés directement à une catégorie (ex: Directeur Technique) ---- */

function categorySlotsBlock(cat){
  const slots = CATEGORY_SLOTS_CACHE[cat.id] || [];
  return `
    <div style="padding:4px 18px 16px 36px;border-top:1px solid var(--ligne-2)">
      <div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gris-2);margin:10px 0 6px">Postes de la catégorie (ex: Directeur Technique)</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:10px">
        <select id="ncs-poste-${cat.id}" style="flex:1;min-width:140px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px">
          ${STATE.postes.map(p=>`<option value="${p.id}">${esc(p.label)}</option>`).join('')}
        </select>
        <input id="ncs-montant-${cat.id}" type="number" step="0.05" placeholder="Montant annuel CHF" style="width:130px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px">
        <button class="btn btn-primary btn-sm" onclick="addCategorySlot(${cat.id})">+ Ajouter un poste</button>

function findCategorySlot(categoryId, slotId){ return (CATEGORY_SLOTS_CACHE[categoryId]||[]).find(s => s.id === slotId); }
function categorySlotRow(sl, categoryId){
  const currentName = sl.employee_id ? `${sl.first_name} ${sl.last_name}` : '';
  return `<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ligne-2);flex-wrap:wrap">

async function refreshCategorySlots(categoryId){

async function updateCategorySlotEmployee(slotId, categoryId, name){

async function updateCategorySlotAmount(slotId, categoryId, value){
  const sl = findCategorySlot(categoryId, slotId);
  await api('employee_assignments', { method: 'PUT', body: { id: slotId, poste_id: sl.poste_id, employee_id: sl.employee_id, montant: Number(value)||0 } });
  refreshCategorySlots(categoryId);
}
async function deleteCategorySlot(slotId, categoryId){
  if (!confirm('Retirer ce poste de cette catégorie ?')) return;
  await api('employee_assignments', { method: 'DELETE', params: { id: slotId } });
  refreshCategorySlots(categoryId);
}
async function addCategorySlot(categoryId){
  const poste_id = Number(document.getElementById(`ncs-poste-${categoryId}`).value);
  const montant = Number(document.getElementById(`ncs-montant-${categoryId}`).value) || 0;
  try {
    await api('employee_assignments', { method: 'POST', body: { category_id: categoryId, poste_id, montant, season_id: STATE.seasonId } });
    refreshCategorySlots(categoryId);
  } catch (e) { alert(e.message); }
}

async function importFile(action, file, onDone){
  const fd = new FormData(); fd.append('file', file);
  try {
    const res = await api(action, { method: 'POST', form: fd });
    let msg = `Import terminé : ${res.created} employé(s) créé(s), ${res.updated} mis à jour, ${res.skipped} ignoré(s)`;
    if (res.assignments !== undefined) msg += `, ${res.assignments} affectation(s)`;
    if (res.players_created !== undefined) msg += `. Joueurs : ${res.players_created} créé(s), ${res.players_updated} mis à jour`;
    alert(msg + '.');
    onDone();
  } catch (e) { alert('Échec de l\'import : ' + e.message); }
}

/** Affectations d'un employé à retenir pour les filtres : toutes saisons, ou une seule si EMP_FILTER.season est posé. */
function empFilterAssignments(ee){
  return EMP_FILTER.season ? ee.assignments.filter(a => String(a.season_id) === String(EMP_FILTER.season)) : ee.assignments;
}

function renderEmployeeTable(){
  const el = document.getElementById('emp-table');
  const q = normalizeFr(EMP_FILTER.search);
  const currentSeason = STATE.seasons.find(sn => sn.id === STATE.seasonId);
  const list = STATE.employees.filter(e => {
    const asg = empFilterAssignments(e);
    if (EMP_FILTER.season && !asg.length) return false;
    if (EMP_FILTER.poste && !asg.some(a => String(a.poste_id) === String(EMP_FILTER.poste))) return false;
    if (EMP_FILTER.team && !asg.some(a => String(a.team_id) === String(EMP_FILTER.team))) return false;
    if (!q) return true;
    const hay = normalizeFr(`${e.first_name} ${e.last_name} ${e.email}`);
    return hay.includes(q);
  });
  list.sort((a, b) => normalizeFr(a.last_name).localeCompare(normalizeFr(b.last_name)) || normalizeFr(a.first_name).localeCompare(normalizeFr(b.first_name)));
  el.innerHTML = list.length ? `<table><thead><tr><th>Nom</th><th>Affectation${EMP_FILTER.season?'':' (toutes saisons)'}</th><th>E-mail</th><th>Téléphone</th><th>Indemnités / mois${currentSeason?' ('+esc(currentSeason.label)+')':''}</th><th></th></tr></thead><tbody>
    ${list.map(ee => { const asg = empFilterAssignments(ee); return `<tr>
      <td><a href="javascript:void(0)" data-obj="${esc(JSON.stringify(ee))}" onclick="employeeDetailModal(JSON.parse(this.dataset.obj))" style="font-weight:700;color:var(--noir)">${esc(ee.first_name)} ${esc(ee.last_name)}</a>${ee.active==0?' <span class="pill" style="background:var(--rouge-bg);color:var(--rouge)">inactif</span>':''}</td>
      <td>${asg.length ? asg.map(a=>`<span class="pill" style="background:var(--bleu-bg);color:var(--bleu);margin:0 4px 4px 0;display:inline-flex;align-items:center;gap:4px">${esc(a.poste_label)}${a.team_name?' · '+esc(a.team_name):(a.category_name?' · '+esc(a.category_name)+' (catégorie)':'')}${!EMP_FILTER.season?' · '+esc(a.season_label||''):''}</span>`).join('') : '<span style="color:var(--gris-2)">—</span>'}
      </td>
      <td style="font-size:12.5px;color:var(--gris)">${esc(ee.email)}</td>
      <td style="font-size:12.5px;color:var(--gris)">${esc(ee.phone)}</td>
      <td><strong>${chf(ee.total_indemnites)} CHF</strong></td>
      <td><div class="tbl-actions">
        <button class="icon-btn" data-obj="${esc(JSON.stringify(ee))}" onclick="employeeModal(JSON.parse(this.dataset.obj))">✎</button>
        <button class="icon-btn" onclick="indemniteModal(${ee.id})" title="Indemnité personnalisée">CHF</button>
        <button class="icon-btn" onclick="deleteEmployee(${ee.id})">✕</button>
      </div></td>
    </tr>`; }).join('')}
  </tbody></table>` : `<div class="empty">Aucun employé ne correspond.</div>`;
}

  }).join('');

        <select onchange="updateEmployeePaiement(${ee.id}, this.value, ${seasonId})">
          <option value="mensuel" ${ee.paiement!=='semestriel'?'selected':''}>Mensuel</option>

      </div>

        <label>Saison affichée</label>
        <select data-obj="${esc(JSON.stringify(ee))}" onchange="employeeDetailModal(JSON.parse(this.dataset.obj), Number(this.value))">
          ${STATE.seasons.map(sn=>`<option value="${sn.id}" ${sn.id===seasonId?'selected':''}>${esc(sn.label)}</option>`).join('')}
        </select>
      </div>
    </div>
    <h4 style="font-size:13px;font-weight:700;margin-bottom:8px">Équipes & indemnités ${currentSeason?'— '+esc(currentSeason.label):''}</h4>
    ${rows.length ? rows.map(a => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ligne-2);font-size:13px">
        <span>${esc(a.poste_label)}${a.team_name?' — '+esc(a.team_name):(a.category_name?' — '+esc(a.category_name)+' (catégorie)':'')}</span>
        <strong>${chf(a.montant)} CHF/an</strong>
      </div>`).join('') : `<div class="empty" style="padding:10px 0">Aucune affectation pour cette saison.</div>`}
    ${rows.length ? `<div style="display:flex;justify-content:space-between;padding:8px 0 0;font-size:13px">
        <span style="font-weight:700">${periodLabel}</span>
        <strong>${chf(periodValue)} ${periodSuffix} <span style="font-weight:500;color:var(--gris)">(${chf(totalAnnuel)} CHF/an)</span></strong>

async function updateEmployeePaiement(id, paiement, seasonId){
  const ee = STATE.employees.find(e => e.id === id);

        <h3>Primes — ${esc(STATE.month)}</h3>

      <div class="card-body pad0 matrix-wrap">

          ${data.matches.length ? `<tr><td><strong>Total match</strong></td>${data.matches.map(m => `<td><strong>${chf(data.players.reduce((s,p)=>s+(p.cells[m.id]||0),0))} CHF</strong></td>`).join('')}<td></td></tr>` : ''}

async function submitImport(){
  const btn = document.getElementById('imp-submit');
  const status = document.getElementById('imp-status');
  const month = document.getElementById('imp-month').value;
  const file = document.getElementById('imp-file').files[0];
  const text = document.getElementById('imp-text').value.trim();

  btn.disabled = true; status.innerHTML = `<span class="spinner"></span> Analyse en cours (Claude)…`;

    let result;
    if (file) { const fd = new FormData(); fd.append('file', file); fd.append('month', month); result = await api('import_upload', { method: 'POST', form: fd }); }

let DRAG_CAT = null;
function onCatDragStart(e, id){
  DRAG_CAT = id;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.style.opacity = '.4';
}
function onCatDragOver(e){
  if (DRAG_CAT === null && DRAG_TEAM === null) return;
  e.preventDefault();
  e.currentTarget.style.background = 'var(--jaune-soft)';
}
function onCatDragLeave(e){ e.currentTarget.style.background = '#FAFAF7'; }
async function onCatDrop(e, targetId){
  e.preventDefault();
  e.currentTarget.style.background = '#FAFAF7';
  // Déposer une équipe sur l'en-tête d'une catégorie : la déplace (à la fin) dans cette catégorie,
  // y compris depuis une autre catégorie.
  if (DRAG_TEAM !== null) {
    const dragged = DRAG_TEAM;
    DRAG_TEAM = null;
    await moveTeamToCategory(dragged.id, targetId, null);
    return;
  }
  if (DRAG_CAT === null || DRAG_CAT === targetId) { DRAG_CAT = null; return; }
  const fromIdx = STATE.categories.findIndex(c => c.id === DRAG_CAT);
  const toIdx = STATE.categories.findIndex(c => c.id === targetId);
  DRAG_CAT = null;
  if (fromIdx < 0 || toIdx < 0) return;
  const arr = STATE.categories.slice();
  const [moved] = arr.splice(fromIdx, 1);
  arr.splice(toIdx, 0, moved);
  STATE.categories = arr;
  renderSettingsBody();
  await api('team_categories_reorder', { method: 'POST', body: { ids: arr.map(c => c.id) } });
}
function onCatDragEnd(e){ e.currentTarget.style.opacity = ''; DRAG_CAT = null; }

function teamSettingsRow(t, idx, total){
  return `<div draggable="true" data-team-id="${t.id}" data-category-id="${t.category_id}"

    ondragover="onTeamDragOver(event,${t.category_id})"
    ondragleave="onTeamDragLeave(event)"
    ondrop="onTeamDrop(event,${t.id},${t.category_id})"
    ondragend="onTeamDragEnd(event)"
    style="display:flex;align-items:center;gap:8px;padding:9px 18px 9px 46px;background:#fff;border-top:1px solid var(--ligne-2);cursor:grab">
    <span style="color:var(--gris-2);font-size:14px;line-height:1;user-select:none" title="Glisser pour réordonner">⠿</span>
    <input value="${esc(t.name)}" style="flex:1;font-size:13px;padding:6px 8px;border:1.5px solid transparent;border-radius:6px" onfocus="this.style.borderColor='var(--ligne)'" onblur="this.style.borderColor='transparent';saveTeamName(${t.id},this.value)" onkeydown="if(event.key==='Enter')this.blur()">
    <button class="icon-btn" onclick="deleteTeam(${t.id})" title="Supprimer">✕</button>
  </div>`;
}

let DRAG_TEAM = null;
function onTeamDragStart(e, teamId, categoryId){
  DRAG_TEAM = { id: teamId, categoryId };
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.style.opacity = '.4';
}
function onTeamDragOver(e, categoryId){
  if (!DRAG_TEAM) return;
  e.preventDefault();
  e.currentTarget.style.background = 'var(--jaune-soft)';
}
function onTeamDragLeave(e){ e.currentTarget.style.background = '#fff'; }
async function onTeamDrop(e, targetTeamId, categoryId){
  e.preventDefault();
  e.currentTarget.style.background = '#fff';
  const dragged = DRAG_TEAM;
  DRAG_TEAM = null;
  if (!dragged || dragged.id === targetTeamId) return;
  await moveTeamToCategory(dragged.id, categoryId, targetTeamId);
}
function onTeamDragEnd(e){ e.currentTarget.style.opacity = ''; DRAG_TEAM = null; }

/** Déplace une équipe vers (ou au sein d') une catégorie, en l'insérant avant `insertBeforeTeamId`
 * (ou à la fin si null), et persiste l'ordre + le rattachement de catégorie côté serveur. */
async function moveTeamToCategory(teamId, targetCategoryId, insertBeforeTeamId){
  const team = STATE.teams.find(t => t.id === teamId);
  if (!team) return;
  const sameCategory = team.category_id === targetCategoryId;
  if (sameCategory && team.id === insertBeforeTeamId) return;
  const destScoped = STATE.teams.filter(t => t.category_id === targetCategoryId && t.id !== teamId);
  let insertIdx = destScoped.length;
  if (insertBeforeTeamId != null) {
    const idx = destScoped.findIndex(t => t.id === insertBeforeTeamId);
    if (idx >= 0) insertIdx = idx;
  }
  const arr = destScoped.slice();
  arr.splice(insertIdx, 0, { ...team, category_id: targetCategoryId });
  const others = STATE.teams.filter(t => t.category_id !== targetCategoryId && t.id !== teamId);
  STATE.teams = [...others, ...arr];
  SETTINGS_EXPANDED_CATS.add(targetCategoryId);
  renderSettingsBody();
  try {
    if (!sameCategory) {
      await api('teams', { method: 'PUT', body: { id: teamId, name: team.name, category_id: targetCategoryId, active: team.active == 1 } });
    }
    await api('teams_reorder', { method: 'POST', body: { ids: arr.map(t => t.id) } });
  } catch (e) { alert(e.message); }
  await refreshSettings();
}

function toggleSettingsCat(id){
  if (SETTINGS_EXPANDED_CATS.has(id)) SETTINGS_EXPANDED_CATS.delete(id); else SETTINGS_EXPANDED_CATS.add(id);
  renderSettingsBody();
}
async function saveTeamName(id, name){
  name = name.trim();
  const t = STATE.teams.find(x => x.id === id);
  if (!t || !name || name === t.name) { renderSettingsBody(); return; }
  try { await api('teams', { method: 'PUT', body: { id, name, category_id: t.category_id, active: t.active == 1 } }); await refreshSettings(); }
  catch (e) { alert(e.message); renderSettingsBody(); }
}
async function addCategoryInline(){
  const input = document.getElementById('new-cat-name');
  const name = input.value.trim();
  if (!name) return;
  try { await api('team_categories', { method: 'POST', body: { name } }); await refreshSettings(); }
  catch (e) { alert(e.message); }
}
async function addTeamInline(categoryId){
  const input = document.getElementById(`new-team-${categoryId}`);
  const name = input.value.trim();
  if (!name) return;
  try { await api('teams', { method: 'POST', body: { name, category_id: categoryId } }); SETTINGS_EXPANDED_CATS.add(categoryId); await refreshSettings(); }
  catch (e) { alert(e.message); }
}
async function deleteCategory(id){
  if (!confirm('Supprimer cette catégorie ? Impossible si des équipes y sont encore rattachées.')) return;
  try { await api('team_categories', { method: 'DELETE', params: { id } }); await refreshSettings(); }
  catch (e) { alert(e.message); }
}

function renderRolesTab(el){
  el.innerHTML = `
    <div class="card">
      <div class="card-head"><h3>Rôles</h3><button class="btn btn-primary btn-sm" onclick="posteModal()">+ Nouveau rôle</button></div>
      <div class="card-body pad0">
        ${STATE.postes.length ? `<table><thead><tr><th>Libellé</th><th></th></tr></thead><tbody>
          ${STATE.postes.map(p => `<tr><td>${esc(p.label)}</td>
            <td><div class="tbl-actions"><button class="icon-btn" data-obj="${esc(JSON.stringify(p))}" onclick="posteModal(JSON.parse(this.dataset.obj))">✎</button><button class="icon-btn" onclick="deletePoste(${p.id})">✕</button></div></td></tr>`).join('')}

function posteModal(p){
  openModal(`
    <h3>${p?'Modifier':'Nouveau'} rôle</h3>

      ${p ? `<button class="btn btn-ghost" onclick="deletePoste(${p.id})" style="color:var(--rouge);margin-right:auto">Supprimer</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="savePoste(${p?p.id:'null'})">Enregistrer</button>

async function savePoste(id){
  const label = document.getElementById('pt-label').value.trim();
  if (!label) return modalErr('Le libellé est requis.');
  try {
    if (id) await api('postes', { method: 'PUT', body: { id, label, active: true } });
    else await api('postes', { method: 'POST', body: { label } });
    closeModal(); await refreshSettings();
  } catch (e) { modalErr(e.message); }
}
async function deletePoste(id){
  if (!confirm('Supprimer définitivement ce rôle ? Il sera retiré de toutes les équipes où il est utilisé.')) return;
  await api('postes', { method: 'DELETE', params: { id } }); closeModal(); await refreshSettings();
}

/* ============================================================ PARAMÈTRES > PAIE */

const PAYROLL_CATEGORIES = [
  { id: 'impot_source', label: 'Impôt à la source' },
  { id: 'charge_sociale', label: 'Charges sociales' },
  { id: 'assurance_accident', label: 'Assurance accident (AA/AANP)' },
  { id: 'lpp', label: 'Prévoyance professionnelle (LPP)' },
];
function payrollCategoryLabel(id){ return (PAYROLL_CATEGORIES.find(c => c.id === id) || {}).label || id; }

function renderPaieTab(el){
  el.innerHTML = `
    <p class="hint" style="margin-bottom:16px">Définis ici tes propres règles (libellé + taux en % du brut, ou montant fixe en CHF). Elles seront activables individuellement sur chaque fiche employé pour le calcul de ses décomptes.</p>
    ${PAYROLL_CATEGORIES.map(cat => payrollCategoryCard(cat)).join('')}
  `;
}
function payrollCategoryCard(cat){
  const rules = (STATE.payrollRules || []).filter(r => r.category === cat.id);
  return `
    <div class="card">
      <div class="card-head"><h3>${esc(cat.label)}</h3></div>
      <div class="card-body pad0">
        ${rules.length ? `<table><thead><tr><th>Libellé</th><th>Type</th><th>Valeur</th><th></th></tr></thead><tbody>
          ${rules.map(r => `<tr>
            <td>${esc(r.label)}${r.active==0?' <span class="pill" style="background:var(--rouge-bg);color:var(--rouge)">inactive</span>':''}</td>
            <td>${r.type==='percent'?'% du brut':'Montant fixe'}</td>
            <td>${r.type==='percent'?chf(r.valeur)+' %':chf(r.valeur)+' CHF'}</td>
            <td><div class="tbl-actions">
              <button class="icon-btn" data-obj="${esc(JSON.stringify(r))}" onclick="payrollRuleModal(JSON.parse(this.dataset.obj))">✎</button>
              <button class="icon-btn" onclick="deletePayrollRule(${r.id})">✕</button>
            </div></td>
          </tr>`).join('')}
        </tbody></table>` : `<div class="empty">Aucune règle dans cette catégorie.</div>`}
        <div style="padding:14px 18px"><button class="btn btn-primary btn-sm" onclick="payrollRuleModal(null,'${cat.id}')">+ Ajouter une règle</button></div>
      </div>
    </div>
  `;
}
function payrollRuleModal(r, category){
  const cat = r ? r.category : category;
  openModal(`
    <h3>${r?'Modifier':'Nouvelle'} règle — ${esc(payrollCategoryLabel(cat))}</h3>
    <div class="modal-error"></div>
    <div class="field"><label>Libellé</label><input id="pr-label" value="${r?esc(r.label):''}" placeholder="Ex: AVS/AI/APG"></div>
    <div class="field-row">
      <div class="field"><label>Type</label><select id="pr-type">
        <option value="percent" ${(!r||r.type==='percent')?'selected':''}>% du brut</option>
        <option value="fixe" ${r&&r.type==='fixe'?'selected':''}>Montant fixe CHF</option>
      </select></div>
      <div class="field"><label>Valeur</label><input id="pr-valeur" type="number" step="0.01" value="${r?r.valeur:''}"></div>
    </div>
    ${r ? `<div class="field check-row"><input type="checkbox" id="pr-active" ${r.active==1?'checked':''}><label style="margin:0" for="pr-active">Règle active</label></div>` : ''}
    <div class="modal-actions">
      ${r ? `<button class="btn btn-ghost" onclick="deletePayrollRule(${r.id})" style="color:var(--rouge);margin-right:auto">Supprimer</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="savePayrollRule(${r?r.id:'null'},'${cat}')">Enregistrer</button>
    </div>
  `);
}
async function savePayrollRule(id, category){
  const label = document.getElementById('pr-label').value.trim();
  const type = document.getElementById('pr-type').value;
  const valeur = Number(document.getElementById('pr-valeur').value) || 0;
  if (!label) return modalErr('Le libellé est requis.');
  try {
    if (id) { const active = document.getElementById('pr-active').checked; await api('payroll_rules', { method: 'PUT', body: { id, category, label, type, valeur, active } }); }
    else { await api('payroll_rules', { method: 'POST', body: { category, label, type, valeur } }); }
    closeModal(); await refreshSettings();
  } catch (e) { modalErr(e.message); }
}
async function deletePayrollRule(id){
  if (!confirm('Supprimer cette règle de paie ? Elle sera retirée des fiches employés où elle est activée.')) return;
  try { await api('payroll_rules', { method: 'DELETE', params: { id } }); closeModal(); await refreshSettings(); }
  catch (e) { alert(e.message); }
}

/* ============================================================ PAIEMENTS (suivi mensuel employés + joueurs) */

let PAYMENTS_DATA = null;
let PAYMENTS_SEARCH = '';
let PAYMENTS_STATUS_FILTER = '';

async function renderPayments(c){
  document.getElementById('topbar-actions').innerHTML = `<div class="month-picker"><input type="month" id="pay-month" value="${STATE.month}"></div>`;
  document.getElementById('pay-month').onchange = e => { STATE.month = e.target.value; renderPage(); };
  c.innerHTML = `<div class="empty"><span class="spinner"></span> Chargement…</div>`;
  try { PAYMENTS_DATA = await api('payments', { params: { month: STATE.month, season_id: STATE.seasonId } }); }
  catch (e) { c.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  renderPaymentsTable(c);
}

function renderPaymentsTable(c){
  const d = PAYMENTS_DATA;
  const restant = d.total_du - d.total_paye;
  c.innerHTML = `
    <div class="stats-row" style="margin-bottom:18px">
      <div class="stat-card"><div class="stat-label">Dû ce mois</div><div class="stat-value">${chf(d.total_du)} CHF</div></div>
      <div class="stat-card"><div class="stat-label">Payé ce mois</div><div class="stat-value">${chf(d.total_paye)} CHF</div></div>
      <div class="stat-card"><div class="stat-label">Restant ce mois</div><div class="stat-value">${chf(restant)} CHF</div></div>
      <div class="stat-card">
        <div class="stat-label">Année ${esc(d.month.slice(0,4))}</div>
        <div class="budget-row"><span class="budget-row-label">Dû</span><span class="budget-row-value">${chfSmart(d.annee_du)} CHF</span></div>
        <div class="budget-row"><span class="budget-row-label">Payé</span><span class="budget-row-value">${chfSmart(d.annee_paye)} CHF</span></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <input id="pay-search" value="${esc(PAYMENTS_SEARCH)}" placeholder="Rechercher un nom…" style="padding:7px 10px;border:1.5px solid var(--ligne);border-radius:8px;font-size:13px;min-width:240px">
      <select id="pay-status-filter" style="padding:7px 10px;border:1.5px solid var(--ligne);border-radius:8px;font-size:13px">
        <option value="" ${PAYMENTS_STATUS_FILTER===''?'selected':''}>Tous</option>
        <option value="paid" ${PAYMENTS_STATUS_FILTER==='paid'?'selected':''}>Payé</option>
        <option value="unpaid" ${PAYMENTS_STATUS_FILTER==='unpaid'?'selected':''}>Non payé</option>
      </select>
    </div>
    <div id="payments-rows"></div>
  `;
  document.getElementById('pay-search').oninput = e => { PAYMENTS_SEARCH = e.target.value; renderPaymentsRows(); };
  document.getElementById('pay-status-filter').onchange = e => { PAYMENTS_STATUS_FILTER = e.target.value; renderPaymentsRows(); };
  renderPaymentsRows();
}

function renderPaymentsRows(){
  const d = PAYMENTS_DATA;
  const el = document.getElementById('payments-rows');
  const q = normalizeFr(PAYMENTS_SEARCH.trim());
  let rows = q ? d.rows.filter(r => normalizeFr(r.name).includes(q)) : d.rows;
  if (PAYMENTS_STATUS_FILTER === 'paid') rows = rows.filter(r => r.paid);
  else if (PAYMENTS_STATUS_FILTER === 'unpaid') rows = rows.filter(r => !r.paid);
  el.innerHTML = `
    <div class="card"><div class="card-body pad0">
      ${rows.length ? `<table><thead><tr><th>Personne</th><th>Détail</th><th>Montant</th><th>Payé</th><th>Note</th><th>Fiche de paie</th><th>Espace perso</th></tr></thead><tbody>
        ${rows.map(r => paymentRow(r)).join('')}
      </tbody></table>` : `<div class="empty">${q || PAYMENTS_STATUS_FILTER ? 'Aucun résultat pour ce filtre.' : 'Aucun paiement dû ce mois-ci.'}</div>`}
    </div></div>
  `;
}

function paymentRow(r){
  return `<tr style="${r.paid?'background:var(--vert-bg)':''}">
    <td style="font-weight:600">${esc(r.name)}${r.person_type==='player'?' <span class="pill" style="background:var(--bleu-bg);color:var(--bleu);margin-left:6px">Joueur</span>':''}</td>
    <td style="font-size:12.5px;color:var(--gris)">${esc(r.detail)}</td>
    <td><strong>${chf(r.montant)} CHF</strong></td>
    <td><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="checkbox" ${r.paid?'checked':''} onchange="togglePaymentPaid('${r.person_type}',${r.person_id},this.checked)">Payé</label></td>
    <td><input value="${esc(r.note||'')}" placeholder="Note (facultatif)…" style="width:100%;min-width:160px;padding:6px 8px;border:1.5px solid var(--ligne);border-radius:7px;font-size:12.5px" onchange="updatePaymentNote('${r.person_type}',${r.person_id},this.value)"></td>
    <td>${paymentSlipCell(r)}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="copyPersonLink('${r.person_type}',${r.person_id})">Copier le lien</button></td>
  </tr>`;
}

async function copyPersonLink(personType, personId){
  try {
    const res = await api('person_link', { params: { person_type: personType, person_id: personId } });
    await navigator.clipboard.writeText(res.url);
    alert('Lien copié : ' + res.url + '\n\nÀ transmettre une seule fois à la personne (il reste valable pour tous les mois à venir).');
  } catch (e) { alert('Échec : ' + e.message); }
}

function paymentSlipCell(r){
  const fileUrl = `api.php?action=payments_file&person_type=${r.person_type}&person_id=${r.person_id}&period=${PAYMENTS_DATA.month}`;
  const viewLink = r.payslip_filename
    ? `<a href="${fileUrl}" target="_blank" style="font-size:12px;color:var(--bleu);display:block;margin-bottom:4px;word-break:break-all">${esc(r.payslip_filename)}</a>`
    : `<div style="font-size:12px;color:var(--gris-2);margin-bottom:4px">Aucun fichier</div>`;
  const sentInfo = r.sent_at ? `<div style="font-size:11px;color:var(--gris)">Envoyé le ${esc(r.sent_at.slice(0,10))}</div>` : '';
  return `
    <div style="min-width:180px">
      ${viewLink}
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer">
          ${r.payslip_filename ? 'Remplacer' : '+ Fichier'}
          <input type="file" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="uploadPayslip('${r.person_type}',${r.person_id},this)">
        </label>
        ${r.payslip_filename ? `<button class="btn btn-primary btn-sm" onclick="sendPayslipEmail('${r.person_type}',${r.person_id})">Envoyer</button>` : ''}
      </div>
      ${sentInfo}
    </div>
  `;
}

function findPaymentRow(personType, personId){ return PAYMENTS_DATA.rows.find(r => r.person_type === personType && r.person_id === personId); }

async function uploadPayslip(personType, personId, input){
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('person_type', personType);
  fd.append('person_id', personId);
  fd.append('period', PAYMENTS_DATA.month);
  try {
    await api('payments_upload', { method: 'POST', form: fd });
    await renderPayments(document.getElementById('content'));
  } catch (e) { alert('Échec du dépôt : ' + e.message); }
}

async function sendPayslipEmail(personType, personId){
  const r = findPaymentRow(personType, personId);
  if (!confirm(`Envoyer la fiche de paie à ${r ? r.name : 'cette personne'} par e-mail ?`)) return;
  try {
    const res = await api('payments_send_email', { method: 'POST', body: { person_type: personType, person_id: personId, period: PAYMENTS_DATA.month } });
    alert('Fiche de paie envoyée à ' + res.sent_to + '.');
    await renderPayments(document.getElementById('content'));
  } catch (e) { alert('Échec de l\'envoi : ' + e.message); }
}

async function togglePaymentPaid(personType, personId, paid){
  const r = findPaymentRow(personType, personId);
  try {
    await api('payments', { method: 'POST', body: { person_type: personType, person_id: personId, period: PAYMENTS_DATA.month, paid, note: r ? r.note : '' } });
    await renderPayments(document.getElementById('content'));
  } catch (e) { alert(e.message); }
}
async function updatePaymentNote(personType, personId, note){
  const r = findPaymentRow(personType, personId);
  try {
    await api('payments', { method: 'POST', body: { person_type: personType, person_id: personId, period: PAYMENTS_DATA.month, paid: r ? r.paid : false, note } });
    if (r) r.note = note;
  } catch (e) { alert(e.message); }
}

/* ============================================================ DÉCOMPTE DE PAIE (page autonome, nouvel onglet) */

let PS = { employee: null, season: null, seasonId: null, isSemestriel: false, baseRows: [], rules: [], indemnites: [], retenues: [], month: new Date().toISOString().slice(0,7) };

async function renderPayslipPage(employeeId, seasonId){
  const app = document.getElementById('app');
  app.innerHTML = `<div style="padding:80px;text-align:center;color:#6E6C61">Chargement…</div>`;
  /* Cette page EST la fiche de paie : sans le droit sur les salaires, il n'y a
     rien à dégrader, on le dit franchement au lieu de rester sur « Chargement ». */
  let employees, seasons, rules;
  try {
    [employees, seasons, rules] = await Promise.all([
      api('employees', { params: { season_id: seasonId } }),
      api('seasons'),
      api('payroll_rules'),
    ]);
  } catch (e) {
    app.innerHTML = `<div style="padding:80px;text-align:center;max-width:520px;margin:0 auto;line-height:1.6">`
      + `<h2 style="margin-bottom:10px">${e.status === 403 ? 'Accès refusé' : 'Erreur'}</h2>`
      + `<p>${e.status === 403 ? "Vous n'avez pas le droit de consulter les décomptes de paie." : esc(e.message)}</p>`
      + `<p style="margin-top:16px"><a href="index.php">Retour au module RH</a></p></div>`;
    return;
  }
  const ee = employees.find(e => e.id === employeeId);
  if (!ee) { app.innerHTML = `<div style="padding:80px;text-align:center">Employé introuvable.</div>`; return; }
  const enabledRuleIds = await api('employee_payroll_rules', { params: { employee_id: employeeId } });
  PS.employee = ee;
  PS.season = seasons.find(s => s.id === seasonId) || null;
  PS.seasonId = seasonId;
  PS.isSemestriel = ee.paiement === 'semestriel';
  PS.baseRows = ee.assignments.filter(a => Number(a.season_id) === seasonId);
  PS.rules = rules.filter(r => enabledRuleIds.includes(r.id) && r.active == 1);
  PS.indemnites = [];
  PS.retenues = [];
  document.title = `Décompte — ${ee.first_name} ${ee.last_name}`;
  renderPayslipDoc();
}

function addPayslipLine(type){ PS[type].push({ label: '', montant: 0 }); renderPayslipDoc(); }

function removePayslipLine(type, i){ PS[type].splice(i, 1); renderPayslipDoc(); }
function updatePayslipLine(type, i, field, el){
  PS[type][i][field] = field === 'montant' ? (Number(el.value) || 0) : el.value;
  renderPayslipDoc();
}

function renderPayslipDoc(){
  const app = document.getElementById('app');
  const ee = PS.employee;
  const periodWord = PS.isSemestriel ? 'semestrielle' : 'mensuelle';
  const periodDiv = PS.isSemestriel ? 2 : 12;
  const grossBase = PS.baseRows.reduce((s, a) => s + Number(a.montant), 0) / periodDiv;
  const extraTotal = PS.indemnites.reduce((s, l) => s + (Number(l.montant) || 0), 0);
  const grossTotal = grossBase + extraTotal;
  const ruleDeductions = PS.rules.map(r => ({
    label: r.label,
    montant: r.type === 'percent' ? grossTotal * (Number(r.valeur) || 0) / 100 : (Number(r.valeur) || 0),
  }));
  const ruleTotal = ruleDeductions.reduce((s, d) => s + d.montant, 0);
  const manualRetenuesTotal = PS.retenues.reduce((s, l) => s + (Number(l.montant) || 0), 0);
  const totalDeductions = ruleTotal + manualRetenuesTotal;
  const net = grossTotal - totalDeductions;

  const editableLine = (type, i) => {
    const l = PS[type][i];
    return `<div style="display:flex;gap:8px;align-items:center;padding:5px 0">
      <input class="ps-input" value="${esc(l.label)}" placeholder="Libellé" style="flex:1;padding:6px 8px;border:1.5px solid var(--ligne);border-radius:7px;font-size:13px" onchange="updatePayslipLine('${type}',${i},'label',this)">
      <input class="ps-input" type="number" step="0.05" value="${l.montant||''}" placeholder="Montant CHF" style="width:120px;padding:6px 8px;border:1.5px solid var(--ligne);border-radius:7px;font-size:13px" onchange="updatePayslipLine('${type}',${i},'montant',this)">
      <span class="no-print"><button onclick="removePayslipLine('${type}',${i})" style="color:var(--rouge)" title="Retirer">✕</button></span>
    </div>`;
  };

  app.innerHTML = `
    <style>
      @media print { .no-print{display:none !important} .ps-input{border-color:transparent !important;padding:6px 0 !important} body{background:#fff} }
    </style>
    <div style="max-width:820px;margin:0 auto;padding:26px 20px 60px">
      <div class="no-print" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;padding:14px 18px;background:#fff;border:1px solid var(--ligne);border-radius:12px;box-shadow:var(--ombre-s)">
        <button class="btn btn-ghost btn-sm" onclick="window.close()">← Fermer l'onglet</button>
        <div class="month-picker"><input type="month" value="${esc(PS.month)}" onchange="PS.month=this.value; renderPayslipDoc()"></div>
        <button class="btn btn-ghost btn-sm" onclick="addPayslipLine('indemnites')">+ Indemnité</button>
        <button class="btn btn-ghost btn-sm" onclick="addPayslipLine('retenues')">+ Retenue</button>
        <button class="btn btn-primary" style="margin-left:auto" onclick="window.print()">Générer le PDF</button>
      </div>
      <div style="background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:36px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;border-bottom:2px solid var(--noir);padding-bottom:16px">
          <div><div class="sora" style="font-size:19px;font-weight:800">Meyrin FC</div><div style="font-size:12.5px;color:var(--gris)">Décompte de paie ${periodWord}</div></div>
          <div style="text-align:right;font-size:12.5px;color:var(--gris)">${esc(PS.month)}${PS.season?' · Saison '+esc(PS.season.label):''}</div>
        </div>
        <div style="margin-bottom:22px">
          <div style="font-weight:700;font-size:15px">${esc(ee.first_name)} ${esc(ee.last_name)}</div>
          <div style="font-size:12.5px;color:var(--gris)">${esc(ee.phone)||''}${ee.phone&&ee.email?' · ':''}${esc(ee.email)||''}</div>
        </div>

        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2);margin-bottom:6px">Indemnités (${periodWord === 'semestrielle' ? 'par semestre' : 'par mois'})</div>
        ${PS.baseRows.length ? PS.baseRows.map(a => `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ligne-2);font-size:13px">
          <span>${esc(a.poste_label)}${a.team_name?' — '+esc(a.team_name):(a.category_name?' — '+esc(a.category_name):'')}</span>
          <span>${chf(Number(a.montant)/periodDiv)} CHF</span>
        </div>`).join('') : `<div style="padding:5px 0;font-size:13px;color:var(--gris-2)">Aucune affectation pour cette saison.</div>`}
        ${PS.indemnites.map((l,i) => editableLine('indemnites', i)).join('')}
        <div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:700;font-size:13.5px;border-top:1px solid var(--ligne-2);margin-top:4px">
          <span>Total brut</span><span>${chf(grossTotal)} CHF</span>
        </div>

        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2);margin:22px 0 6px">Retenues</div>
        ${ruleDeductions.length ? ruleDeductions.map(d => `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ligne-2);font-size:13px">
          <span>${esc(d.label)}</span><span>− ${chf(d.montant)} CHF</span>
        </div>`).join('') : ''}
        ${PS.retenues.map((l,i) => editableLine('retenues', i)).join('')}
        ${!ruleDeductions.length && !PS.retenues.length ? `<div style="padding:5px 0;font-size:13px;color:var(--gris-2)">Aucune retenue.</div>` : ''}
        <div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:700;font-size:13.5px;border-top:1px solid var(--ligne-2);margin-top:4px">
          <span>Total retenues</span><span>− ${chf(totalDeductions)} CHF</span>
        </div>

        <div style="display:flex;justify-content:space-between;padding:14px 0 0;margin-top:14px;border-top:2px solid var(--noir);font-weight:800;font-size:17px">
          <span>Net à payer</span><span>${chf(net)} CHF</span>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================ INIT */

(async function init(){
  try { const me = await api('me'); STATE.user = me.user; }
  catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty" style="padding:80px">Session expirée. <a href="https://erp.meyrinfc.ch" style="color:var(--bleu)">Retour à l'ERP</a></div>`;
    return;
  }
  const payslipMatch = (location.hash || '').match(/^#payslip-(\d+)-(\d+)/);
  if (payslipMatch) {
    await renderPayslipPage(Number(payslipMatch[1]), Number(payslipMatch[2]));
    return;
  }
  STATE.seasons = await api('seasons');
  const saved = Number(localStorage.getItem('rh_season_id')) || null;
  const current = STATE.seasons.find(s => s.is_current);
  STATE.seasonId = (saved && STATE.seasons.some(s => s.id === saved)) ? saved : (current ? current.id : (STATE.seasons[0]?.id || null));
  const initial = (location.hash || '').replace('#', '');
  if (NAV.some(n => n.id === initial)) STATE.page = initial;
  /* La page par défaut est « dashboard ». Si les droits de la personne ne la
     lui donnent pas, on ouvre le premier écran auquel elle a accès plutôt que
     d'afficher un écran vide alimenté par des appels refusés. */
  if (!NAV.some(n => n.id === STATE.page)) {
    if (!NAV.length) {
      document.getElementById('app').innerHTML =
        '<div style="font-family:system-ui;max-width:520px;margin:80px auto;padding:28px;'
      + 'background:#fff;border-radius:14px;line-height:1.6">'
      + '<h2 style="margin:0 0 10px">Aucun écran disponible</h2>'
      + "<p>Votre rôle donne accès au module RH mais à aucun de ses écrans. "
      + "Demandez à un administrateur d'ajuster vos permissions.</p>"
      + '<p><a href="https://erp.meyrinfc.ch">Retour à l\'ERP</a></p></div>';
      return;
    }
    STATE.page = NAV[0].id;
  }
  render();
})();
</script>
</body>
</html>
