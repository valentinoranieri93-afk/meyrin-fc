/* ============================================================ DÉCOMPTE DE PAIE JOUEUR (page autonome, nouvel onglet)
 *
 * Même principe que le décompte employé : seule source de vérité du calcul, le serveur
 * (payslip_compute / player_payslip_pdf), pas ce fichier. Une particularité propre aux
 * joueurs (et non aux employés), gérée par le moteur : la retenue lavage automatique.
 * L'abattement AVS minime importance (paramétré et daté, Paramètres > Paie) est disponible
 * aussi côté employés depuis le 2026-08-18 (employees.avs_minime_abatement, case à cocher
 * dans l'onglet Assurances de la fiche employé — utile notamment pour les entraîneurs).
 */
let PSP = { player: null, playerId: null, retenues: [], overrides: {}, month: new Date().toISOString().slice(0,7), computed: null };

async function renderPlayerPayslipPage(playerId, month){
  const app = document.getElementById('app');
  app.innerHTML = `<div style="padding:80px;text-align:center;color:#6E6C61">Chargement…</div>`;
  let ctx;
  try {
    ctx = await api('player_payslip_context', { params: { player_id: playerId, month } });
  } catch (e) {
    app.innerHTML = `<div style="padding:80px;text-align:center;max-width:520px;margin:0 auto;line-height:1.6">`
      + `<h2 style="margin-bottom:10px">${e.status === 403 ? 'Accès refusé' : 'Erreur'}</h2>`
      + `<p>${e.status === 403 ? "Vous n'avez pas le droit de consulter les décomptes de paie." : esc(e.message)}</p>`
      + `<p style="margin-top:16px"><a href="index.php">Retour au module RH</a></p></div>`;
    return;
  }
  PSP.playerId = playerId; PSP.month = month;
  PSP.player = ctx.player;
  PSP.retenues = [];
  PSP.overrides = {};
  await renderPlayerPayslipDoc();
}

async function changePlayerPayslipMonth(value){
  PSP.month = value;
  await renderPlayerPayslipDoc();
}

function addPlayerPayslipLine(){ PSP.retenues.push({ label: '', montant: 0, sign: 'retenue' }); renderPlayerPayslipDoc(); }
function removePlayerPayslipLine(i){ PSP.retenues.splice(i, 1); renderPlayerPayslipDoc(); }
function updatePlayerPayslipLine(i, field, el){
  PSP.retenues[i][field] = field === 'montant' ? (Number(el.value) || 0) : el.value;
  renderPlayerPayslipDoc();
}
/* Corriger une charge calculée par le serveur la fige, comme sur le décompte employé (même
   remarque : ce n'est plus une suppression silencieuse, voir overrideAutoLine plus haut). */
function overridePlayerAutoLine(key, value){
  const v = String(value).trim();
  if (v === '') delete PSP.overrides[key]; else PSP.overrides[key] = Number(v) || 0;
  renderPlayerPayslipDoc();
}

async function fetchPlayerPayslipComputed(){
  try {
    PSP.computed = await api('payslip_compute', { method: 'POST', body: {
      person_type: 'player', person_id: PSP.playerId, month: PSP.month,
      retenues: signedRetenues(PSP.retenues), overrides: PSP.overrides,
    }});
    PSP.computeError = null;
  } catch (e) { PSP.computed = null; PSP.computeError = e.message; }
}

async function generatePlayerPayslipPdf(btn){
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Génération…'; }
  try {
    const blob = await api('player_payslip_pdf', { method: 'POST', body: {
      player_id: PSP.playerId, month: PSP.month, retenues: signedRetenues(PSP.retenues), overrides: PSP.overrides,
    }});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${PSP.month}_Décompte_${PSP.player.last_name}_${PSP.player.first_name}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    await renderPlayerPayslipDoc();
  } catch (e) {
    alert('Échec de la génération du PDF : ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText; }
  }
}

async function renderPlayerPayslipDoc(){
  const app = document.getElementById('app');
  const p = PSP.player;
  await fetchPlayerPayslipComputed();
  const c = PSP.computed;
  if (!c) {
    app.innerHTML = `<div style="padding:80px;text-align:center;max-width:520px;margin:0 auto;line-height:1.6">
      <h2 style="margin-bottom:10px;color:var(--rouge)">Erreur de calcul</h2>
      <p>${esc(PSP.computeError || 'Erreur inconnue')}</p>
      <p style="margin-top:16px"><a href="index.php">Retour au module RH</a></p></div>`;
    return;
  }

  const [y, m] = String(PSP.month || '').split('-');
  const moisLabel = PAYSLIP_MONTH_LABELS[(Number(m) || 1) - 1] || '';
  document.title = `${y}-${m}_Décompte_${p.last_name}_${p.first_name}`;

  function payslipCardHTML(editable){
    const row = (label, base, taux, montant, opts = {}) => `<tr${opts.topBorder?' style="border-top:1.5px solid var(--noir)"':''}>
      <td style="padding:${opts.pad||'7px'} 10px 7px 0;${opts.bold?'font-weight:700':''};overflow-wrap:anywhere">${label}</td>
      <td style="padding:${opts.pad||'7px'} 10px 7px 0;text-align:right;color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap">${base ?? ''}</td>
      <td style="padding:${opts.pad||'7px'} 10px 7px 0;text-align:right;color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap">${taux ?? ''}</td>
      <td style="padding:${opts.pad||'7px'} 0 7px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;${opts.bold?'font-weight:700':''}">${montant}</td>
    </tr>`;

    const chargeRow = (l) => {
      const hasRate = l.rate > 0 && !(l.key in PSP.overrides);
      const base = hasRate ? chf(l.base) : '';
      const taux = hasRate ? pctSmart(l.rate) + ' %' : '';
      if (!editable) return row(esc(l.label), base, taux, '− ' + chf(l.amount));
      return `<tr>
        <td style="padding:7px 10px 7px 0">${esc(l.label)}</td>
        <td style="padding:7px 10px 7px 0;text-align:right;color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap">${base}</td>
        <td style="padding:7px 10px 7px 0;text-align:right;color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap">${taux}</td>
        <td style="padding:5px 0;text-align:right;white-space:nowrap">
          <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
            <span style="color:var(--gris)">−</span>
            <input class="ps-input" type="number" step="0.05" value="${l.amount.toFixed(2)}" style="width:80px;padding:6px 8px;border:1.5px solid var(--ligne);border-radius:8px;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums" onchange="overridePlayerAutoLine('${l.key}', this.value)">
          </div>
        </td>
      </tr>`;
    };
    const retenueRow = (i) => {
      const l = PSP.retenues[i];
      if (!editable) return row(esc(l.label) || '—', '', '', chf(Number(l.montant) || 0));
      return `<tr>
        <td style="padding:5px 10px 5px 0" colspan="3">
          <input class="ps-input" value="${esc(l.label)}" placeholder="Libellé" style="width:100%;padding:6px 8px;border:1.5px solid var(--ligne);border-radius:8px;font-size:12.5px" onchange="updatePlayerPayslipLine(${i},'label',this)">
          <select class="ps-input" style="width:100%;margin-top:4px;padding:5px 8px;border:1.5px solid var(--ligne);border-radius:8px;font-size:11.5px;color:var(--gris)"
                  onchange="updatePlayerPayslipLine(${i},'sign',this)">
            <option value="retenue" ${l.sign!=='complement'?'selected':''}>Retenue (− réduit le net)</option>
            <option value="complement" ${l.sign==='complement'?'selected':''}>Complément (+ augmente le net)</option>
          </select>
        </td>
        <td style="padding:5px 0;text-align:right;vertical-align:top">
          <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
            <input class="ps-input" type="number" step="0.05" min="0" value="${l.montant||''}" placeholder="0.00" style="width:90px;padding:6px 8px;border:1.5px solid var(--ligne);border-radius:8px;font-size:12.5px;text-align:right" onchange="updatePlayerPayslipLine(${i},'montant',this)">
            <button onclick="removePlayerPayslipLine(${i})" style="color:var(--rouge)" title="Retirer">✕</button>
          </div>
        </td>
      </tr>`;
    };

    const chargesHeaderLabel = 'Charges sociales' + (c.avs_reduction_applied
      ? ` <span style="font-weight:400;color:var(--gris);text-transform:none;font-size:11.5px">— ${esc(c.avs_reduction_applied)}</span>`
      : '');

    return `
      <div style="background:#fff;${editable?'border:1px solid var(--ligne);border-radius:16px;box-shadow:var(--ombre);':''}overflow:hidden;font-size:12.5px;line-height:1.5">
        <div style="background:var(--noir);color:#fff;padding:22px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px">
          <div>
            <div class="sora" style="font-size:16px;font-weight:800;color:var(--jaune);letter-spacing:.3px">MEYRIN FC</div>
            <div style="font-size:12px;color:#C9C7BD;margin-top:2px">Décompte de salaire — Joueur</div>
          </div>
          <div style="text-align:right">
            <div class="sora" style="font-size:15px;font-weight:700;text-transform:capitalize">${esc(moisLabel)} ${esc(y||'')}</div>
            <div style="font-size:11px;color:#C9C7BD;margin-top:2px">Période mensuelle</div>
          </div>
        </div>

        <div style="padding:28px 30px 6px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
          <div>
            <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2);margin-bottom:3px">N° joueur</div>
            <div style="font-weight:600">${p.id}</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:700;font-size:13.5px">${esc(p.first_name)} ${esc(p.last_name)}</div>
            ${p.adresse ? `<div style="color:var(--gris);margin-top:2px">${esc(p.adresse)}</div>` : ''}
            ${(p.npa || p.ville) ? `<div style="color:var(--gris)">${esc(p.npa)} ${esc(p.ville)}</div>` : ''}
          </div>
        </div>

        <div style="padding:18px 30px 0">
          <table style="width:100%;border-collapse:collapse;table-layout:fixed">
            <thead><tr style="border-bottom:1.5px solid var(--noir)">
              <th style="text-align:left;padding-bottom:7px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2)">Rubrique et genres de salaires</th>
              <th style="text-align:right;padding-bottom:7px;width:85px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2)">Base</th>
              <th style="text-align:right;padding-bottom:7px;width:95px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2)">Taux</th>
              <th style="text-align:right;padding-bottom:7px;width:100px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2)">Montant</th>
            </tr></thead>
            <tbody>
              ${row('Salaire brut', '', '', '', { bold: true, pad: '16px' })}
              ${c.revenue_lines.map(l => row(esc(l.label) || '—', '', '', chf(l.montant))).join('')}
              ${row('', '', '', chf(c.gross_total), { bold: true, topBorder: true })}

              ${row(chargesHeaderLabel, '', '', '', { bold: true, pad: '22px' })}
              ${c.charge_lines.length ? c.charge_lines.map(chargeRow).join('') : `<tr><td colspan="4" style="padding:8px 0;color:var(--gris)">Aucun assujettissement coché sur la fiche joueur.</td></tr>`}
              ${row('', '', '', '− ' + chf(c.charges_total), { bold: true, topBorder: true })}

              ${(c.divers_lines.length || PSP.retenues.length) ? `
                ${row('Divers', '', '', '', { bold: true, pad: '22px' })}
                ${editable
                  ? `${c.divers_lines.slice(0, Math.max(0, c.divers_lines.length - PSP.retenues.length)).map(l => row(esc(l.label) || '—', '', '', diversAmountDisplay(l.montant))).join('')}
                     ${PSP.retenues.map((l,i) => retenueRow(i)).join('')}`
                  : c.divers_lines.map(l => row(esc(l.label) || '—', '', '', diversAmountDisplay(l.montant))).join('')}
                ${row('', '', '', diversAmountDisplay(c.divers_total), { bold: true, topBorder: true })}
              ` : ''}
            </tbody>
          </table>
        </div>

        <div style="display:flex;margin:26px 30px 30px;border-radius:10px;overflow:hidden;border:1px solid var(--ligne)">
          <div style="flex:1;padding:14px 18px;background:var(--bg)">
            <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2);margin-bottom:3px">Paiement</div>
            <div style="font-weight:600;font-variant-numeric:tabular-nums">${p.iban ? esc(p.iban) : '—'}</div>
          </div>
          <div style="padding:14px 22px;background:var(--noir);color:#fff;display:flex;align-items:center;gap:16px;justify-content:flex-end;min-width:210px">
            <span style="font-size:12px;color:#C9C7BD">Salaire net</span>
            <span class="sora" style="font-size:19px;font-weight:800;color:var(--jaune);font-variant-numeric:tabular-nums">${chf(c.net)}</span>
          </div>
        </div>
      </div>`;
  }

  const warningsBanner = c.warnings.length ? `
    <div class="no-print" style="margin-bottom:16px;padding:12px 16px;border-radius:10px;border:1px solid ${c.blocking.length?'var(--rouge)':'#E9C77A'};background:${c.blocking.length?'#FDECEA':'#FFF8E6'};font-size:12.5px;line-height:1.5">
      ${c.warnings.map(w => `<div>${c.blocking.includes(w) ? '🔴' : '⚠️'} ${esc(w)}</div>`).join('')}
    </div>` : '';

  app.innerHTML = `
    <style>
      @page { size: A4; margin: 16mm 14mm; }
      #psp-print{ display:none; }
      @media print {
        .no-print{ display:none !important; }
        #psp-edit{ display:none !important; }
        #psp-print{ display:block !important; }
        body{ background:#fff; }
      }
      #psp-edit, #psp-edit *, #psp-print, #psp-print *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    </style>
    <div style="max-width:760px;margin:0 auto;padding:26px 20px 60px">
      <div class="no-print" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;padding:14px 18px;background:#fff;border:1px solid var(--ligne);border-radius:12px;box-shadow:var(--ombre-s)">
        <button class="btn btn-ghost btn-sm" onclick="window.close()">← Fermer l'onglet</button>
        <div class="month-picker"><input type="month" value="${esc(PSP.month)}" onchange="changePlayerPayslipMonth(this.value)"></div>
        <button class="btn btn-ghost btn-sm" onclick="addPlayerPayslipLine()">+ Retenue</button>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="window.print()" title="Aperçu à l'écran via l'impression du navigateur, dépannage seulement">Aperçu</button>
        <button class="btn btn-primary" ${c.blocking.length?'disabled title="Corriger les contrôles bloquants ci-dessus avant de générer"':''} onclick="generatePlayerPayslipPdf(this)">Générer le PDF</button>
      </div>
      <p class="no-print hint" style="margin:-10px 0 16px">Cet encadré sert à ajuster le décompte. "Générer le PDF" calcule, verrouille et enregistre le décompte pour cette période — c'est lui qui part au joueur.</p>
      ${warningsBanner}

      <div id="psp-edit">${payslipCardHTML(true)}</div>
      <div id="psp-print">${payslipCardHTML(false)}</div>
    </div>
  `;
}

/* ============================================================ INIT */

(async function init(){
  try { const me = await api('me'); STATE.user = me.user; }
  catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty" style="padding:80px">Session expirée. <a href="https://erp.meyrinfc.ch" style="color:var(--bleu)">Retour à l'ERP</a></div>`;
    return;
  }
  const payslipMatch = (location.hash || '').match(/^#payslip-(\d+)-(\d+)/);
  if (payslipMatch) {
    await renderPayslipPage(Number(payslipMatch[1]), Number(payslipMatch[2]));
    return;
  }
  const playerPayslipMatch = (location.hash || '').match(/^#player-payslip-(\d+)-(\d{4}-\d{2})/);
  if (playerPayslipMatch) {
    await renderPlayerPayslipPage(Number(playerPayslipMatch[1]), playerPayslipMatch[2]);
    return;
  }
  STATE.seasons = await api('seasons');
  const saved = Number(localStorage.getItem('rh_season_id')) || null;
  const current = STATE.seasons.find(s => s.is_current);
  STATE.seasonId = (saved && STATE.seasons.some(s => s.id === saved)) ? saved : (current ? current.id : (STATE.seasons[0]?.id || null));
  const initial = (location.hash || '').replace('#', '');
  if (NAV.some(n => n.id === initial)) STATE.page = initial;
  /* La page par défaut est « dashboard ». Si les droits de la personne ne la
     lui donnent pas, on ouvre le premier écran auquel elle a accès plutôt que
     d'afficher un écran vide alimenté par des appels refusés. */
  if (!NAV.some(n => n.id === STATE.page)) {
    if (!NAV.length) {
      document.getElementById('app').innerHTML =
        '<div style="font-family:system-ui;max-width:520px;margin:80px auto;padding:28px;'
      + 'background:#fff;border-radius:14px;line-height:1.6">'
      + '<h2 style="margin:0 0 10px">Aucun écran disponible</h2>'
      + "<p>Votre rôle donne accès au module RH mais à aucun de ses écrans. "
      + "Demandez à un administrateur d'ajuster vos permissions.</p>"
      + '<p><a href="https://erp.meyrinfc.ch">Retour à l\'ERP</a></p></div>';
      return;
    }
    STATE.page = NAV[0].id;
  }
  render();
})();
</script>
</body>
</html>
