<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Meyrin FC · RH</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --jaune:#ffdd00;--jaune-fonce:#c5a900;--jaune-soft:#FFF3C4;
  --noir:#15140F;--noir-2:#211F18;--noir-3:#2C2A21;--encre:#1A1915;
  --gris:#6E6C61;--gris-2:#9A988C;--ligne:#E9E6DC;--ligne-2:#F0EDE4;--ligne-dark:#28261E;
  --bg:#F6F4ED;--carte:#FFFFFF;
  --vert:#1F9D5B;--vert-bg:#E4F4EA;
  --rouge:#D8463A;--rouge-bg:#FBE7E4;
  --orange:#E8902A;--orange-bg:#FCEEDB;
  --bleu:#3B6FE0;--bleu-bg:#E6EDFB;
  --violet:#7B59D8;--violet-bg:#EEE8FB;
  --ombre-s:0 1px 2px rgba(20,18,10,.05);
  --ombre:0 1px 2px rgba(20,18,10,.04),0 6px 20px rgba(20,18,10,.06);
  --ombre-l:0 10px 40px rgba(20,18,10,.14);
  --r:14px;--r-s:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Inter",-apple-system,sans-serif;background:var(--bg);color:var(--encre);font-size:14px;line-height:1.5}
h1,h2,h3,.sora{font-family:"Sora","Inter",sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
table{border-collapse:collapse;width:100%}

.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:var(--noir);color:#C9C7BD;display:flex;flex-direction:column;border-right:1px solid var(--ligne-dark);position:sticky;top:0;height:100vh}
.sb-head{padding:22px 20px 18px;border-bottom:1px solid var(--ligne-dark)}
.sb-back{display:flex;align-items:center;gap:6px;font-size:12px;color:#8C897C;margin-bottom:12px;font-weight:600;transition:color .15s}
.sb-back:hover{color:#fff}
/* ic() produit un <svg> sans width ni height : sans cette regle l'icone
   s'affiche a sa taille par defaut et ecrase le libelle. Meme dimension que
   dans les autres modules. */
.sb-back svg{width:14px;height:14px;flex-shrink:0}
.sb-name{font-family:"Sora";font-weight:800;font-size:15px;color:#fff}
.sb-sub{font-size:10.5px;color:#8C897C;margin-top:2px}
.season-picker{padding:14px 20px 4px}
.season-picker-label{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:#8C897C;font-weight:700;margin-bottom:6px}
.season-sel{width:100%;background:#211F18;border:1.5px solid #34322a;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:#E8E6DD;cursor:pointer}
.season-sel:focus{border-color:var(--jaune-fonce)}
.sb-nav{flex:1;padding:16px 12px;overflow-y:auto}
.sb-group{margin-bottom:14px}
.sb-group:last-child{margin-bottom:0}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:#C9C7BD;margin-bottom:2px;transition:background .15s,color .15s}
.sb-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75}
.sb-item:hover{background:#211F18;color:#fff}
.sb-item.active{background:var(--jaune);color:var(--noir)}
.sb-item.active svg{opacity:1}
.sb-foot{padding:14px 16px;border-top:1px solid var(--ligne-dark)}
.sb-user{font-size:12.5px;color:#C9C7BD;font-weight:600;margin-bottom:8px}
.sb-logout{display:block;text-align:center;padding:8px;background:rgba(255,255,255,.06);border-radius:8px;font-size:12px;color:#9A988C;font-weight:600}
.sb-logout:hover{background:rgba(255,255,255,.12);color:#fff}

.main{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--ligne);min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;position:sticky;top:0;z-index:10;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:800;color:var(--noir)}
.content{padding:26px 28px 60px;max-width:1220px}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:18px 20px;box-shadow:var(--ombre-s)}
.stat-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gris-2);margin-bottom:8px}
.stat-value{font-family:"Sora";font-size:24px;font-weight:800;color:var(--noir)}
.stat-sub{font-size:12px;color:var(--gris);margin-top:4px}

.budget-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--ligne-2)}
.budget-row:last-child{border-bottom:none}
.budget-row-label{font-size:12.5px;color:var(--gris);white-space:nowrap}
.budget-row-value{font-family:"Sora";font-size:15px;font-weight:800;color:var(--noir);white-space:nowrap;text-align:right}

.card{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);box-shadow:var(--ombre-s);margin-bottom:20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--ligne-2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:14.5px;font-weight:700;color:var(--noir)}
.card-body{padding:18px 20px}
.card-body.pad0{padding:0}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor}

.alert-list{list-style:none}
.alert-list li{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--ligne-2);font-size:13px;color:var(--noir-3)}
.alert-list li:last-child{border-bottom:none}
.alert-list li::before{content:'⚠';color:var(--orange)}

th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gris-2);background:#FAFAF7;border-bottom:1px solid var(--ligne)}
td{padding:10px 14px;border-bottom:1px solid var(--ligne-2);font-size:13.5px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF7}
.tbl-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--gris)}
.icon-btn:hover{background:var(--ligne-2);color:var(--noir)}
.icon-btn svg{width:14px;height:14px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;font-family:"Sora";transition:background .15s;white-space:nowrap}
.btn-primary{background:var(--jaune);color:var(--noir)}
.btn-primary:hover{background:var(--jaune-fonce)}
.btn-dark{background:var(--noir);color:#fff}
.btn-dark:hover{background:var(--noir-3)}
.btn-ghost{background:var(--bg);color:var(--noir-3);border:1px solid var(--ligne)}
.btn-ghost:hover{background:var(--ligne-2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn svg{width:14px;height:14px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--noir-3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--ligne);border-radius:10px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--jaune);box-shadow:0 0 0 4px rgba(255,221,0,.2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--noir-3)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ligne);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 16px;font-size:13px;font-weight:700;color:var(--gris);border-bottom:2px solid transparent}
.tab.active{color:var(--noir);border-bottom-color:var(--jaune)}
.tab:hover{color:var(--noir)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,18,10,.5);align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:460px;box-shadow:var(--ombre-l);max-height:88vh;overflow-y:auto}
.modal.wide{max-width:760px}
.modal h3{font-size:16px;font-weight:800;margin-bottom:18px;color:var(--noir)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.modal-error{background:var(--rouge-bg);color:var(--rouge);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;display:none}

.empty{text-align:center;padding:40px 20px;color:var(--gris-2);font-size:13.5px}
.month-picker{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--ligne);border-radius:10px;padding:5px 8px}
.month-picker input{border:none;background:none;padding:4px;width:130px}
.search-bar{display:flex;gap:8px;align-items:center;flex:1;min-width:220px}
.search-bar input{padding:9px 12px;border:1.5px solid var(--ligne);border-radius:10px;background:#fff;flex:1}
.search-bar select{padding:9px 12px;border:1.5px solid var(--ligne);border-radius:10px;background:#fff;min-width:160px}
.pill{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--noir);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--gris);margin-top:4px}
.dropzone{border:2px dashed var(--ligne);border-radius:12px;padding:24px;text-align:center;color:var(--gris);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover{border-color:var(--jaune-fonce);background:var(--jaune-soft)}
.review-match{border:1px solid var(--ligne);border-radius:12px;padding:14px;margin-bottom:12px}
.review-match-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.review-player-row{display:grid;grid-template-columns:1fr 140px 100px;gap:8px;align-items:center;padding:6px 0}
.score-low{color:var(--rouge)}

.matrix-wrap{overflow-x:auto}
.matrix-table th, .matrix-table td{white-space:nowrap}
.payments-table th, .payments-table td{white-space:nowrap}
.payments-table th:nth-child(4), .payments-table td:nth-child(4){white-space:normal;min-width:160px}
.matrix-table input.cell-amount{width:90px;padding:6px 8px;border:1.5px solid var(--ligne);border-radius:8px;text-align:right}
.matrix-total{font-weight:800;color:var(--noir)}
.matrix-col-head{display:flex;flex-direction:column;gap:2px}
.matrix-col-head .d{font-weight:700;font-size:12.5px}
.matrix-col-head .a{font-size:11px;color:var(--gris);font-weight:500;text-transform:none;letter-spacing:0}
.import-inline{border:1px solid var(--ligne);border-radius:10px;padding:14px;margin-top:10px;background:var(--bg)}

/* ============================================================ DASHBOARD */
/* Style porté tel quel du module Events (mêmes classes, mêmes valeurs), pour que le
   dashboard RH s'intègre visuellement avec le reste des apps du club. */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:16px 17px;box-shadow:var(--ombre-s);position:relative;overflow:hidden;transition:.15s}
.kpi:hover{box-shadow:var(--ombre);transform:translateY(-2px)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.kpi-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.kpi-ico svg{width:18px;height:18px}
.kpi-trend{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:20px;display:flex;align-items:center;gap:3px}
.kpi-trend svg{width:11px;height:11px}
.trend-up{background:var(--vert-bg);color:var(--vert)}
.trend-down{background:var(--rouge-bg);color:var(--rouge)}
.trend-flat{background:var(--ligne-2);color:var(--gris)}
.kpi-val{font-family:"Sora";font-size:24px;font-weight:800;line-height:1}
.kpi-lbl{font-size:12.5px;color:var(--gris);margin-top:5px;font-weight:500}

.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.mini{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--ombre-s)}
.mini-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-ico svg{width:18px;height:18px}
.mini-val{font-family:"Sora";font-size:19px;font-weight:700;letter-spacing:-.5px;line-height:1}
.mini-lbl{font-size:11.5px;color:var(--gris);margin-top:2px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);box-shadow:var(--ombre-s);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--ligne-2)}
.panel-title{font-family:"Sora";font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.panel-head h3{font-family:"Sora";font-size:14.5px;font-weight:700;letter-spacing:-.2px;color:var(--noir)}
.panel-act{font-size:12.5px;color:var(--gris);font-weight:600;display:flex;align-items:center;gap:5px;cursor:pointer}
.panel-act:hover{color:var(--noir)}
.panel-body{padding:18px}

.chart-legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:12px}
.lg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gris);font-weight:500}
.lg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.row-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ligne-2)}
.row-item:last-child{border-bottom:none}
.row-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:#fff}
.row-main{flex:1;min-width:0}
.row-t{font-size:13.5px;font-weight:600;line-height:1.25}
.row-s{font-size:12px;color:var(--gris);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{font-size:13px;color:var(--noir);font-weight:700;text-align:right;flex-shrink:0;font-family:"Sora"}

.alert-item{display:flex;gap:11px;padding:11px 13px;border-radius:10px;margin-bottom:8px;align-items:flex-start}
.alert-item:last-child{margin-bottom:0}
.alert-o{background:var(--orange-bg)}
.alert-b{background:var(--bleu-bg)}
.alert-ico{flex-shrink:0;margin-top:1px}
.alert-ico svg{width:17px;height:17px}
.alert-t{font-size:13px;font-weight:600;line-height:1.3}

.scroll-list{max-height:400px;overflow-y:auto}
@media (max-width:980px){.kpi-grid,.mini-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-3{grid-template-columns:1fr}}
@media (max-width:600px){.kpi-grid,.mini-grid{grid-template-columns:1fr}.content{padding:16px 14px 60px}}
</style>

<body>
<div id="app" class="app"></div>
<div class="modal-overlay" id="modal"></div>

<script>
const API = 'api.php';
let STATE = { user: null, page: 'dashboard', month: new Date().toISOString().slice(0,7),
  seasonId: null, seasons: [],
  teams: [], categories: [], postes: [], employees: [], players: [], bareme: [] };

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function chf(n){ return (Number(n)||0).toLocaleString('fr-CH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/** Comme chf(), mais sans décimales quand le montant est rond (finit par ,00). */
function chfSmart(n){
  const v = Math.round((Number(n)||0) * 100) / 100;
  const isWhole = Math.abs(v - Math.round(v)) < 0.001;
  return v.toLocaleString('fr-CH', { minimumFractionDigits: isWhole ? 0 : 2, maximumFractionDigits: 2 });
}

async function api(action, opts = {}) {
  const method = opts.method || 'GET';
  const params = opts.params ? '&' + new URLSearchParams(opts.params).toString() : '';
  const fetchOpts = { method, headers: {} };
  if (opts.form) { fetchOpts.body = opts.form; }
  else if (opts.body) { fetchOpts.headers['Content-Type'] = 'application/json'; fetchOpts.body = JSON.stringify(opts.body); }
  const res = await fetch(`${API}?action=${action}${params}`, fetchOpts);
  if (action === 'export_compta') return res.blob();
  // payslip_pdf renvoie un PDF binaire côté succès, mais une erreur JSON classique côté échec
  // (droit manquant, Dompdf en échec) : il faut lire la réponse différemment selon le cas,
  // contrairement à export_compta ci-dessus qui ne vérifie jamais res.ok.
  if (action === 'payslip_pdf' || action === 'player_payslip_pdf') {
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      const err = new Error(data.error || 'Erreur serveur');
      err.status = res.status;
      if (res.status === 401) location.href = 'https://erp.meyrinfc.ch/?redirect=' + encodeURIComponent(location.href);
      throw err;
    }
    return res.blob();
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'Erreur serveur');
    err.status = res.status;   // exploité par apiSoft() pour distinguer refus et panne
    if (res.status === 401) location.href = 'https://erp.meyrinfc.ch/?redirect=' + encodeURIComponent(location.href);
    throw err;
  }
  return data;
}

/* Appel cross-module vers Comptabilité (même domaine, même session ERP), pour peupler le
   plan comptable dans les écrans de paramétrage RH. Volontairement tolérant : si l'utilisateur
   n'a pas le droit compta (accounts.view), la liste revient vide plutôt que de casser l'écran RH,
   le rattachement compte/rôle restant réservé à un responsable qui, lui, a ce droit. */
async function apiCompta(action, params = null) {
  try {
    const qs = params ? '&' + new URLSearchParams(params).toString() : '';
    const res = await fetch(`../compta/api.php?action=${action}${qs}`);
    if (!res.ok) return [];
    return await res.json();
  } catch (e) { return []; }
}

const ICONS = {
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  teams: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>',
  employees: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/>',
  players: '<path d="M12 2l2.4 4.8 5.3.8-3.8 3.7.9 5.3-4.8-2.5-4.8 2.5.9-5.3-3.8-3.7 5.3-.8z"/>',
  primes: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',

if (!window.MFC) {

      + 'background:#fff;border-radius:14px;line-height:1.6">'

}

/* Appel dont un refus de droit n'est pas une erreur fatale : on renvoie une
   valeur de repli et la page se dessine sans ce bloc. Une vraie panne (500,
   réseau) continue de remonter, pour ne pas masquer un incident derrière un
   écran vide. */
async function apiSoft(action, fallback, allowed = true, params = null){
  if (!allowed) return fallback;
  try { return await api(action, params ? { params } : undefined); }
  catch (e) {
    if (e.status === 403) { console.warn('Bloc ignoré, droit manquant :', action); return fallback; }
    throw e;
  }
}

async function loadRefData(){
  /* Chaque appel est isolé : un refus de droit sur l'un ne doit pas vider les pages
     Équipes, Employés et Paramètres, comme c'était le cas quand le lot partait d'un bloc. */
  /* La saison est transmise : sous référentiel club, le nom et la catégorie
     d'une équipe dépendent de la saison consultée. */
  [STATE.teams, STATE.categories, STATE.postes, STATE.rateSettings, STATE.insuranceProfiles] = await Promise.all([
    apiSoft('teams', [], true, { season_id: STATE.seasonId }),
    apiSoft('team_categories', []),
    apiSoft('postes', []),
    apiSoft('payroll_rate_settings', [], !!MFC.payrollView),
    apiSoft('insurance_profiles', [], !!MFC.payrollView),
  ]);
}

function donutChart(el, data, opt = {}) {
  const size = opt.size || 170, cx = size / 2, cy = size / 2, r = size / 2 - 6, ir = opt.ir || r * 0.6;
  const tot = data.reduce((a, x) => a + x.v, 0); let a0 = -Math.PI / 2;
  let svg = `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex-shrink:0">`;
  data.forEach(x => {
    const a1 = a0 + (x.v / tot) * Math.PI * 2;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const xi0 = cx + ir * Math.cos(a0), yi0 = cy + ir * Math.sin(a0), xi1 = cx + ir * Math.cos(a1), yi1 = cy + ir * Math.sin(a1);
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    svg += `<path d="M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} L${xi1} ${yi1} A${ir} ${ir} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${x.c}"><title>${esc(x.l)}: ${Math.round(x.v / tot * 100)}%</title></path>`;
    a0 = a1;
  });
  if (opt.center) svg += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="16" font-weight="700" font-family="Sora" fill="#15140F">${opt.center}</text><text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="10" fill="#9A988C" font-weight="600">${opt.centerSub || ''}</text>`;
  svg += `</svg><div class="chart-legend" style="flex-direction:column;gap:8px;margin:0">`;
  data.forEach(x => { svg += `<div class="lg-item"><span class="lg-dot" style="background:${x.c}"></span>${esc(x.l)} <b style="color:var(--noir);margin-left:auto">${opt.fmtVal ? opt.fmtVal(x.v) : Math.round(x.v / tot * 100) + '%'}</b></div>`; });
  svg += `</div></div>`; el.innerHTML = svg;
}

/** Courbe d'évolution de la saison (montants dus par mois, réel pour les mois passés, budgété
 * pour les mois à venir). SVG en viewBox + largeur 100% : redimensionne avec le conteneur, pas
 * de recalcul JS nécessaire au redimensionnement de la fenêtre. */
function lineChart(el, data, opt = {}) {
  const w = el.clientWidth || 640, h = opt.h || 220, pad = { t: 18, r: 14, b: 30, l: 44 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = Math.max(...data.map(x => x.v), 1) * 1.15;
  const stepX = data.length > 1 ? iw / (data.length - 1) : 0;
  const px = i => pad.l + stepX * i;
  const py = v => pad.t + ih - (v / max) * ih;
  const fmtK = v => v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : Math.round(v);

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">`;
  for (let i = 0; i <= 4; i++) {
    const gy = pad.t + ih * i / 4;
    svg += `<line x1="${pad.l}" y1="${gy}" x2="${w - pad.r}" y2="${gy}" stroke="#F0EDE4" stroke-width="1"/>`;
    svg += `<text x="${pad.l - 8}" y="${gy + 3}" text-anchor="end" font-size="10" fill="#9A988C">${fmtK(max * (1 - i / 4))}</text>`;
  }
  const linePts = data.map((x, i) => `${px(i)},${py(x.v)}`).join(' ');
  svg += `<polygon points="${px(0)},${pad.t + ih} ${linePts} ${px(data.length - 1)},${pad.t + ih}" fill="var(--jaune)" opacity="0.15"/>`;
  svg += `<polyline points="${linePts}" fill="none" stroke="var(--jaune-2,#C9A200)" stroke-width="2.5"/>`;
  data.forEach((x, i) => {
    svg += `<circle cx="${px(i)}" cy="${py(x.v)}" r="3.5" fill="#fff" stroke="var(--jaune-2,#C9A200)" stroke-width="2"><title>${esc(x.l)} : ${chf(x.v)} CHF</title></circle>`;
    svg += `<text x="${px(i)}" y="${h - 8}" text-anchor="middle" font-size="10" fill="#9A988C" font-weight="600">${esc(x.l)}</text>`;
  });
  svg += `</svg>`;
  el.innerHTML = svg;
}

    </div>
  `;

  // Graphique dessiné après insertion dans le DOM (besoin de clientWidth). Comptes à 0 CHF
  // (poste configuré sans montant) écartés du donut, sinon la part de cercle correspondante
  // est indéfinie — ils restent comptés dans l'effectif juste à côté, où le montant importe peu.
  const compoNonZero = d.composition.filter(a => a.montant > 0);
  if (compoNonZero.length) {
    donutChart(document.getElementById('ch-comp'), compoNonZero.map((a, i) => ({ l: a.label, v: a.montant, c: DASH_ACCOUNT_COLORS[i % DASH_ACCOUNT_COLORS.length] })),
      { size: 170, center: chf(d.totaux.total_masse), centerSub: 'CHF total', fmtVal: v => chf(v) + ' CHF' });
  } else {
    document.getElementById('ch-comp').innerHTML = `<div class="empty">Aucun montant pour ce filtre.</div>`;
  }
  renderDashEffectif(document.getElementById('dash-effectif'), d.effectif);
  if (d.evolution_saison.length) {
    lineChart(document.getElementById('dash-evolution'), d.evolution_saison.map(x => ({ l: x.label, v: x.montant })));
  } else {
    document.getElementById('dash-evolution').innerHTML = `<div class="empty">Pas encore de données pour cette saison.</div>`;
  }
  renderDashAlerts();
}
async function exportCompta(){

  const a = document.createElement('a'); a.href = url; a.download = `rh-meyrinfc-${STATE.month}.csv`; a.click();

/* ============================================================ ÉQUIPES */

let EXPANDED_CATS = new Set();
let EXPANDED_TEAMS = new Set();
let TEAM_SLOTS_CACHE = {};
let TEAM_TOTALS = {};
let CATEGORY_SLOTS_CACHE = {};
let CATEGORY_TOTALS = {};
let PAYMENT_TOTALS = { mensuel: 0, semestriel: 0 };

async function renderTeams(c){
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary" onclick="teamModal()">+ Nouvelle équipe</button>`;
  c.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  await loadRefData();
  STATE.employees = await api('employees', { params: { season_id: STATE.seasonId } });
  TEAM_SLOTS_CACHE = {};
  CATEGORY_SLOTS_CACHE = {};
  const totalsRows = await api('team_totals', { params: { season_id: STATE.seasonId } });
  TEAM_TOTALS = {};
  totalsRows.forEach(r => { TEAM_TOTALS[r.team_id] = r.total; });
  const catTotalsRows = await api('category_totals', { params: { season_id: STATE.seasonId } });
  CATEGORY_TOTALS = {};
  catTotalsRows.forEach(r => { CATEGORY_TOTALS[r.category_id] = r.total; });
  PAYMENT_TOTALS = await api('payment_totals', { params: { season_id: STATE.seasonId } });

  if (!STATE.categories.length) {
    c.innerHTML = `<div class="empty">Crée d'abord une catégorie dans Paramètres avant de pouvoir ajouter des équipes.</div>`;
    return;
  }
  renderTeamsTree(c);
}

/** Total mensuel d'une équipe : priorité au cache local (à jour après une édition), sinon valeur chargée en bloc. */
function teamTotal(teamId){
  if (TEAM_SLOTS_CACHE[teamId]) {
    return TEAM_SLOTS_CACHE[teamId].reduce((s, sl) => s + Number(sl.montant) / 12, 0);
  }
  return TEAM_TOTALS[teamId] || 0;
}
/** Total mensuel des postes rattachés directement à une catégorie (ex: Directeur Technique), hors équipes. */
function categoryDirectTotal(categoryId){
  if (CATEGORY_SLOTS_CACHE[categoryId]) {
    return CATEGORY_SLOTS_CACHE[categoryId].reduce((s, sl) => s + Number(sl.montant) / 12, 0);
  }
  return CATEGORY_TOTALS[categoryId] || 0;
}
function categoryTotal(teams, categoryId){
  return teams.reduce((s, t) => s + teamTotal(t.id), 0) + categoryDirectTotal(categoryId);
}
/** Cotisations potentielles d'une équipe : prix de la cotisation × effectif max. */
function teamCotisationTotal(t){
  return (Number(t.cotisation_montant) || 0) * (Number(t.effectif_max) || 0);
}
function categoryCotisationTotal(teams){
  return teams.reduce((s, t) => s + teamCotisationTotal(t), 0);
}

function renderTeamsTree(c){
  const el = c || document.getElementById('content');
  const y = window.scrollY;
  const byCategory = {};
  STATE.teams.forEach(t => { (byCategory[t.category_id] = byCategory[t.category_id] || []).push(t); });
  const grandTotal = STATE.teams.reduce((s, t) => s + teamTotal(t.id), 0) + STATE.categories.reduce((s, c2) => s + categoryDirectTotal(c2.id), 0);
  const grandCotisations = STATE.teams.reduce((s, t) => s + teamCotisationTotal(t), 0);

  el.innerHTML = `
    <div style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gris-2);margin-bottom:8px">Indemnités annuelles Meyrin FC</div>
    <div class="stats-row" style="margin-bottom:18px">
      <div class="stat-card">
        <div class="stat-label">Budget</div>
        <div class="budget-row"><span class="budget-row-label">Mensuel</span><span class="budget-row-value">${chfSmart(grandTotal)} CHF</span></div>
        <div class="budget-row"><span class="budget-row-label">Annuel</span><span class="budget-row-value">${chfSmart(grandTotal*12)} CHF</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Paiements</div>
        <div class="budget-row"><span class="budget-row-label">Mensuels</span><span class="budget-row-value">${chfSmart(PAYMENT_TOTALS.mensuel/12)} CHF/mois</span></div>
        <div class="budget-row"><span class="budget-row-label">Semestriels</span><span class="budget-row-value">${chfSmart(PAYMENT_TOTALS.semestriel/2)} CHF/sem.</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cotisations potentielles</div>
        <div class="budget-row"><span class="budget-row-label">Maximum</span><span class="budget-row-value">${chfSmart(grandCotisations)} CHF</span></div>
      </div>
    </div>
    <datalist id="employee-options">
      ${STATE.employees.map(e=>`<option value="${esc(e.first_name + ' ' + e.last_name)}"></option>`).join('')}
    </datalist>
    <div class="card"><div class="card-body pad0">
      ${STATE.categories.map(cat => catNode(cat, byCategory[cat.id]||[])).join('')}
    </div></div>
  `;
  window.scrollTo(0, y);
}

function catNode(cat, teams){
  const open = EXPANDED_CATS.has(cat.id);
  return `<div style="border-bottom:1px solid var(--ligne-2)">
    <div onclick="toggleCat(${cat.id})" style="display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;font-weight:700;font-size:14px;background:#FAFAF7;color:var(--noir)">
      <span style="display:inline-block;width:12px;transition:transform .15s;transform:rotate(${open?90:0}deg)">▸</span>
      ${esc(cat.name)}
      <span class="pill" style="background:var(--jaune-soft);color:#7A6000">${chf(categoryTotal(teams, cat.id)*12)} CHF/an</span>
      <span style="margin-left:auto;font-weight:500;font-size:12px;color:var(--gris)">${teams.length} équipe${teams.length>1?'s':''}</span>
    </div>
    ${open ? `<div>
      ${teams.length ? teams.map(t => teamNode(t)).join('') : `<div class="empty" style="padding:14px 18px">Aucune équipe dans cette catégorie.</div>`}
      ${categorySlotsBlock(cat)}
    </div>` : ''}
  </div>`;
}

function teamNode(t){
  const open = EXPANDED_TEAMS.has(t.id);
  return `<div style="border-bottom:1px solid var(--ligne-2);background:#fff">
    <div style="display:flex;align-items:center;gap:8px;padding:11px 18px 11px 36px">
      <span onclick="toggleTeam(${t.id})" style="cursor:pointer;display:flex;align-items:center;gap:8px;flex:1;min-width:0">
        <span style="display:inline-block;width:11px;font-size:12px;transition:transform .15s;transform:rotate(${open?90:0}deg)">▸</span>
        <span style="font-size:13.5px;font-weight:600">${esc(t.name)}</span>
        <span class="pill" style="background:var(--bleu-bg);color:var(--bleu)">${chf(teamTotal(t.id))} CHF/mois</span>
        <span class="pill" style="background:var(--ligne-2);color:var(--noir-3)">${chf(teamTotal(t.id)*12)} CHF/an</span>
        ${teamCotisationTotal(t) > 0 ? `<span class="pill" style="background:var(--vert-bg);color:var(--vert)">${esc(t.effectif_max)} × ${chf(t.cotisation_montant)} = ${chf(teamCotisationTotal(t))} CHF</span>` : ''}
      </span>
      ${CLUB_MANAGED ? `
        ${t.coach_name ? `<span class="pill" style="background:var(--ligne-2);color:var(--noir-3)" title="Entraîneur (défini dans l'ERP)">${esc(t.coach_name)}</span>` : ''}
        <span style="font-size:11px;color:var(--gris-2)">${esc(t.category_name || '')}</span>
      ` : `
        <select onchange="quickChangeCategory(${t.id}, this.value)" style="font-size:11px;padding:4px 6px;border:1px solid var(--ligne);border-radius:6px">
          ${STATE.categories.map(c=>`<option value="${c.id}" ${c.id===t.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
      `}
      <button class="icon-btn" data-obj="${esc(JSON.stringify(t))}" onclick="teamModal(JSON.parse(this.dataset.obj))" title="${CLUB_MANAGED ? 'Cotisation et effectif' : 'Modifier'}">✎</button>
      ${CLUB_MANAGED ? '' : `<button class="icon-btn" onclick="deleteTeam(${t.id})" title="Supprimer">✕</button>`}
    </div>
    ${open ? `<div style="padding:4px 18px 16px 60px">${teamSlotsBlock(t)}</div>` : ''}
  </div>`;
}

function teamSlotsBlock(t){
  const slots = TEAM_SLOTS_CACHE[t.id] || [];
  return `
    ${slots.length ? slots.map(sl => slotRow(sl)).join('') : `<div class="empty" style="padding:10px 0">Aucun poste pour cette équipe.</div>`}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:10px">
      <select id="ns-poste-${t.id}" style="flex:1;min-width:140px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px">
        ${STATE.postes.map(p=>`<option value="${p.id}">${esc(p.label)}</option>`).join('')}
      </select>
      <input id="ns-montant-${t.id}" type="number" step="0.05" placeholder="Montant annuel CHF" style="width:130px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px">
      <button class="btn btn-primary btn-sm" onclick="addSlot(${t.id})">+ Ajouter un poste</button>
    </div>
  `;
}

async function toggleCat(id){
  if (EXPANDED_CATS.has(id)) { EXPANDED_CATS.delete(id); renderTeamsTree(); return; }
  EXPANDED_CATS.add(id);
  if (!CATEGORY_SLOTS_CACHE[id]) CATEGORY_SLOTS_CACHE[id] = await api('employee_assignments', { params: { category_id: id, season_id: STATE.seasonId } });
  renderTeamsTree();
}
async function toggleTeam(id){
  if (EXPANDED_TEAMS.has(id)) { EXPANDED_TEAMS.delete(id); renderTeamsTree(); return; }
  EXPANDED_TEAMS.add(id);
  if (!TEAM_SLOTS_CACHE[id]) TEAM_SLOTS_CACHE[id] = await api('employee_assignments', { params: { team_id: id, season_id: STATE.seasonId } });
  renderTeamsTree();
}
async function refreshTeamSlots(teamId){
  TEAM_SLOTS_CACHE[teamId] = await api('employee_assignments', { params: { team_id: teamId, season_id: STATE.seasonId } });
  renderTeamsTree();
}
async function quickChangeCategory(teamId, categoryId){
  const t = STATE.teams.find(x => x.id === teamId);
  await api('teams', { method: 'PUT', body: { id: teamId, name: t.name, category_id: Number(categoryId), active: t.active == 1 } });
  renderPage();
}

/* Le référentiel club (ERP) porte le nom, la catégorie et l'entraîneur des
   équipes. Quand il est actif, RH ne les modifie plus : il garde en revanche
   tout ce qui lui est propre (cotisation, effectif, postes, indemnités). */
const CLUB_MANAGED = !!(window.MFC && MFC.clubManaged);
const ERP_LINK     = (window.MFC && MFC.erpUrl) || '';

function clubNotice(text){
  return `<div style="background:var(--jaune-soft);border:1px solid #E8D9A8;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#6B5600;line-height:1.55;margin-bottom:12px">
    ${text} <a href="${esc(ERP_LINK)}/?tab=settings" target="_blank" style="color:#6B5600;font-weight:600">Ouvrir l'ERP</a>
  </div>`;
}

function teamModal(t){
  if (!STATE.categories.length) { alert("Crée d'abord une catégorie dans Paramètres."); return; }
  if (CLUB_MANAGED && !t) {
    alert("Les équipes se créent dans l'ERP (Paramètres > Catégories & Équipes), pour que RH et Arbitrage partagent la même liste.");
    return;
  }
  const cat = t ? STATE.categories.find(c => c.id == t.category_id) : null;
  openModal(`
    <h3>${t ? 'Modifier' : 'Nouvelle'} équipe</h3>
    <div class="modal-error"></div>
    ${CLUB_MANAGED ? clubNotice("Nom, catégorie et entraîneur sont définis dans l'ERP pour la saison affichée.") : ''}
    ${CLUB_MANAGED ? `
      <div class="field"><label>Nom</label><input value="${t?esc(t.name):''}" disabled></div>
      <div class="field"><label>Catégorie</label><input value="${cat?esc(cat.name):'—'}" disabled></div>
      <div class="field"><label>Entraîneur</label><input value="${t&&t.coach_name?esc(t.coach_name):'—'}" disabled></div>
    ` : `
      <div class="field"><label>Nom</label><input id="tm-name" value="${t?esc(t.name):''}" placeholder="Ex: Première équipe"></div>
      <div class="field"><label>Catégorie</label><select id="tm-category">
        ${STATE.categories.map(c=>`<option value="${c.id}" ${t?(t.category_id==c.id?'selected':''):''}>${esc(c.name)}</option>`).join('')}
      </select></div>
    `}
    <div class="field-row">
      <div class="field"><label>Prix cotisation (CHF)</label><input id="tm-cotisation" type="number" step="0.05" value="${t&&t.cotisation_montant?t.cotisation_montant:''}"></div>
      <div class="field"><label>Effectif max (joueurs)</label><input id="tm-effectif" type="number" step="1" value="${t&&t.effectif_max?t.effectif_max:''}"></div>
    </div>
    ${t && !CLUB_MANAGED ? `<div class="field check-row"><input type="checkbox" id="tm-active" ${t.active==1?'checked':''}><label style="margin:0" for="tm-active">Équipe active</label></div>` : ''}
    <div class="modal-actions">
      ${t && !CLUB_MANAGED ? `<button class="btn btn-ghost" onclick="deleteTeam(${t.id})" style="color:var(--rouge);margin-right:auto">Supprimer</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveTeam(${t?t.id:'null'})">Enregistrer</button>
    </div>
  `);
}
async function saveTeam(id){
  const cotisation_montant = Number(document.getElementById('tm-cotisation').value) || 0;
  const effectif_max = Number(document.getElementById('tm-effectif').value) || 0;
  /* Sous référentiel, seuls les champs propres à RH partent : envoyer name ou
     category_id ferait refuser l'appel côté serveur, à juste titre. */
  if (CLUB_MANAGED) {
    try { await api('teams', { method: 'PUT', body: { id, cotisation_montant, effectif_max } }); closeModal(); renderPage(); }
    catch (e) { modalErr(e.message); }
    return;
  }
  const name = document.getElementById('tm-name').value.trim();
  const category_id = Number(document.getElementById('tm-category').value);
  if (!name) return modalErr('Le nom est requis.');
  try {
    if (id) { const active = document.getElementById('tm-active').checked; await api('teams', { method: 'PUT', body: { id, name, category_id, active, cotisation_montant, effectif_max } }); }
    else { await api('teams', { method: 'POST', body: { name, category_id, cotisation_montant, effectif_max } }); }
    closeModal(); renderPage();
  } catch (e) { modalErr(e.message); }
}
async function deleteTeam(id){
  if (!confirm('Supprimer cette équipe ? Tous ses postes seront aussi supprimés.')) return;
  try { await api('teams', { method: 'DELETE', params: { id } }); closeModal(); renderPage(); }
  catch (e) { alert(e.message); }
}

/* ---- Postes d'une équipe : rôle, employé (recherche), montant, périodicité ---- */

function findSlot(teamId, slotId){ return (TEAM_SLOTS_CACHE[teamId]||[]).find(s => s.id === slotId); }

function slotRow(sl){
  const currentName = sl.employee_id ? `${sl.first_name} ${sl.last_name}` : '';
  return `<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ligne-2);flex-wrap:wrap">
    <span style="flex:1;min-width:110px;font-size:13px;font-weight:600">${esc(sl.poste_label)}</span>
    <input list="employee-options" value="${esc(currentName)}" placeholder="Employé (facultatif)…" style="width:170px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px" onchange="updateSlotEmployee(${sl.id},${sl.team_id},this.value)">
    <input type="number" step="0.05" value="${sl.montant}" title="Montant annuel CHF" style="width:105px;padding:7px 8px;border:1.5px solid var(--ligne);border-radius:8px" onchange="updateSlotAmount(${sl.id},${sl.team_id},this.value)">
    <button class="icon-btn" onclick="deleteSlot(${sl.id},${sl.team_id})" title="Retirer ce poste">✕</button>
  </div>`;
}
async function updateSlotEmployee(slotId, teamId, name){
  const sl = findSlot(teamId, slotId);
  const match = STATE.employees.find(e => normalizeFr(`${e.first_name} ${e.last_name}`) === normalizeFr(name));
  await api('employee_assignments', { method: 'PUT', body: { id: slotId, poste_id: sl.poste_id, employee_id: match ? match.id : null, montant: sl.montant } });
  refreshTeamSlots(teamId);
}
async function updateSlotAmount(slotId, teamId, value){
  const sl = findSlot(teamId, slotId);
  await api('employee_assignments', { method: 'PUT', body: { id: slotId, poste_id: sl.poste_id, employee_id: sl.employee_id, montant: Number(value)||0 } });
  refreshTeamSlots(teamId);
}
async function deleteSlot(slotId, teamId){
  if (!confirm('Retirer ce poste de cette équipe ?')) return;
  await api('employee_assignments', { method: 'DELETE', params: { id: slotId } });
  refreshTeamSlots(teamId);
}
async function addSlot(teamId){
  const poste_id = Number(document.getElementById(`ns-poste-${teamId}`).value);
  const montant = Number(document.getElementById(`ns-montant-${teamId}`).value) || 0;
  try {
    await api('employee_assignments', { method: 'POST', body: { team_id: teamId, poste_id, montant, season_id: STATE.seasonId } });
    refreshTeamSlots(teamId);
  } catch (e) { alert(e.message); }
}

  const montant = Number(document.getElementById(`ncs-montant-${categoryId}`).value) || 0;

    await api('employee_assignments', { method: 'POST', body: { category_id: categoryId, poste_id, montant, season_id: STATE.seasonId } });

}

async function importFile(action, file, onDone){
  const fd = new FormData(); fd.append('file', file);
  try {
    const res = await api(action, { method: 'POST', form: fd });
    let msg = `Import terminé : ${res.created} employé(s) créé(s), ${res.updated} mis à jour, ${res.skipped} ignoré(s)`;
    if (res.assignments !== undefined) msg += `, ${res.assignments} affectation(s)`;
    if (res.players_created !== undefined) msg += `. Joueurs : ${res.players_created} créé(s), ${res.players_updated} mis à jour`;
    alert(msg + '.');
    onDone();
  } catch (e) { alert('Échec de l\'import : ' + e.message); }
}

function empFilterAssignments(ee){
  return EMP_FILTER.season ? ee.assignments.filter(a => String(a.season_id) === String(EMP_FILTER.season)) : ee.assignments;
}

function renderEmployeeTable(){
  const el = document.getElementById('emp-table');
  const q = normalizeFr(EMP_FILTER.search);
  const currentSeason = STATE.seasons.find(sn => sn.id === STATE.seasonId);
  const list = STATE.employees.filter(e => {
    const asg = empFilterAssignments(e);
    if (EMP_FILTER.season && !asg.length) return false;
    if (EMP_FILTER.poste && !asg.some(a => String(a.poste_id) === String(EMP_FILTER.poste))) return false;
    if (EMP_FILTER.team && !asg.some(a => String(a.team_id) === String(EMP_FILTER.team))) return false;
    if (EMP_FILTER.paiement && (e.paiement || 'mensuel') !== EMP_FILTER.paiement) return false;
    if (!q) return true;
    const hay = normalizeFr(`${e.first_name} ${e.last_name} ${e.email}`);
    return hay.includes(q);
  });
  list.sort((a, b) => normalizeFr(a.last_name).localeCompare(normalizeFr(b.last_name)) || normalizeFr(a.first_name).localeCompare(normalizeFr(b.first_name)));

function normalizeFr(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

/* ============================================================ FICHE EMPLOYÉ
 *
 * Dossier RH complet, organisé en onglets qui suivent l'ordre réel d'un engagement :
 * on identifie la personne, on vérifie son droit de travailler, on signe un contrat,
 * on l'affilie aux assurances, puis on réunit les pièces.
 *
 * Les valeurs saisies vivent dans EMP_FORM et non dans le DOM : changer d'onglet
 * redessine le contenu, et lire les champs seulement au moment d'enregistrer perdrait
 * tout ce qui a été tapé dans les autres onglets.
 */

const CIVIL_STATUS = [
  ['celibataire', 'Célibataire'], ['marie', 'Marié·e'], ['partenariat', 'Partenariat enregistré'],
  ['separe', 'Séparé·e'], ['divorce', 'Divorcé·e'], ['veuf', 'Veuf·ve'],
];
const PERMIT_TYPES = [
  ['', 'Aucun (ressortissant·e suisse)'], ['B', 'B — séjour'], ['C', 'C — établissement'],
  ['G', 'G — frontalier'], ['L', 'L — courte durée'], ['Ci', 'Ci — conjoint diplomate'],
  ['F', 'F — admission provisoire'], ['S', 'S — protection'],
];
const CONTRACT_TYPES = [
  ['cdi', 'CDI — durée indéterminée'], ['cdd', 'CDD — durée déterminée'], ['stage', 'Stage'],
  ['apprentissage', 'Apprentissage'], ['sur_appel', 'Travail sur appel / à l\'heure'],
  ['mandat', 'Mandat'], ['benevole_indemnise', 'Bénévole indemnisé'],
];
/* Deux régimes de retenue (revu le 2026-08-14, suite au retour de Valentino) :
   - Lignes à taux PARTAGÉ (avs, ac, amat, aanp, laac, ijm) : même taux pour tout le monde
     un mois donné, révisé une fois par année civile (Paramètres > Paie). L'employé ne
     porte que l'assujettissement.
   - Lignes PERSONNELLES (lpp, is) : taux ou montant propres à la personne (âge/plan,
     situation familiale), toujours saisis sur sa fiche.
   SOCIAL_LINES reste la liste complète, utile partout où seul le k/label importe
   (construction des booléens, résumé, décompte). */
const SHARED_SOCIAL_LINES = [
  { k: 'avs',  label: 'AVS / AI / APG' },
  { k: 'ac',   label: 'Assurance chômage (AC)' },
  { k: 'amat', label: 'Assurance maternité (AMat GE)' },
  { k: 'aanp', label: 'Accidents non professionnels (AANP)' },
  { k: 'laac', label: 'Accidents complémentaire (LAAC)' },
  { k: 'ijm',  label: 'Indemnités journalières maladie' },
];
const PERSONAL_SOCIAL_LINES = [
  { k: 'lpp', label: 'Prévoyance professionnelle (LPP)' },
  { k: 'is',  label: 'Impôt à la source' },
];
const SOCIAL_LINES = [...SHARED_SOCIAL_LINES, ...PERSONAL_SOCIAL_LINES];

/** Formate un taux en %, jusqu'à 3 décimales (contrairement à chfSmart, pensé pour des
 * montants CHF à 2 décimales). Nécessaire pour l'AMat genevois, 0,029 % : arrondi à 2
 * décimales il s'afficherait "0,03", un écart trompeur sur un taux, pas sur un montant. */
function pctSmart(n){
  const v = Math.round((Number(n)||0) * 1000) / 1000;
  const isWhole = Math.abs(v - Math.round(v)) < 0.0001;
  return v.toLocaleString('fr-CH', { minimumFractionDigits: isWhole ? 0 : 1, maximumFractionDigits: 3 });
}

/** Taux partagés de l'année civile en cours, ou des zéros si l'année n'a pas encore
 * été paramétrée (plutôt que de faire planter l'affichage). */
function currentRateSettings(){
  const y = new Date().getFullYear();
  return (STATE.rateSettings || []).find(r => r.year === y)
    || { year: y, avs_rate: 0, ac_rate: 0, amat_rate: 0, aanp_rate: 0, laac_rate: 0, ijm_rate: 0 };
}

  if (opts.type === 'number' && Number(v) === 0) v = '';
  return `<div class="field"><label>${esc(label)}</label>

  EMP_FORM = {};
  const bools = ['active','is_frontalier','tax_at_source','tax_church','spouse_works',
                 'avs_rentier','avs_franchise_renonce','avs_minime_abatement',
                 ...SOCIAL_LINES.map(l => l.k + '_subject')];
  // Clés attachées par le serveur qui ne sont pas des champs de formulaire — jamais recopiées
  // telles quelles dans EMP_FORM, sous peine d'écraser insurance_profile_id (un id) par l'objet
  // insurance_profile résolu, ou d'envoyer ces blocs au serveur au moment d'enregistrer.
  const NON_FIELD_KEYS = ['assignments', 'indemnites_custom', 'annuaire', 'children', 'documents',
                           'files', 'insurance_profile', 'rate_settings'];
  if (ee) {
    Object.keys(ee).forEach(k => {
      if (NON_FIELD_KEYS.includes(k)) return;
      EMP_FORM[k] = bools.includes(k) ? Number(ee[k]) === 1 : ee[k];
    });
  } else {
    EMP_FORM = { active: true, country: 'CH', lang: 'fr', paiement: 'semestriel', payments_per_year: 12, contract_type: 'cdi' };
  }
  EMP_FORM.__id = ee ? ee.id : null;
  EMP_FORM.__assignments = ee ? ee.assignments : [];
  EMP_FORM.__children = ee ? (ee.children || []) : [];
  EMP_FORM.__documents = ee ? (ee.documents || []) : [];
  EMP_FORM.__files = ee ? (ee.files || []) : [];

  openModal(`
    <h3>${ee ? `${esc(ee.first_name)} ${esc(ee.last_name)} — fiche employé` : 'Nouvel employé'}</h3>
    <div class="modal-error"></div>
    <div class="tabs" id="emp-tabs" style="margin-bottom:14px">
      ${EMP_TABS.map(([k, l]) => `<div class="tab ${k==='perso'?'active':''}" data-et="${k}" onclick="switchEmployeeTab('${k}')">${esc(l)}</div>`).join('')}
    </div>
    <div id="emp-form-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveEmployee()">Enregistrer</button>
    </div>
  `, true);
  renderEmployeeFormBody();
}

function renderEmployeeFormBody(){
  const el = document.getElementById('emp-form-body');
  if (!el) return;
  const canPayroll = !!MFC.payrollView;
  if (EMP_TAB === 'perso')            el.innerHTML = empTabPerso(canPayroll);
  else if (EMP_TAB === 'sejour')      el.innerHTML = empTabSejour(canPayroll);
  else if (EMP_TAB === 'contrat')     el.innerHTML = empTabContrat(canPayroll);
  else if (EMP_TAB === 'assurances')  el.innerHTML = empTabAssurances(canPayroll);
  else if (EMP_TAB === 'enfants')     el.innerHTML = empTabEnfants(canPayroll);
  else                                el.innerHTML = empTabOnboarding();
}

function empFileSize(bytes){
  bytes = Number(bytes) || 0;
  if (bytes < 1024) return bytes + ' o';
  if (bytes < 1024*1024) return Math.round(bytes/1024) + ' Ko';
  return (bytes/1024/1024).toFixed(1) + ' Mo';
}

/* Les pièces (checklist ou dossier libre) s'enregistrent au clic/dépôt, sans attendre le
 * bouton Enregistrer : chaque action est complète en soi et ne doit pas se perdre si la
 * fiche est fermée sans clic sur Enregistrer. */
async function uploadEmployeeDocFile(docType, input){
  const file = input.files[0]; if (!file) return;
  const fd = new FormData();
  fd.append('file', file); fd.append('employee_id', EMP_FORM.__id); fd.append('doc_type', docType);
  try {
    await api('employee_document_upload', { method: 'POST', form: fd });
    EMP_FORM.__documents = await api('employee_documents', { params: { employee_id: EMP_FORM.__id } });
    renderEmployeeFormBody();

/* Les pièces s'enregistrent au clic, sans attendre le bouton Enregistrer : cocher une case
   est une action complète en soi, et l'onglet se redessine juste après pour faire apparaître
   les champs de date. */
async function saveDocument(docType, received){
  if (!EMP_FORM.__id) return;
  const existing = (EMP_FORM.__documents || []).find(d => d.doc_type === docType) || {};
  const body = { employee_id: EMP_FORM.__id, doc_type: docType, received,
    received_date: received ? (existing.received_date || new Date().toISOString().slice(0,10)) : '',
    expiry_date: existing.expiry_date || '', notes: existing.notes || '' };
  try {
    await api('employee_documents', { method: 'POST', body });
    EMP_FORM.__documents = await api('employee_documents', { params: { employee_id: EMP_FORM.__id } });
    renderEmployeeFormBody();
  } catch (e) { modalErr(e.message); }
}
async function saveDocumentField(docType, field, value){
  if (!EMP_FORM.__id) return;
  const existing = (EMP_FORM.__documents || []).find(d => d.doc_type === docType) || {};
  const body = { employee_id: EMP_FORM.__id, doc_type: docType, received: true,
    received_date: existing.received_date || '', expiry_date: existing.expiry_date || '',
    notes: existing.notes || '' };
  body[field] = value;
  try {
    await api('employee_documents', { method: 'POST', body });
    EMP_FORM.__documents = await api('employee_documents', { params: { employee_id: EMP_FORM.__id } });
    renderEmployeeFormBody();
  } catch (e) { modalErr(e.message); }
}

async function renderPlayers(c){

function renderPlayersList(){

  const inactive = list.filter(p => p.active != 1);
  el.innerHTML = `
    <div class="card">
      <div class="card-head"><h3>Joueurs actifs (${active.length})</h3></div>

        ${active.map(p => playerRow(p)).join('')}
      </tbody></table>` : `<div class="empty">${filtered ? 'Aucun résultat pour ce filtre.' : 'Aucun joueur actif enregistré.'}</div>`}
    </div></div>
    ${inactive.length ? `<details style="margin-top:14px">
      <summary style="font-size:13px;font-weight:700;cursor:pointer;padding:4px 0">Joueurs inactifs (${inactive.length})</summary>

async function renderPrimes(c){
  document.getElementById('topbar-actions').innerHTML = `<div class="month-picker"><input type="month" id="primes-month" value="${STATE.month}"></div>`;
  c.innerHTML = `
    <div class="tabs">
      <div class="tab active" data-pt="matrix" onclick="switchPrimeTab('matrix')">Tableau des primes</div>
      <div class="tab" data-pt="import" onclick="switchPrimeTab('import')">Importer une feuille</div>
    </div>
    <div id="prime-tab-matrix"></div>
    <div id="prime-tab-import" style="display:none"></div>
  `;
  document.getElementById('primes-month').onchange = e => { STATE.month = e.target.value; renderMatrix(); };
  renderMatrix();
  renderImportTab(document.getElementById('prime-tab-import'));
}
function switchPrimeTab(t){
  document.querySelectorAll('[data-pt]').forEach(el => el.classList.toggle('active', el.dataset.pt === t));
  ['matrix','import'].forEach(k => document.getElementById('prime-tab-'+k).style.display = k===t ? '' : 'none');
}

async function renderMatrix(){
  const y = window.scrollY;
  const el = document.getElementById('prime-tab-matrix');
  el.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  const data = await api('primes_matrix', { params: { month: STATE.month } });
  window.__matrix = data;

  const matchCols = data.matches.map(m => `<th><div class="matrix-col-head">
    <span class="d">${esc(m.date)}</span><span class="a">${esc(m.adversaire)||'—'}</span>
    <button class="icon-btn" style="align-self:flex-start" onclick="deleteMatch(${m.id})" title="Supprimer ce match">✕</button>
  </div></th>`).join('');

  el.innerHTML = `
    <div class="card">
      <div class="card-head">
        <h3>Primes — ${esc(STATE.month)}</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="addGuestPlayer()">+ joueur ponctuel</button>
          <button class="btn btn-primary btn-sm" onclick="addMatchColumn()">+ nouveau match</button>
        </div>
      </div>
      <div class="card-body pad0 matrix-wrap">
        ${data.players.length || data.matches.length ? `<table class="matrix-table"><thead><tr><th>Joueur</th>${matchCols}<th>Total</th></tr></thead><tbody>
          ${data.players.map(p => `<tr>
            <td><strong>${esc(p.name)}</strong>${p.is_guest?' <span class="pill" style="background:var(--orange-bg);color:var(--orange)">ponctuel</span>':''}</td>
            ${data.matches.map(m => `<td><input class="cell-amount" type="number" step="0.05" value="${p.cells[m.id] ?? ''}" placeholder="0" onchange="saveCell(${m.id},${p.player_id},this.value)"></td>`).join('')}
            <td class="matrix-total">${chf(p.total)} CHF</td>
          </tr>`).join('')}
          ${data.matches.length ? `<tr><td><strong>Total match</strong></td>${data.matches.map(m => `<td><strong>${chf(data.players.reduce((s,p)=>s+(p.cells[m.id]||0),0))} CHF</strong></td>`).join('')}<td></td></tr>` : ''}
        </tbody></table>` : `<div class="empty">Aucun joueur actif. Ajoutez des joueurs dans l'onglet Joueurs.</div>`}
      </div>
    </div>
    ${!data.matches.length ? `<p class="hint">Clique sur "+ nouveau match" pour activer une colonne et commencer à saisir les primes.</p>` : ''}
  `;
  window.scrollTo(0, y);
}

let DRAG_CAT = null;
function onCatDragStart(e, id){
  DRAG_CAT = id;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.style.opacity = '.4';
}
function onCatDragOver(e){
  if (DRAG_CAT === null && DRAG_TEAM === null) return;
  e.preventDefault();
  e.currentTarget.style.background = 'var(--jaune-soft)';
}
function onCatDragLeave(e){ e.currentTarget.style.background = '#FAFAF7'; }
async function onCatDrop(e, targetId){
  e.preventDefault();
  e.currentTarget.style.background = '#FAFAF7';
  // Déposer une équipe sur l'en-tête d'une catégorie : la déplace (à la fin) dans cette catégorie,
  // y compris depuis une autre catégorie.
  if (DRAG_TEAM !== null) {
    const dragged = DRAG_TEAM;
    DRAG_TEAM = null;
    await moveTeamToCategory(dragged.id, targetId, null);
    return;
  }
  if (DRAG_CAT === null || DRAG_CAT === targetId) { DRAG_CAT = null; return; }
  const fromIdx = STATE.categories.findIndex(c => c.id === DRAG_CAT);
  const toIdx = STATE.categories.findIndex(c => c.id === targetId);
  DRAG_CAT = null;
  if (fromIdx < 0 || toIdx < 0) return;
  const arr = STATE.categories.slice();
  const [moved] = arr.splice(fromIdx, 1);
  arr.splice(toIdx, 0, moved);
  STATE.categories = arr;
  renderSettingsBody();
  await api('team_categories_reorder', { method: 'POST', body: { ids: arr.map(c => c.id) } });
}
function onCatDragEnd(e){ e.currentTarget.style.opacity = ''; DRAG_CAT = null; }

let DRAG_TEAM = null;
function onTeamDragStart(e, teamId, categoryId){
  DRAG_TEAM = { id: teamId, categoryId };
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.style.opacity = '.4';
}
function onTeamDragOver(e, categoryId){

  e.currentTarget.style.background = 'var(--jaune-soft)';
}
function onTeamDragLeave(e){ e.currentTarget.style.background = '#fff'; }
async function onTeamDrop(e, targetTeamId, categoryId){
  e.preventDefault();
  e.currentTarget.style.background = '#fff';
  const dragged = DRAG_TEAM;
  DRAG_TEAM = null;
  if (!dragged || dragged.id === targetTeamId) return;
  await moveTeamToCategory(dragged.id, categoryId, targetTeamId);
}
function onTeamDragEnd(e){ e.currentTarget.style.opacity = ''; DRAG_TEAM = null; }

/** Déplace une équipe vers (ou au sein d') une catégorie, en l'insérant avant `insertBeforeTeamId`
 * (ou à la fin si null), et persiste l'ordre + le rattachement de catégorie côté serveur. */
async function moveTeamToCategory(teamId, targetCategoryId, insertBeforeTeamId){
  const team = STATE.teams.find(t => t.id === teamId);
  if (!team) return;
  const sameCategory = team.category_id === targetCategoryId;
  if (sameCategory && team.id === insertBeforeTeamId) return;
  const destScoped = STATE.teams.filter(t => t.category_id === targetCategoryId && t.id !== teamId);
  let insertIdx = destScoped.length;
  if (insertBeforeTeamId != null) {
    const idx = destScoped.findIndex(t => t.id === insertBeforeTeamId);
    if (idx >= 0) insertIdx = idx;
  }
  const arr = destScoped.slice();
  arr.splice(insertIdx, 0, { ...team, category_id: targetCategoryId });
  const others = STATE.teams.filter(t => t.category_id !== targetCategoryId && t.id !== teamId);
  STATE.teams = [...others, ...arr];
  SETTINGS_EXPANDED_CATS.add(targetCategoryId);
  renderSettingsBody();
  try {
    if (!sameCategory) {
      await api('teams', { method: 'PUT', body: { id: teamId, name: team.name, category_id: targetCategoryId, active: team.active == 1 } });
    }
    await api('teams_reorder', { method: 'POST', body: { ids: arr.map(t => t.id) } });
  } catch (e) { alert(e.message); }
  await refreshSettings();
}

function toggleSettingsCat(id){
  if (SETTINGS_EXPANDED_CATS.has(id)) SETTINGS_EXPANDED_CATS.delete(id); else SETTINGS_EXPANDED_CATS.add(id);
  renderSettingsBody();
}

  try { await api('teams', { method: 'PUT', body: { id, name, category_id: t.category_id, active: t.active == 1 } }); await refreshSettings(); }
  catch (e) { alert(e.message); renderSettingsBody(); }

async function addCategoryInline(){

async function savePayrollAccountingSettings(fieldEl){
  const netAcc = resolveComptaAccount(document.getElementById('pas-net-account').value);

  const body = {

/* Enregistre la ligne dès que le champ perd le focus (onchange), pour ne rien
   perdre si Valentino change d'onglet avant de cliquer sur le bouton global
   en bas du tableau — celui-ci reste utile pour tout re-sauver d'un coup,
   mais n'est plus la seule façon de ne pas perdre une saisie. */
async function savePayrollLineAccountRow(key, fieldEl){
  const chargeAcc = resolveComptaAccount(document.getElementById('pla-charge-' + key).value);
  const payableAcc = resolveComptaAccount(document.getElementById('pla-payable-' + key).value);
  try {
    await api('payroll_accounting_settings', { method: 'PUT', body: {
      line_key: key,
      charge_account_number: chargeAcc ? chargeAcc.number : '',
      charge_account_label: chargeAcc ? chargeAcc.name : '',
      payable_account_number: payableAcc ? payableAcc.number : '',
      payable_account_label: payableAcc ? payableAcc.name : '',
    }});
    if (STATE.payrollAccounting && Array.isArray(STATE.payrollAccounting.lines)) {
      const line = STATE.payrollAccounting.lines.find(l => l.line_key === key);
      if (line) {
        line.charge_account_number = chargeAcc ? chargeAcc.number : '';
        line.charge_account_label = chargeAcc ? chargeAcc.name : '';
        line.payable_account_number = payableAcc ? payableAcc.number : '';
        line.payable_account_label = payableAcc ? payableAcc.name : '';
      }
    }
    if (fieldEl) {
      fieldEl.style.transition = 'background-color .2s';
      fieldEl.style.backgroundColor = '#e3f6e8';
      setTimeout(() => { fieldEl.style.backgroundColor = ''; }, 800);
    }
    const countEl = document.getElementById('pla-configured-count');
    if (countEl) countEl.textContent = payrollLineAccountsConfiguredCount() + ' / ' + PAIE_LINE_ACCOUNT_KEYS.length;
    const statusEl = document.getElementById('pla-status-' + key);
    if (statusEl) statusEl.textContent = payrollLineAccountsConfigured(key) ? '✅' : '⚠️';
  } catch (e) { alert(e.message); }
}
async function saveAllPayrollAccounting(){
  const netAcc = resolveComptaAccount(document.getElementById('pas-net-account').value);

  try {

      net_payable_account_label: netAcc ? netAcc.name : 'Salaire à payer',
      suspense_account_number: suspAcc ? suspAcc.number : '',
      suspense_account_label: suspAcc ? suspAcc.name : '',
      journal_code: document.getElementById('pas-journal-code').value,

}

async function savePaieRateYear(){
  const year = Number(document.getElementById('paie-year').value);
  if (!year) return alert('Année requise.');
  const body = { year };
  PAIE_RATE_FIELDS.forEach(f => { body[f[0]] = Number(document.getElementById('paie-' + f[0]).value) || 0; });
  PAIE_EMPLOYER_RATE_FIELDS.forEach(f => { body[f[0]] = Number(document.getElementById('paie-' + f[0]).value) || 0; });
  PAIE_EMPLOYER_ONLY_RATE_FIELDS.forEach(f => { body[f[0]] = Number(document.getElementById('paie-' + f[0]).value) || 0; });
  PAIE_AVS_FIELDS.forEach(f => { body[f[0]] = Number(document.getElementById('paie-' + f[0]).value) || 0; });
  PAIE_CEILING_FIELDS.forEach(f => { body[f[0]] = Number(document.getElementById('paie-' + f[0]).value) || 0; });
  body.lavage_threshold = Number(document.getElementById('paie-lavage-threshold').value) || 0;
  body.lavage_amount = Number(document.getElementById('paie-lavage-amount').value) || 0;
  const lavageAcc = resolveComptaAccount(document.getElementById('paie-lavage-account').value);
  body.lavage_account_number = lavageAcc ? lavageAcc.number : '';
  body.lavage_account_label = lavageAcc ? lavageAcc.name : '';
  const salaryAcc = resolveComptaAccount(document.getElementById('paie-player-salary-account').value);
  body.player_salary_account_number = salaryAcc ? salaryAcc.number : '';
  body.player_salary_account_label = salaryAcc ? salaryAcc.name : '';
  const bonusAcc = resolveComptaAccount(document.getElementById('paie-player-bonus-account').value);
  body.player_bonus_account_number = bonusAcc ? bonusAcc.number : '';
  body.player_bonus_account_label = bonusAcc ? bonusAcc.name : '';
  body.player_salary_label = document.getElementById('paie-player-salary-label').value.trim();
  body.player_bonus_label = document.getElementById('paie-player-bonus-label').value.trim();
  try {
    await api('payroll_rate_settings', { method: 'POST', body });
    PAIE_RATE_YEAR_EDITING = null;
    await refreshSettings();
  } catch (e) { alert(e.message); }
}

/* Texte affiché/recherché pour un compte : "numéro — nom", filtrable nativement par le
   navigateur dans un <input list="..."> au fur et à mesure de la frappe (aucune librairie). */
const accountOptionText = a => `${a.number} — ${a.name}`;

/* Retrouve le compte correspondant exactement au texte tapé/choisi dans un champ de recherche
   de compte. Un texte qui ne correspond à aucun compte connu (faute de frappe, champ vidé) est
   traité comme "aucun compte" plutôt que d'enregistrer un rattachement à moitié saisi. */
function resolveComptaAccount(text){
  const accounts = Array.isArray(STATE.comptaAccounts) ? STATE.comptaAccounts : [];
  const t = String(text || '').trim();
  return accounts.find(a => accountOptionText(a) === t) || null;
}
function comptaAccountsDatalist(id){
  const accounts = Array.isArray(STATE.comptaAccounts) ? STATE.comptaAccounts : [];
  return `<datalist id="${id}">${accounts.map(a => `<option value="${esc(accountOptionText(a))}">`).join('')}</datalist>`;
}

async function posteModal(p){
  if (!STATE.comptaAccounts) STATE.comptaAccounts = await apiCompta('accounts');
  const accounts = Array.isArray(STATE.comptaAccounts) ? STATE.comptaAccounts : [];
  const current = p && p.account_number ? accounts.find(a => a.number === p.account_number) : null;
  const currentText = current ? accountOptionText(current) : (p && p.account_label ? p.account_label : '');
  openModal(`
    <h3>${p?'Modifier':'Nouveau'} rôle</h3>
    <div class="modal-error"></div>
    <div class="field"><label>Libellé</label><input id="pt-label" value="${p?esc(p.label):''}" placeholder="Ex: Directeur technique"></div>

      ${comptaAccountsDatalist('pt-account-options')}

      ${p ? `<button class="btn btn-ghost" onclick="deletePoste(${p.id})" style="color:var(--rouge);margin-right:auto">Supprimer</button>` : ''}

async function savePoste(id){
  const label = document.getElementById('pt-label').value.trim();

let PS = { employee: null, fiche: null, season: null, seasonId: null,
           indemnites: [], retenues: [], overrides: {}, month: new Date().toISOString().slice(0,7), computed: null };

async function renderPayslipPage(employeeId, seasonId){
  const app = document.getElementById('app');
  app.innerHTML = `<div style="padding:80px;text-align:center;color:#6E6C61">Chargement…</div>`;
  /* Cette page EST la fiche de paie : sans le droit sur les salaires, il n'y a
     rien à dégrader, on le dit franchement au lieu de rester sur « Chargement ». */
  let employees, seasons, ctx;
  try {
    /* payslip_context exige le droit sur les salaires côté serveur. C'est lui qui garde
       cette page : sans cet appel, la liste des employés seule (droit employees.view,
       accordé bien plus largement) suffirait à ouvrir un décompte. */
    [employees, seasons, ctx] = await Promise.all([
      api('employees', { params: { season_id: seasonId } }),
      api('seasons'),
      api('payslip_context', { params: { employee_id: employeeId, month: PS.month } }),
    ]);
    if (!STATE.comptaAccounts) STATE.comptaAccounts = await apiCompta('accounts');
  } catch (e) {
    app.innerHTML = `<div style="padding:80px;text-align:center;max-width:520px;margin:0 auto;line-height:1.6">`
      + `<h2 style="margin-bottom:10px">${e.status === 403 ? 'Accès refusé' : 'Erreur'}</h2>`
      + `<p>${e.status === 403 ? "Vous n'avez pas le droit de consulter les décomptes de paie." : esc(e.message)}</p>`
      + `<p style="margin-top:16px"><a href="index.php">Retour au module RH</a></p></div>`;
    return;
  }
  const ee = employees.find(e => e.id === employeeId);
  if (!ee) { app.innerHTML = `<div style="padding:80px;text-align:center">Employé introuvable.</div>`; return; }
  PS.employeeId = employeeId;
  PS.employee = ee;
  PS.fiche = ctx.employee;
  PS.season = seasons.find(s => s.id === seasonId) || null;
  PS.seasonId = seasonId;
  PS.indemnites = [];
  PS.retenues = [];
  PS.overrides = {};
  await renderPayslipDoc(); // fixe aussi document.title (nom de fichier suggéré à l'impression)
}

async function changePayslipMonth(value){
  PS.month = value;
  await renderPayslipDoc();
}

function addPayslipLine(type){
  const line = { label: '', montant: 0, account_number: '', account_label: '' };
  if (type === 'retenues') line.sign = 'retenue'; // 'retenue' réduit le net (défaut), 'complement' l'augmente
  PS[type].push(line);
  renderPayslipDoc();
}

/* Rattacher une indemnité ajoutée à la main sur ce décompte à un compte du plan comptable,
   pour qu'elle se regroupe avec les rôles du même compte sur le document imprimé (ex: une
   prime ponctuelle "Prime diplôme" rattachée au même compte qu'un rôle "Responsable" -> les
   deux apparaissent sous un seul intitulé "Indemnité admin" à l'impression). Sans compte
   choisi, la ligne garde son libellé tapé à la main. */
function setPayslipLineAccount(i, text){
  const acc = resolveComptaAccount(text);
  PS.indemnites[i].account_number = acc ? acc.number : '';
  PS.indemnites[i].account_label = acc ? acc.name : '';
  renderPayslipDoc();
}

/* Corriger une ligne calculée par le serveur (charge sociale) fige son montant, envoyé comme
   override à payslip_compute : c'est une décision du responsable, elle ne doit pas être
   écrasée au prochain recalcul. Vider le champ lui rend son calcul normal. Contrairement à
   avant cette phase, une charge sociale ne peut plus être supprimée du décompte (elle est due
   dès que la fiche coche l'assujettissement) : la corriger à 0 en est le nouvel équivalent
   explicite, si un cas réel le justifie, plutôt qu'une suppression qui n'en gardait pas trace. */
function overrideAutoLine(key, value){
  const v = String(value).trim();
  if (v === '') delete PS.overrides[key]; else PS.overrides[key] = Number(v) || 0;
  renderPayslipDoc();
}

function removePayslipLine(type, i){ PS[type].splice(i, 1); renderPayslipDoc(); }
function updatePayslipLine(type, i, field, el){
  PS[type][i][field] = field === 'montant' ? (Number(el.value) || 0) : el.value;
  renderPayslipDoc();
}

const PAYSLIP_MONTH_LABELS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* Une retenue ajoutée à la main se saisit toujours en positif à l'écran (plus naturel), le
 * sélecteur "Retenue / Complément" en fixe le signe réel envoyé au serveur : une "Retenue"
 * (par défaut) réduit le net comme avant, un "Complément" l'augmente (ex: trop prélevé le mois
 * précédent, à rembourser sur ce décompte). Le moteur de calcul (lib_payroll_engine.php) somme
 * déjà les montants de 'divers_lines' tels quels dans le net — un montant négatif l'augmente
 * naturellement, aucun changement nécessaire côté serveur, seul le signe transmis change. */
function signedRetenues(list){
  return list.map(l => ({ ...l, montant: Math.abs(Number(l.montant) || 0) * (l.sign === 'complement' ? -1 : 1) }));
}
/** Affichage d'un montant "Divers" avec son signe réel : une retenue (montant positif après
 * signedRetenues) se lit "− X", un complément (montant négatif) se lit "+ X" — jamais un signe
 * fixe qui produirait "− -50.00" pour un complément. */
function diversAmountDisplay(montant){
  const v = Number(montant) || 0;
  return (v >= 0 ? '− ' : '+ ') + chf(Math.abs(v));
}

/* Seule source de vérité du calcul (bases, plafonds, franchise/abattement, net) : le serveur
 * (lib_payroll_engine.php, action payslip_compute), pas ce fichier. Rappelé à chaque
 * changement (mois, indemnité, retenue, override) par renderPayslipDoc(). */
async function fetchPayslipComputed(){
  try {
    PS.computed = await api('payslip_compute', { method: 'POST', body: {
      person_type: 'employee', person_id: PS.employeeId, month: PS.month, season_id: PS.seasonId,
      indemnites: PS.indemnites, retenues: signedRetenues(PS.retenues), overrides: PS.overrides,
    }});
    PS.computeError = null;
  } catch (e) { PS.computed = null; PS.computeError = e.message; }
}

async function generatePayslipPdf(btn){
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Génération…'; }
  try {
    // Le serveur recalcule à partir de ces seules lignes manuelles, persiste et verrouille le
    // décompte, puis génère le PDF depuis ce qu'il vient d'enregistrer — jamais depuis un
    // montant transmis par l'écran.
    const blob = await api('payslip_pdf', { method: 'POST', body: {
      employee_id: PS.employeeId, month: PS.month, season_id: PS.seasonId,
      indemnites: PS.indemnites, retenues: signedRetenues(PS.retenues), overrides: PS.overrides,
    }});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${PS.month}_Décompte_${PS.employee.last_name}_${PS.employee.first_name}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    await renderPayslipDoc(); // recharge : le décompte est désormais verrouillé côté serveur
  } catch (e) {
    alert('Échec de la génération du PDF : ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText; }
  }
}

async function renderPayslipDoc(){
  const app = document.getElementById('app');

      <p>${esc(PS.computeError || 'Erreur inconnue')}</p>

  }

  const [y, m] = String(PS.month || '').split('-');
  const moisLabel = PAYSLIP_MONTH_LABELS[(Number(m) || 1) - 1] || '';

  /* Titre de l'onglet = nom de fichier suggéré par le navigateur pour "Enregistrer en PDF" :
     AAAA-MM_Décompte_Nom_Prénom. Recalculé à chaque rendu pour suivre un changement de mois. */
  document.title = `${y}-${m}_Décompte_${ee.last_name}_${ee.first_name}`;

  /* Deux rendus distincts à partir des mêmes données calculées côté serveur, et non un seul
     formulaire maquillé pour l'impression : un <input> gardait son rendu de champ de saisie
     au print (espacement, police, parfois les flèches du type number) même bordure masquée.
     - editable=true  : version écran, avec champs de saisie et boutons ✕ (jamais imprimée).

    const row = (label, base, taux, montant, opts = {}) => `<tr${opts.topBorder?' style="border-top:1.5px solid var(--noir)"':''}>

    // document final, pour se regrouper avec les rôles rattachés au même compte.
    const current = (l) => l.account_number ? accountOptionText({ number: l.account_number, name: l.account_label }) : '';

    const chargeRow = (l) => {
      const hasRate = l.rate > 0 && !(l.key in PS.overrides);

      const taux = hasRate ? pctSmart(l.rate)+' %' : '';

      return `<tr>

          </div>

    };

    const chargesHeaderLabel = 'Charges sociales' + (c.avs_reduction_applied
      ? ` <span style="font-weight:400;color:var(--gris);text-transform:none;font-size:11.5px">— ${esc(c.avs_reduction_applied)}</span>`
      : '');

    return `
      ${editable ? comptaAccountsDatalist('ps-account-options') : ''}
      <div style="background:#fff;${editable?'border:1px solid var(--ligne);border-radius:16px;box-shadow:var(--ombre);':''}overflow:hidden;font-size:12.5px;line-height:1.5">
        <div style="background:var(--noir);color:#fff;padding:22px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px">
          <div>
            <div class="sora" style="font-size:16px;font-weight:800;color:var(--jaune);letter-spacing:.3px">MEYRIN FC</div>
            <div style="font-size:12px;color:#C9C7BD;margin-top:2px">Décompte de salaire</div>
          </div>
          <div style="text-align:right">
            <div class="sora" style="font-size:15px;font-weight:700;text-transform:capitalize">${esc(moisLabel)} ${esc(y||'')}</div>
            <div style="font-size:11px;color:#C9C7BD;margin-top:2px">${c.period_div === 2?'Période semestrielle':'Période mensuelle'}</div>
          </div>
        </div>

        <div style="padding:28px 30px 6px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
          <div>
            <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2);margin-bottom:3px">N° collaborateur</div>
            <div style="font-weight:600;margin-bottom:14px">${ee.id}</div>
            <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2);margin-bottom:3px">N° AVS</div>
            <div style="font-weight:600">${f.avs_number?esc(f.avs_number):'—'}</div>
          </div>
          <div style="text-align:right">

          </div>
        </div>

        <div style="padding:18px 30px 0">
          <table style="width:100%;border-collapse:collapse;table-layout:fixed">
            <thead><tr style="border-bottom:1.5px solid var(--noir)">
              <th style="text-align:left;padding-bottom:7px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2)">Rubrique et genres de salaires</th>
              <th style="text-align:right;padding-bottom:7px;width:85px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2)">Base</th>
              <th style="text-align:right;padding-bottom:7px;width:95px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2)">Taux</th>
              <th style="text-align:right;padding-bottom:7px;width:100px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-2)">Montant</th>
            </tr></thead>
            <tbody>
              ${row('Salaire brut', '', '', '', { bold: true, pad: '16px' })}
              ${editable
                ? `${(ee.assignments||[]).filter(a => Number(a.season_id) === PS.seasonId).map(a => row(`${esc(a.poste_label)}${a.team_name?' — '+esc(a.team_name):(a.category_name?' — '+esc(a.category_name):'')}`, '', '', chf(Number(a.montant)/c.period_div))).join('')}
                   ${PS.indemnites.map((l,i) => customRow('indemnites', i)).join('')}`
                : c.revenue_lines.map(l => row(esc(l.label) || '—', '', '', chf(l.montant))).join('')}

              ${row(chargesHeaderLabel, '', '', '', { bold: true, pad: '22px' })}

              ${(c.divers_lines.length || PS.retenues.length) ? `

                ${editable
                  ? `${c.divers_lines.slice(0, Math.max(0, c.divers_lines.length - PS.retenues.length)).map(l => row(esc(l.label) || '—', '', '', diversAmountDisplay(l.montant))).join('')}
                     ${PS.retenues.map((l,i) => customRow('retenues', i)).join('')}`
                  : c.divers_lines.map(l => row(esc(l.label) || '—', '', '', diversAmountDisplay(l.montant))).join('')}

            <div style="font-weight:600;font-variant-numeric:tabular-nums">${ee.iban ? esc(ee.iban) : '—'}</div>
          </div>
          <div style="padding:14px 22px;background:var(--noir);color:#fff;display:flex;align-items:center;gap:16px;justify-content:flex-end;min-width:210px">
            <span style="font-size:12px;color:#C9C7BD">Salaire net</span>
            <span class="sora" style="font-size:19px;font-weight:800;color:var(--jaune);font-variant-numeric:tabular-nums">${chf(c.net)}</span>

  }

  // Avertissements du moteur (§9 SPEC) : rouge et bouton désactivé si bloquant (N° AVS
  // invalide, net négatif, cumul franchise/abattement), orange sinon (ex: LPP sous le seuil).
  const warningsBanner = c.warnings.length ? `
    <div class="no-print" style="margin-bottom:16px;padding:12px 16px;border-radius:10px;border:1px solid ${c.blocking.length?'var(--rouge)':'#E9C77A'};background:${c.blocking.length?'#FDECEA':'#FFF8E6'};font-size:12.5px;line-height:1.5">
      ${c.warnings.map(w => `<div>${c.blocking.includes(w) ? '🔴' : '⚠️'} ${esc(w)}</div>`).join('')}

  app.innerHTML = `
