<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entraînements · FC Meyrin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --sunken:#F1EFE8;
  --border:#E7E4DC; --border-strong:#D9D5C9;
  --ink:#1C1B17; --ink-2:#57544B; --muted:#6B6759;
  --gold:#E5B02E; --gold-press:#D3A020; --gold-soft:#FBEFCE; --on-gold:#221B06;
  --black:#17150F;
  --green:#1E9E5A; --green-soft:#E5F3EB;
  --amber:#B97E1C; --amber-soft:#F8EED9;
  --red:#CE4A3B; --red-soft:#FAE7E3;
  --blue:#2F6FE0; --blue-soft:#E7EEFB;
  --r:10px; --r-lg:14px;
  --sh-card:0 1px 2px rgba(20,18,10,.04),0 1px 3px rgba(20,18,10,.05);
  --sh-pop:0 6px 24px rgba(20,18,10,.14);
  --sb:248px;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 "Inter",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Sora","Inter",sans-serif;font-weight:600;line-height:1.25;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.s12{font-size:12px}.s13{font-size:13px}

/* ---------- shell ---------- */
#root{min-height:100%}
.shell-staff{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
.shell-coach{max-width:520px;margin:0 auto;min-height:100vh;background:var(--surface);border-inline:1px solid var(--border);display:flex;flex-direction:column}

/* sidebar (staff) */
.sidebar{background:var(--black);color:#E9E7DE;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .crest{width:30px;height:30px;flex:none}
.brand b{font-family:"Sora";font-size:14px;font-weight:700;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r);color:#B7B4A7;font-size:13.5px;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#EBE9E0}
.nav a.on{background:rgba(255,255,255,.10);color:#fff}
.nav a.on svg{color:var(--gold);opacity:1}
.nav .badge-n{margin-left:auto;background:rgba(255,255,255,.14);color:#EBE9E0;font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.nav .grp{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#77746A;padding:14px 10px 5px}
.sidebar .foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar .foot a{color:#9A978C;font-size:12.5px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r)}
.sidebar .foot a:hover{background:rgba(255,255,255,.06);color:#D6D3C8}

/* appbar + tabbar (coach) */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:12px 16px}
.appbar .crest{width:26px;height:26px}
.appbar b{font-family:"Sora";font-size:14px;font-weight:700}
.appbar .sp{margin-left:auto}
.tabbar{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:var(--r);color:var(--muted);font-size:11px;font-weight:500}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{color:var(--gold)}

/* content */
.main{padding:22px 28px 40px;max-width:1100px}
.coach-main{flex:1;padding:18px 16px 24px;overflow-y:auto}
.page-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px}
.page-h h1{font-size:22px}
.page-h .sub{color:var(--muted);font-size:13px;margin-top:2px}
.page-h .sp{margin-left:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:var(--r);font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .14s ease-out,opacity .14s ease-out}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--gold);color:var(--on-gold)}
.btn-primary:hover{background:var(--gold-press)}
.btn-dark{background:var(--black);color:#F1EFE6}
.btn-dark:hover{opacity:.9}
.btn-ghost{background:var(--surface);border:1px solid var(--border-strong);color:var(--ink)}
.btn-ghost:hover{background:var(--sunken)}
.btn-quiet{background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--sunken)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#f4d6d0}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{opacity:.92}
.btn-lg{height:46px;font-size:14.5px;padding:0 20px;width:100%}
.btn-sm{height:32px;font-size:12.5px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-card)}
.card-p{padding:18px}
.stack>*+*{margin-top:12px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* filter pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--border-strong);border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.pill svg{width:13px;height:13px;opacity:.6}
.pill.on{background:var(--ink);color:#F3F1E8;border-color:var(--ink)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{width:100%;height:40px;padding:0 12px 0 36px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface)}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}

/* exercise list */
.list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--sh-card)}
.exrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);text-align:left;width:100%}
.exrow:last-child{border-bottom:none}
.exrow:hover{background:var(--sunken)}
.thumb{width:54px;height:40px;border-radius:8px;overflow:hidden;flex:none;background:var(--sunken);border:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.exrow .tt{font-weight:600;font-size:13.5px}
.exrow .mt{display:flex;gap:8px;align-items:center;margin-top:3px}
.exrow .chev{margin-left:auto;color:var(--muted)}
.exrow .chev svg{width:16px;height:16px}

.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--sunken);color:var(--ink-2)}
.badge .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
.b-en_revue{background:var(--amber-soft);color:var(--amber)}
.b-valide{background:var(--blue-soft);color:var(--blue)}
.b-publie{background:var(--green-soft);color:var(--green)}
.b-archive{background:var(--red-soft);color:var(--red)}
.b-brouillon{background:var(--sunken);color:var(--muted)}

.empty{text-align:left;padding:40px 22px;border:1px dashed var(--border-strong);border-radius:var(--r-lg);background:var(--surface)}
.empty h3{font-size:15px;margin-bottom:4px}
.empty p{color:var(--muted);font-size:13px;max-width:42ch;margin-bottom:14px}
.pager{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:16px;color:var(--muted);font-size:13px}

/* stat card */
.stat h4{font-size:12px;font-weight:600;color:var(--muted)}
.stat .v{font-family:"Sora";font-size:22px;font-weight:700;margin-top:6px;display:flex;align-items:baseline;gap:6px}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted)}
.bar{height:6px;background:var(--sunken);border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.bar.low i{background:var(--gold)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);line-height:1.4}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--sunken)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(23,21,15,.44);z-index:60;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(540px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--sh-pop)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.sheet-h h2{font-size:16px;flex:1}
.sheet-b{flex:1;overflow-y:auto;padding:16px}
.sheet-f{padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:560px){.scrim{align-items:flex-end}.sheet{width:100%;height:94vh;border-radius:16px 16px 0 0}}

.schema{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.schema img{display:block;width:100%}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px;margin:14px 0}
.kv dt{color:var(--muted)}
.sec{margin-top:16px}
.sec h4{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.sec p{white-space:pre-wrap;font-size:13.5px}
.tl{list-style:none;border-left:2px solid var(--border);padding-left:12px;margin-top:6px}
.tl li{margin-bottom:10px;font-size:12.5px}
.tl b{font-weight:600}

/* form */
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;height:38px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface)}
.fld textarea{height:auto;min-height:66px;padding:9px 12px;resize:vertical}
.fld textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:120px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border:1px solid var(--border-strong);border-radius:999px;font-size:12px;font-weight:500;user-select:none}
.chip.on{background:var(--ink);color:#F3F1E8;border-color:var(--ink)}

/* generator */
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);font-size:20px;display:grid;place-items:center}
.stepper .n{font-family:"Sora";font-size:26px;font-weight:700;min-width:52px;text-align:center}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{border:1.5px solid var(--border-strong);border-radius:var(--r);padding:12px 10px;text-align:center;background:var(--surface)}
.choice svg{width:26px;height:22px;margin:0 auto 6px;display:block;color:var(--ink-2)}
.choice .l{font-size:12.5px;font-weight:600}
.choice .d{font-size:11px;color:var(--muted);margin-top:1px}
.choice.on{border-color:var(--gold);background:var(--gold-soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.accent-card{background:var(--gold-soft);border:1px solid #EFDCA6;border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px}
.accent-card svg{width:18px;height:18px;color:var(--amber);flex:none}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,90px);background:var(--black);color:#F1EFE6;padding:11px 18px;border-radius:var(--r);font-size:13px;box-shadow:var(--sh-pop);z-index:200;opacity:0;transition:transform .18s ease-out,opacity .18s ease-out;max-width:92vw}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.err{background:var(--red)}
.load{padding:36px;color:var(--muted);font-size:13px}
.skel{height:62px;border-radius:var(--r);background:linear-gradient(90deg,var(--sunken),#EDEBE3,var(--sunken));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

@media(max-width:900px){
  .shell-staff{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto}
  .sidebar .brand{padding:0 12px 0 4px}
  .sidebar .nav{flex-direction:row;margin:0}
  .sidebar .nav .grp,.sidebar .foot{display:none}
  .nav a .badge-n{margin-left:6px}
  .main{padding:16px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"><div class="load">Chargement…</div></div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const MFC = window.MFC || {};
const CREST = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#E5B02E"/><text x="20" y="27" font-family="Sora,Arial" font-size="20" font-weight="800" fill="#17150F" text-anchor="middle">M</text></svg>');

const $ = (s, r = document) => r.querySelector(s);
const h = (t, a = {}, ...k) => {
  const n = document.createElement(t);
  for (const [key, v] of Object.entries(a)) {
    if (v == null || v === false) continue;
    if (key === "class") n.className = v;
    else if (key === "html") n.innerHTML = v;
    else if (key[0] === "o" && key[1] === "n") n.addEventListener(key.slice(2), v);
    else n.setAttribute(key, v === true ? "" : v);
  }
  for (const c of k.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = s => { s = String(s || "").replace(/_/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); };
const fdate = s => { const d = new Date(String(s || "").replace(" ", "T")); return isNaN(d) ? (s || "") : d.toLocaleDateString("fr-CH", { day: "2-digit", month: "short", year: "numeric" }); };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* icons — one set, stroke 1.6, 24 viewport */
const I = {
  home: 'M3 10.5 12 3l9 7.5M5 9.5V21h5v-6h4v6h5V9.5',
  book: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm0 0v13m3-9h7M8 12h7',
  cal: 'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4',
  user: 'M4 20a8 8 0 0 1 16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z',
  users: 'M2 20a6 6 0 0 1 12 0M8 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM16 13a5 5 0 0 1 6 7M16 12a3 3 0 1 0 0-6',
  search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM21 21l-4.3-4.3',
  chev: 'M9 6l6 6-6 6',
  chevD: 'M6 9l6 6 6-6',
  plus: 'M12 5v14M5 12h14',
  check: 'M5 13l4 4L19 7',
  back: 'M15 6l-6 6 6 6',
  bell: 'M6 16V11a6 6 0 1 1 12 0v5l2 3H4l2-3ZM10 21a2 2 0 0 0 4 0',
  grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3ZM9 12l2 2 4-4',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  cog: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.2A1.6 1.6 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4.6 14H4a2 2 0 0 1 0-4h.2A1.6 1.6 0 0 0 5.7 7L5.6 7a2 2 0 1 1 2.8-2.9l.1.1A1.6 1.6 0 0 0 11 5.4V4a2 2 0 0 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-1.1 2.7',
  spark: 'M12 3v6M12 15v6M3 12h6M15 12h6M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3',
  q4: 'M4 5h16v14H4zM12 5v14',
  q2: 'M4 5h16v14H4zM4 12h16',
  qf: 'M4 5h16v14H4zM12 5v14M4 9h3M4 15h3M17 9h3M17 15h3',
};
const ic = (name, cls) => `<svg class="${cls || ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${I[name] || ''}"/></svg>`;

let toastT;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg;
  t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast", 3400);
}

async function api(action, o = {}) {
  const url = "api.php?action=" + action + (o.query ? "&" + new URLSearchParams(o.query) : "");
  const init = { credentials: "same-origin" };
  if (o.body) { init.method = "POST"; init.headers = { "Content-Type": "application/json" }; init.body = JSON.stringify(o.body); }
  const r = await fetch(url, init);
  if (o.raw) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }
  const d = await r.json().catch(() => ({ ok: false, error: "Réponse illisible." }));
  if (!r.ok || !d.ok) throw new Error(d.error || ("Erreur " + r.status));
  return d;
}

const STL = { brouillon: "Brouillon", en_revue: "En revue", valide: "Validé", publie: "Publié", archive: "Archivé" };
const PHASE_N = { echauffement: "Échauffement", analytique: "EASI 1", situatif: "EASI 2", integre: "EASI 3" };
const state = { ref: null, view: "", filters: {}, page: 0, val: { list: null, i: 0 },
  gen: { joueurs: 14, surface: "demi", duree: 75, accent: "" } };
const perim = id => (state.ref.perimetres || []).find(p => +p.id === +id);
const isCoach = () => state.ref.profil === "coach";

function thumb(id) {
  return h("span", { class: "thumb" }, h("img", { loading: "lazy", alt: "", src: "api.php?action=schema&id=" + id + "&fixe=1" }));
}
function statBadge(st, v) { return h("span", { class: "badge b-" + st }, h("span", { class: "dot" }), STL[st] + (v > 1 ? " · v" + v : "")); }

/* ============================================================ SHELL */
function nav() {
  if (isCoach()) return [
    ["accueil", "Accueil", "home"], ["biblio", "Bibliothèque", "book"],
    ["seances", "Séances", "cal"], ["profil", "Profil", "user"],
  ];

    if (transition === "publier") {
      await api("exercice_transition", { body: { id, transition: "valide" } });
      await api("exercice_transition", { body: { id, transition: "publie" } });
      toast("Validé et publié.");
    } else {
      await api("exercice_transition", { body: { id, transition, commentaire } });
      toast(transition === "valide" ? "Validé." : "Renvoyé.");
    }
    state.val.list.splice(state.val.i, 1);
    if (state.val.i >= state.val.list.length) state.val.i = Math.max(0, state.val.list.length - 1);
    refreshCounts(); paint();
  } catch (e) { toast(e.message, true); }

async function genForm(v) {
  v.innerHTML = "";

  v.append(h("div", { class: "page-h" },
    h("button", { class: "btn-quiet", style: "width:34px;height:34px;border-radius:8px", "aria-label": "Retour", onclick: back, html: ic("back") }),
    h("div", {}, h("h1", { style: "font-size:20px" }, "Générer une séance"))));

  const d = await api("equipes").catch(() => ({ equipes: [], mes_equipes: [] }));
  const mesRefs = new Set(d.mes_equipes || []);
  let equipes = d.equipes.filter(e => e.config.configure);
  if (mesRefs.size) equipes = equipes.filter(e => mesRefs.has(e.ref_id)).concat(equipes.filter(e => !mesRefs.has(e.ref_id)));
  if (!equipes.length) {
    v.append(h("div", { class: "empty" }, h("h3", {}, "Aucune équipe configurée"),
      h("p", {}, "Ton administrateur doit d'abord relier au moins une équipe à une tranche d'âge, une filière et un genre.")));

  }
  if (!g.equipe_ref_id || !equipes.some(e => e.ref_id === g.equipe_ref_id)) g.equipe_ref_id = equipes[0].ref_id;
  const eq = () => equipes.find(e => e.ref_id === g.equipe_ref_id);
  if (!g.accent) g.accent = (d.accent_defaut || {})[eq().config.tranche_age] || "";

    h("button", { class: "choice" + (g.surface === val ? " on" : ""), onclick: () => { g.surface = val; paint(); },
      html: ic(icn) + '<div class="l">' + l + '</div><div class="d">' + dim + '</div>' })))));

  // durée (pills)

  // accent

    h("div", { style: "flex:1" },
      h("div", { class: "s12 mut" }, "Accent proposé"),

    h("select", { style: "height:32px;border:1px solid #E3CE97;border-radius:8px;background:transparent;padding:0 6px",
      onchange: e => { g.accent = e.target.value; paint(); } },
      h("option", { value: "" }, "Aucun"),

  card.append(h("button", { class: "btn btn-primary btn-lg", html: ic("spark") + "Générer la séance", onclick: async (ev) => {
    const btn = ev.currentTarget; btn.disabled = true; btn.textContent = "Génération…";

    h("button", { class: "btn btn-primary", style: "flex:1", html: ic("check") + "Enregistrer la séance", onclick: async () => {
      try {
        await api("seance_save", { body: { seance: R.seance, blocs: R.blocs, ia: R.ia || {} } });
        toast("Séance enregistrée."); state.seance = { view: "list" }; paint();
      } catch (e) { toast(e.message, true); }
    } })));
}

async function sheetSeance(id) {
  const sheet = h("div", { class: "sheet" }, h("div", { class: "load" }, "Chargement…"));
  openSheet(sheet);
  let s;
  try { s = (await api("seance", { query: { id } })).seance; } catch (e) { sheet.innerHTML = ""; sheet.append(h("div", { class: "sheet-b" }, e.message)); return; }
  sheet.innerHTML = "";
  sheet.append(h("div", { class: "sheet-h" },
    h("button", { class: "btn-quiet", style: "width:32px;height:32px;border-radius:8px", "aria-label": "Fermer", onclick: closeSheet, html: ic("back") }),
    h("h2", {}, s.equipe_nom + " · " + fdate(s.date))));
  const b = h("div", { class: "sheet-b" });
  b.append(h("p", { class: "s13 mut", style: "margin-bottom:12px" }, s.duree_totale + " min · " + s.nb_joueurs_prevus + " joueurs · " + cap(s.surface_disponible) + (s.accent_principal ? " · " + (ACCENT_L[s.accent_principal] || s.accent_principal) : "")));
  if (s.explication_ia) b.append(h("div", { class: "accent-card", style: "margin-bottom:12px;align-items:flex-start" },
    h("span", { html: ic("spark") }), h("p", { class: "s13" }, s.explication_ia)));
  s.blocs.forEach((bl, i) => {
    b.append(h("div", { class: "sec" },
      h("div", { style: "display:flex;gap:8px;align-items:center" }, h("span", { class: "badge" }, bl.phase_label),
        h("span", { class: "s12 mut tnum" }, bl.duree + " min")),
      h("h3", { style: "font-size:14px;margin:6px 0" }, bl.titre),
      bl.exercice_id ? h("div", { class: "schema" }, h("img", { alt: "", src: "api.php?action=schema&id=" + bl.exercice_id })) : null,
      bl.consignes ? h("p", { class: "s13", style: "margin-top:6px" }, bl.consignes) : null));
  });
  sheet.append(b);
  sheet.append(h("div", { class: "sheet-f" },
    h("button", { class: "btn btn-danger", onclick: async () => {
      if (!confirm("Supprimer cette séance ?")) return;
      try { await api("seance_supprimer", { body: { id } }); toast("Séance supprimée."); closeSheet(); paint(); } catch (e) { toast(e.message, true); }
    } }, "Supprimer")));
}

/* ---------------- ÉQUIPES (admin) ---------------- */
async function vEquipes(v) {
  const d = await api("equipes");
  const R = state.ref;
  v.innerHTML = "";
  v.append(h("div", { class: "page-h" }, h("div", {}, h("h1", {}, "Équipes"),
    h("div", { class: "sub" }, "Reliées au référentiel de l'ERP. Renseigne les trois axes pour que le générateur puisse composer."))));
  if (!d.equipes.length) { v.append(h("div", { class: "empty" }, h("h3", {}, "Aucune équipe"),
    h("p", {}, "Le référentiel club de l'ERP ne renvoie aucune équipe pour la saison en cours."))); return; }

  const box = h("div", { class: "card", style: "overflow:hidden" });
  d.equipes.forEach(e => {
    const c = e.config;
    const s = (val, opts, ph) => { const el = h("select", { style: "height:32px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:0 6px" },
      h("option", { value: "" }, ph), opts.map(o => h("option", { value: o, selected: val === o }, cap(o)))); return el; };
    const tr = s(c.tranche_age, R.tranches_age, "Tranche");
    const fi = s(c.filiere, R.filieres, "Filière");
    const ge = s(c.genre, R.genres, "Genre"); ge.querySelector("option[value='']").remove();
    const md = s(c.mode, ["guide", "libre"], "Mode"); md.querySelector("option[value='']").remove();
    const pe = h("select", { style: "height:32px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:0 6px" },
      h("option", { value: "" }, "Périmètre"), R.perimetres.map(p => h("option", { value: p.id, selected: +c.perimetre_id === +p.id }, p.code)));
    box.append(h("div", { style: "padding:12px 14px;border-bottom:1px solid var(--border)" },
      h("div", { style: "display:flex;flex-wrap:wrap;gap:8px;align-items:center" },
        h("div", { style: "min-width:150px" }, h("div", { style: "font-weight:600" }, e.nom),
          h("div", { class: "s12 mut" }, e.categorie || "—"), !c.configure ? h("span", { class: "badge b-en_revue", style: "margin-top:3px" }, "À configurer") : null),
        tr, fi, ge, md, pe,
        h("span", { class: "sp", style: "margin-left:auto" }),
        h("button", { class: "btn btn-dark btn-sm", onclick: async () => {
          try { const r = await api("equipe_config_save", { body: { ref_id: e.ref_id, saison_id: d.saison,
            tranche_age: tr.value, filiere: fi.value, genre: ge.value, mode: md.value, perimetre_id: pe.value } });
            Object.assign(e, r.equipe); toast("Équipe configurée."); paint(); }
          catch (err) { toast(err.message, true); } } }, "Enregistrer"))));
  });
  v.append(box);
}
async function vProfil(v) {
  v.innerHTML = "";
  v.append(h("div", { class: "page-h" }, h("div", {}, h("h1", {}, "Profil"))));
  v.append(h("div", { class: "card card-p stack" },
    h("div", {}, h("div", { class: "s12 mut" }, "Connecté"), h("div", { style: "font-weight:600" }, MFC.nom || "")),
    h("div", {}, h("div", { class: "s12 mut" }, "Rôle dans le module"), h("div", {}, cap(state.ref.profil))),
    h("a", { class: "btn btn-ghost btn-sm", href: MFC.erpUrl || "/", style: "align-self:flex-start" }, "Retour à l'ERP")));
}

/* ============================================================ counts / boot */
async function refreshCounts() {
  if (!state.ref.peutValider) return;
  try {
    const d = await api("file_validation");
    state.ref._valCount = d.file.length;
    if (state.view !== "validation") state.val.list = d.file;
  } catch {}
  const el = document.querySelector(".nav a[href='#validation'] .badge-n");
  if (el) el.textContent = state.ref._valCount;
}

document.addEventListener("keydown", e => {
  if (state.view !== "validation" || !state.val.list || !state.val.list.length) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const x = state.val.list[state.val.i]; if (!x) return;
  if (e.key === "ArrowLeft" && state.val.i > 0) { state.val.i--; paint(); }
  else if (e.key === "ArrowRight" && state.val.i + 1 < state.val.list.length) { state.val.i++; paint(); }
  else if (e.key.toLowerCase() === "v") valDo(x.id, "valide", "");
  else if (e.key.toLowerCase() === "p") valDo(x.id, "publier", "");
  else if (e.key.toLowerCase() === "r") window.__valCom && window.__valCom.focus();
});

(async function boot() {
  try {
    state.ref = await api("referentiel");
    if (state.ref.peutValider) { try { state.ref._valCount = (await api("file_validation")).file.length; } catch {} }
    renderShell();
  } catch (e) {
    $("#root").innerHTML = '<div class="load">Impossible de charger le module : ' + esc(e.message) + "</div>";
  }
})();
</script>
